<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta property="og:type" content="website">
<meta property="og:title" content="PV Explorer">
<meta property="og:description" content="Quelle puissance installée arriverez-vous à récolter avant le lever du jour ? 30 pas de panneau solaire en panneau solaire, les mêmes soleils pour tout le monde, un classement chaque jour.">
<meta property="og:url" content="https://gabrielkasmi.github.io/random-maps/explorer/">
<meta property="og:image" content="https://gabrielkasmi.github.io/random-maps/explorer/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PV Explorer : une trace lumineuse traverse la France de nuit, un petit marcheur avec un panneau solaire sur la tête, un soleil ×3 à proximité.">
<meta name="twitter:card" content="summary_large_image">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1631">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PV Explorer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
@font-face{font-family:Unbounded;src:url(fonts/unbounded-latin.woff2) format('woff2');font-weight:500 900;font-display:swap}
@font-face{font-family:Manrope;src:url(fonts/manrope-latin.woff2) format('woff2');font-weight:500 800;font-display:swap}
/* World: France at night. Every step makes the day rise around a solar panel; the trace is a lit filament.
   One night blue, one amber family; daylight is the (recoloured) IGN map itself. */
:root{--r:3px;
  --night:#0e1631;--night-2:#18234a;--glass:rgba(14,22,49,.86);--edge:rgba(255,178,46,.38);
  --amber:#ffb22e;--amber-2:#ffcf6b;--sun:#ffcf3f;--day:#fff4dc;--day-soft:#c9c3b4;
  --display:Unbounded,"Arial Black",system-ui,sans-serif;--sans:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark; /* the night is the material, not a theme */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--day);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--amber-2);outline-offset:2px}
[hidden]{display:none!important}
#map{position:fixed;inset:0;background:var(--night)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
/* credits: a folded 'i' bottom left; unfolded, a readable glass label */
.credits{position:fixed;z-index:31;left:12px;bottom:calc(12px + var(--sb));display:flex;align-items:center;gap:6px;max-width:calc(100vw - 24px)}
.credits>button{width:28px;height:28px;padding:0;border-radius:50%;font:800 14px/1 Georgia,serif;font-style:italic;color:var(--day-soft)}
.credits>button[aria-expanded="true"]{color:var(--night);background:var(--amber-2);border-color:var(--amber-2)}
.credits p{margin:0;padding:6px 10px;border-radius:var(--r);font-size:12px;line-height:1.35;color:var(--day)}
.credits a{color:var(--amber-2)}
/* scale bar, bottom right, in the same glass */
.maplibregl-ctrl-bottom-right .maplibregl-ctrl-scale{margin:0 12px calc(14px + var(--sb)) 0;background:rgba(14,22,49,.92);border:3px solid var(--amber-2);border-top:0;
  color:var(--day);font:800 13px/1 var(--sans);padding:5px 6px 3px;text-align:center;box-sizing:border-box;font-variant-numeric:tabular-nums;
  box-shadow:0 2px 10px rgba(0,0,0,.6)}

.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:12px 22px;border:0;border-radius:var(--r);
  background:var(--amber);color:var(--night);font:800 16px var(--sans);transition:transform .12s var(--ease),background .15s}
.cta:hover{background:var(--amber-2)}
.cta:active{transform:scale(.97)}
.ghost{min-height:44px;padding:10px 16px;border:1px solid var(--edge);border-radius:var(--r);background:transparent;color:var(--day);font-weight:700}
.ghost:hover{background:rgba(255,178,46,.12)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:.5em}
.link{border:0;background:none;padding:6px 2px;color:var(--day-soft);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---------- top bar ---------- */
.bar{position:fixed;z-index:35;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--st)) 16px 10px;pointer-events:none}
.bar>*{pointer-events:auto}
.bar .back{font-size:13px;color:var(--day-soft);text-decoration:none}
.bar .back:hover{color:var(--day);text-decoration:underline}
.bar .sp{flex:1}
.lang{display:flex;gap:.7em;font-size:13px}
.lang a{text-decoration:none;color:var(--day-soft)}
.lang a[aria-current="true"]{color:var(--day);font-weight:800;text-decoration:underline;text-decoration-color:var(--amber);text-decoration-thickness:2px}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800}
body.playing .bar{display:none}

/* ---------- intro ---------- */
#intro{position:fixed;z-index:30;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(60px + var(--st)) 16px calc(24px + var(--sb));
  background:radial-gradient(ellipse at 50% 120%,rgba(255,159,28,.22),transparent 60%),rgba(14,22,49,.55);overflow:auto}
.intro-card{width:min(26rem,100%);padding:26px 22px 22px;border-radius:var(--r);text-align:center}
.logo{font:900 clamp(34px,10vw,46px)/1 var(--display);letter-spacing:-.03em;color:var(--amber-2);margin:0}
.lede{font-size:17px;margin:12px 0 18px;text-wrap:pretty}
.rules{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:8px;text-align:left;font-size:14px;color:var(--day-soft)}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules b{color:var(--day)}
.rules .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--night-2);border:1px solid var(--edge);color:var(--amber-2);font:800 12px var(--display)}
.pseudo{display:flex;gap:8px;margin:0 0 14px}
.pseudo input{flex:1;min-width:0;min-height:48px;padding:10px 14px;border:1px solid var(--edge);border-radius:var(--r);background:var(--night);color:var(--day);font-size:16px;font-weight:700}
.pseudo input::placeholder{color:#8a8fa3}
.pseudo .dice{width:48px;border:1px solid var(--edge);border-radius:var(--r);background:var(--night-2);font-size:20px}
.intro-card .cta{width:100%}
.fine{font-size:12px;color:var(--day-soft);margin:14px 0 0}
.err{color:var(--amber-2);font-size:13px;min-height:1.2em;margin:-6px 0 8px}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:10;left:0;right:0;margin:0 auto;width:min(32rem,100%);padding:0 12px;pointer-events:none}
.hud *{pointer-events:auto}
.hud.top{top:calc(10px + var(--st));display:flex;align-items:flex-start;gap:10px;padding-right:12px}
.hud.top,.hud.top *{pointer-events:none}
.hud.bot{bottom:calc(12px + var(--sb));display:flex;align-items:flex-end;justify-content:center;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
/* floating counter: no panel, the night behind it is dark enough; a soft shadow keeps it legible over lit areas */
.float{flex:1;min-width:0;padding-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.5)}
.float .kw{display:flex;align-items:baseline;gap:6px}
.float .meta{margin-top:5px;font:700 14px var(--sans);color:var(--day);font-variant-numeric:tabular-nums;white-space:nowrap}
.float .meta b{color:var(--amber-2);font-weight:800}
.float .quests{margin-top:7px}
/* steps left: in the middle of the directional cross */
.pad .steps{grid-area:2/2;place-self:center;width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  color:var(--sc,var(--day));border:2px solid var(--sc,var(--edge));transition:color .4s,border-color .4s}
.pad .steps b{font:900 21px var(--display);font-variant-numeric:tabular-nums}
.pad .steps small{font:800 8.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;margin-top:2px;color:var(--day-soft)}
.steps.urgent b{animation:beat .9s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.15)}}
.score{font:900 clamp(26px,8vw,34px)/1 var(--display);color:var(--amber-2);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font:600 13px var(--display);color:var(--amber-2)}
.mult{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:900 17px var(--display);color:var(--night);background:radial-gradient(circle at 40% 35%,#ffe7a3,var(--amber))}
.mult.x1{background:var(--night-2);color:var(--day-soft);border:1px solid var(--edge)}
.mult.pop{animation:pop .5s var(--ease)}
.meta .combo{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:rgba(255,178,46,.22);border:1px solid var(--amber);color:var(--sun);font:800 11.5px var(--sans);text-shadow:none}
.meta .combo.max{background:var(--amber);color:var(--night)}
@keyframes pop{40%{transform:scale(1.25)}}
.info{flex:1;min-width:0;padding:10px 12px;border-radius:var(--r);font-size:13px;line-height:1.35}
.info b{display:block;font-size:14px}
.info .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.info .act button{min-height:36px;padding:6px 12px;font-size:13px}
.pad{flex:none;display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.pad button{border-radius:50%;font:800 16px var(--display);color:var(--amber-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .1s var(--ease),background .15s}
.pad button:not(:disabled):active{transform:scale(.9);background:var(--night-2)}
.pad button:disabled{opacity:.28;cursor:default}
/* warmer button = more power left that way (0-3) */
.pad button[data-r="1"]{background:rgba(255,159,28,.22)}
.pad button[data-r="2"]{background:rgba(255,159,28,.5);color:var(--day)}
.pad button[data-r="3"]{background:var(--amber);color:var(--night);border-color:var(--amber-2)}
.pad button[data-r="3"] .rays b{background:var(--night)!important}
.pad button[data-r="2"] .rays.r2 b:nth-child(-n+2){background:var(--day)}
.pad button.seen{color:rgba(255,207,107,.45);border-style:dashed}
.rays{display:flex;gap:3px}
.rays b{width:5px;height:5px;border-radius:50%;background:rgba(255,207,107,.2)}
.rays.r1 b:first-child,.rays.r2 b:nth-child(-n+2),.rays.r3 b{background:var(--amber-2)}
.pad .n{grid-area:1/2}.pad .w{grid-area:2/1}.pad .e{grid-area:2/3}.pad .s{grid-area:3/2}

.gain{position:fixed;z-index:11;left:50%;top:calc(162px + var(--st));transform:translate(-50%,0);padding:4px 12px;border-radius:var(--r);
  font:900 19px var(--display);color:var(--amber-2);background:var(--glass);opacity:0;transition:opacity .2s,transform .7s var(--ease);pointer-events:none;white-space:nowrap}
.gain.on{opacity:1;transform:translate(-50%,-12px)}
.gain.bonus{color:var(--night);background:var(--sun)}
.side-btns{position:fixed;z-index:10;right:12px;top:calc(124px + var(--st));display:grid;gap:8px}

/* quests: chips under the score while playing, a list on the intro card */
.quests{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px;text-shadow:none}
.quests .q{display:flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border-radius:999px;background:rgba(14,22,49,.8);border:1px solid var(--edge);font:700 11.5px var(--sans);color:var(--day);white-space:nowrap}
.quests .q i{width:15px;height:15px;flex:none;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;font:900 9px var(--display);font-style:normal;color:var(--night)}
.quests .q small{color:var(--day-soft);font-weight:600;font-variant-numeric:tabular-nums}
.quests .q.done{border-color:var(--amber);background:rgba(255,178,46,.24)}
.quests .q.done i{background:var(--amber);border-color:var(--amber)}
.quests.intro{flex-direction:column;align-items:stretch;margin:0 0 16px}
.quests.intro .q{white-space:normal;font-size:13.5px;padding:7px 10px;border-radius:var(--r);background:var(--night-2);text-align:left}
.qt{font:800 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--amber-2);margin:0 0 6px;text-align:left}
/* fact card: drops in at the top of the screen (over the score for a few seconds), closes by itself */
.fact{position:fixed;z-index:40;left:12px;right:12px;margin:0 auto;max-width:26rem;top:calc(10px + var(--st));padding:11px 36px 10px 14px;border-radius:var(--r);
  box-shadow:0 10px 30px rgba(5,9,22,.55);opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .45s var(--ease)}
.fact.on{opacity:1;transform:none}
.fact .cat,.alist .cat{font:800 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--amber-2)}
.fact[data-cat="dpt"] .cat{color:#7ee0a1}
.fact h3{margin:3px 0 4px;font:900 15px/1.2 var(--display);color:var(--day)}
.fact p{margin:0;font-size:13.5px;line-height:1.42}
.fact .foot{margin-top:6px;font-size:11.5px;color:var(--day-soft)}
.fact .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border:0;background:none;color:var(--day-soft);font-size:14px}
/* album */
#albumDlg{overflow:auto}
.amap{margin:8px 0 4px}
.amap svg{display:block;width:100%;height:auto;max-height:44dvh}
.amap path{fill:var(--night-2);stroke:rgba(255,178,46,.3);stroke-width:1.5;stroke-linejoin:round}
.amap path.on{fill:rgba(255,178,46,.42);stroke:var(--amber)}
.amap circle.todo{fill:rgba(255,244,220,.22)}
.amap circle.got{fill:var(--sun);stroke:var(--night);stroke-width:2.5;cursor:pointer}
.alist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.alist li{padding:9px 11px;border-radius:var(--r);background:var(--night-2)}
.alist li.flash{outline:2px solid var(--amber)}
.alist b{display:block;margin-top:2px;font:800 14px/1.25 var(--display)}
.alist p{margin:4px 0;font-size:13px}
.alist a{font-size:12px;color:var(--amber-2)}
.alist .empty{color:var(--day-soft)}

/* sheets */
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;margin:0 auto;width:min(30rem,100%);padding:20px 18px calc(18px + var(--sb));border-radius:var(--r) var(--r) 0 0;
  animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet h2{margin:0;font:900 22px/1.15 var(--display);letter-spacing:-.02em}
.sheet .big{font:900 clamp(36px,11vw,48px)/1 var(--display);color:var(--amber-2);margin:12px 0 2px;font-variant-numeric:tabular-nums}
.sheet .sub{color:var(--day-soft);margin:0 0 14px;font-size:14px}
.sheet .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px}
.sheet .stats div{padding:8px;border-radius:var(--r);background:var(--night-2);text-align:center;font-size:12px;color:var(--day-soft)}
.sheet .stats b{display:block;font:800 15px var(--display);color:var(--day);white-space:nowrap}
.sheet .btns{display:flex;justify-content:center;gap:8px}
.sq{width:48px;min-height:48px;padding:0;flex:none}
.record{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:var(--r);background:var(--sun);color:var(--night);font:800 11px var(--sans);vertical-align:middle}

/* share */
#share{position:fixed;z-index:50;inset:0;display:grid;place-items:center;padding:12px;background:rgba(5,9,22,.8)}
.share-card{width:min(24rem,100%);max-height:calc(100dvh - 24px);overflow:auto;padding:16px;border-radius:var(--r);text-align:center}
.share-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.share-card h2{margin:0;font:900 18px var(--display)}
#shareImgBox{min-height:200px;display:grid;place-items:center}
#shareImgBox img{display:block;width:100%;height:auto;max-height:58dvh;object-fit:contain;border-radius:var(--r);background:var(--night)}
#shareGo{margin-top:12px}
.share-card .alt{display:flex;justify-content:center;gap:18px;margin-top:6px}
.msg{min-height:1.3em;font-size:13px;color:var(--amber-2);margin:6px 0 0}

dialog{border:1px solid var(--edge);border-radius:var(--r);background:var(--night);color:var(--day);padding:20px;width:min(32rem,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(5,9,22,.7)}
dialog h2{margin:0 0 8px;font:900 19px var(--display)}
dialog p{margin:.6em 0;font-size:14px}
dialog .fine{font-size:12.5px;color:var(--day-soft)}
.about-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.about-foot .close{margin-left:auto}
.board{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;max-height:50dvh;overflow:auto}
.board li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);background:var(--night-2)}
.board li.me{cursor:pointer;background:rgba(255,178,46,.2);outline:2px solid var(--amber);outline-offset:-2px}
.board li.me .who,.board li.me .pts{color:var(--amber-2)}
.board .rk{width:1.8em;font:800 14px var(--display);color:var(--amber-2)}
.board .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.board .who em{font-style:normal;color:var(--day-soft);font-weight:500}
.board .who small{display:block;font:500 12px var(--sans);color:var(--day-soft);font-variant-numeric:tabular-nums}
.board .pts{font:800 15px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.board .pts small{display:block;font:600 10px var(--sans);color:var(--day-soft)}
.sheet .big small{font:700 .4em var(--display);margin-left:.2em}
.board .gap{background:none;justify-content:center;padding:0;color:var(--day-soft)}
.rank{margin:-4px 0 10px;font-weight:700;color:var(--amber-2);min-height:1.2em}
.rank:empty{display:none}
.board .empty{color:var(--day-soft)}
.toast{position:fixed;z-index:60;left:50%;top:calc(118px + var(--st));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:9px 14px;border-radius:var(--r);font-size:14px;
  text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.loading{position:fixed;z-index:70;inset:0;display:grid;place-items:center;background:var(--night);color:var(--day-soft);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (min-width:720px){.hud.bot{width:min(36rem,100%)}}
/* touch screens: swipes, the N / S / E / W markers on the map, and a smaller controller at the bottom */
@media (pointer:coarse){.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:3px}.pad button{font-size:14px;gap:3px}.pad .steps b{font-size:19px}}
/* ---------- tutorial (first game, then from the menu) ---------- */
#tuto{position:fixed;z-index:45;inset:0;display:grid;place-items:center;padding:calc(16px + var(--st)) 16px calc(16px + var(--sb));background:rgba(5,9,22,.72)}
.tuto-card{width:min(24rem,100%);padding:16px 16px 14px;border-radius:var(--r);text-align:center;touch-action:pan-y}
.tuto-scene{aspect-ratio:2/1;border:1px solid var(--edge);border-radius:var(--r);background:var(--night);overflow:hidden}
.tuto-scene svg{display:block;width:100%;height:100%}
#tuto h2{margin:14px 0 6px;font:900 20px/1.15 var(--display);letter-spacing:-.02em;color:var(--amber-2)}
.tuto-cap{margin:0;min-height:4.4em;font-size:15px;text-wrap:pretty}
.tuto-dots{display:flex;justify-content:center;gap:4px;margin:10px 0 12px}
.tuto-dots button{width:28px;height:28px;padding:0;border:0;background:none;display:grid;place-items:center}
.tuto-dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--night-2);border:1px solid var(--edge)}
.tuto-dots button[aria-current="true"]::after{background:var(--amber);border-color:var(--amber)}
.tuto-btns{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tuto-btns .cta{flex:1;max-width:14rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading" data-t="loading">…</div>
<div id="map"></div>
<canvas id="fx"></canvas>

<header class="bar">
  <a class="back" href="../" data-t="back"></a>
  <div class="sp"></div>
  <nav class="lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav>
  <button class="round glass" id="aboutBtn" type="button" data-t-aria="about">?</button>
</header>

<!-- 1. intro: pseudo -->
<section id="intro" hidden>
  <div class="intro-card glass">
    <h1 class="logo">PV Explorer</h1>
    <p class="lede" data-t="lede"></p>
    <h2 class="qt" data-t="questsT"></h2>
    <ul class="quests intro" id="introQuests"></ul>
    <form id="pseudoForm" autocomplete="off">
      <label class="sr" for="pseudoIn" data-t="pseudoLabel"></label>
      <div class="pseudo"><input id="pseudoIn" maxlength="24" minlength="2" required data-t-ph="pseudoPh"><button class="dice" type="button" id="dice" data-t-aria="suggest">🎲</button></div>
      <p class="err" id="pseudoErr" role="alert"></p>
      <button class="cta" type="submit" data-t="play"></button>
    </form>
    <p class="fine" data-t="local"></p>
  </div>
</section>

<!-- 3. play -->
<div class="hud top" id="playHud" hidden>
  <div class="float">
    <div class="kw"><span class="score" id="score">0</span><span class="unit" id="unit">kWc</span></div>
    <div class="meta" id="meta"></div>
    <ul class="quests" id="quests" aria-label="Quêtes"></ul>
  </div>
  <span class="mult x1" id="mult">×1</span>
</div>
<div class="side-btns" id="sideBtns" hidden>
  <button class="round glass" id="recenter" type="button" data-t-aria="recenter">◎</button>
  <button class="round glass" id="menuBtn" type="button" data-t-aria="menu">⋯</button>
</div>
<div class="gain" id="gain" aria-hidden="true"></div>
<aside class="fact glass" id="fact" hidden role="status"><span class="cat"></span><h3></h3><p></p><div class="foot"></div><button class="x" id="factClose" type="button" data-t-aria="close">✕</button></aside>
<div class="hud bot" id="playBot" hidden>
  <div class="sr" id="info" aria-live="polite"></div>
  <div class="pad" role="group" data-t-aria="dirs">
    <button class="n glass" data-d="0"></button><button class="w glass" data-d="3"></button>
    <span class="steps mid glass" id="steps" role="status"><b id="stepsN">30</b><small data-t="steps"></small></span>
    <button class="e glass" data-d="2"></button><button class="s glass" data-d="1"></button>
  </div>
</div>

<!-- 4. end -->
<section class="sheet glass" id="end" hidden aria-labelledby="endT">
  <h2 id="endT"></h2>
  <div class="big" id="endScore"></div>
  <p class="sub" id="endSub"></p>
  <div class="stats" id="endStats"></div>
  <p class="rank" id="endRank" aria-live="polite"></p>
  <div class="btns"><button class="ghost" id="againBtn" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 3v4h4"/></svg><span data-t="again"></span></button><button class="cta sq" id="shareBtn" type="button" data-t-aria="share" data-t-title="share"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg></button><button class="ghost sq" id="viewBtn" type="button" data-t-aria="view" data-t-title="view"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V14h6v7M9 21V8h6v13M15 21v-10h6v10M3 21h18"/></svg></button></div>
</section>

<div id="share" hidden>
  <div class="share-card glass" role="dialog" aria-modal="true" aria-labelledby="shareT">
    <div class="head"><h2 id="shareT" data-t="share"></h2><button class="round glass" id="shareClose" type="button" data-t-aria="close">✕</button></div>
    <div id="shareImgBox"></div>
    <button class="cta" id="shareGo" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg><span data-t="shareGo"></span></button>
    <div class="alt"><button class="link" id="shareDl" type="button" data-t="download"></button><button class="link" id="shareCopy" type="button" data-t="copy"></button></div>
    <p class="msg" id="shareMsg" role="status"></p>
  </div>
</div>

<dialog id="menu">
  <h2 data-t="menuT"></h2>
  <div style="display:grid;gap:8px;margin-top:12px">
    <button class="ghost" id="mRestart" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 3v4h4"/></svg><span data-t="restart"></span></button>
    <button class="ghost" id="mBoard" type="button" data-t="view"></button>
    <button class="ghost" id="mAlbum" type="button" data-t="album"></button>
    <button class="ghost" id="mHelp" type="button" data-t="help"></button>
    <button class="ghost" id="mAbout" type="button" data-t="about"></button>
    <button class="ghost" id="mPseudo" type="button" data-t="changePseudo"></button>
    <form method="dialog"><button class="cta" style="width:100%" data-t="close"></button></form>
  </div>
</dialog>
<dialog id="board" aria-labelledby="boardT">
  <h2 id="boardT"></h2>
  <ol class="board" id="boardList"></ol>
  <p class="fine" id="boardNote"></p>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="cta" data-t="close"></button></form>
</dialog>
<dialog id="albumDlg" aria-labelledby="albumT">
  <h2 id="albumT" data-t="albumT"></h2>
  <p class="fine" id="albumSub"></p>
  <div class="amap" id="albumMap"></div>
  <p class="fine" id="albumNote"></p>
  <ol class="alist" id="albumList"></ol>
  <form method="dialog" style="text-align:right;margin-top:12px"><button class="cta" data-t="close"></button></form>
</dialog>
<dialog id="about">
  <h2 data-t="aboutT"></h2>
  <div id="aboutBody"></div>
  <form method="dialog" class="about-foot"><a class="ghost" href="../" style="text-decoration:none"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Random Maps</span></a><button class="ghost" id="shareGame" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></svg><span data-t="shareGame"></span></button><button class="cta close" data-t="close"></button></form>
</dialog>
<section id="tuto" hidden role="dialog" aria-modal="true" aria-labelledby="tutoT">
  <div class="tuto-card glass" id="tutoCard">
    <div class="tuto-scene" id="tutoScene" aria-hidden="true"></div>
    <h2 id="tutoT"></h2>
    <p class="tuto-cap" id="tutoCap" aria-live="polite"></p>
    <div class="tuto-dots" id="tutoDots"></div>
    <div class="tuto-btns"><button class="link" id="tutoSkip" type="button" data-t="tutSkip"></button><button class="cta" id="tutoNext" type="button" data-t="tutNext"></button></div>
  </div>
</section>
<div class="credits" id="credits"><button class="glass" id="creditsBtn" type="button" aria-expanded="false" aria-controls="creditsTxt" data-t-aria="credits">i</button><p class="glass" id="creditsTxt" hidden>Plan IGN © <a href="https://www.ign.fr/" target="_blank" rel="noopener">IGN</a> · <a id="creditsOpm" href="https://deeppvmapper.fr/" target="_blank" rel="noopener">OpenPVMapper</a> (CC BY 4.0) · <a href="https://maplibre.org/" target="_blank" rel="noopener">MapLibre</a></p></div>
<div class="toast glass" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
<script type="module" src="js/app.js?v=20261122e"></script>
</body>
</html>
