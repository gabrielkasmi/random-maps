function hourAt(e){ const v = state.view; if (!v?.geom) return null; const x = e.clientX - cv.getBoundingClientRect().left; const i = Math.floor((x - v.geom.L) / v.geom.pw * 4 * v.n); return i >= 0 && i < 4 * v.n ? i : null; }
cv.addEventListener('pointermove', e => { hover = hourAt(e); draw(); showTip(); });
cv.addEventListener('pointerleave', () => { hover = null; draw(); showTip(); });
cv.addEventListener('click', e => { const h = hourAt(e); if (h != null){ state.qi = h; hover = null; showTip(); renderHour(); } });
cv.addEventListener('keydown', e => {
  if (!state.view) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); state.qi = Math.max(0, Math.min(4 * state.view.n - 1, state.qi + (e.key === 'ArrowRight' ? 1 : -1))); $('hour').value = state.qi; renderHour(); }
});
new ResizeObserver(() => { draw(); showTip(); }).observe(cv);

function renderTable(){
  const v = state.view, k = p => p ? nf1.format(p.mid) : '–', b = p => p ? `${nf1.format(p.lo)}–${nf1.format(p.hi)}` : '';
  let html = `<thead><tr><th>${T.tHour}</th><th>${T.tFc} (kW)</th><th>${T.tRange}</th><th>${T.tRe} (kW)</th><th>${T.tRange}</th></tr></thead><tbody>`;
  v.times.forEach((t, h) => {
    const f = v.fc[h], r = v.re[h];
    if ((!f || f.hi === 0) && (!r || r.hi === 0)) return;
    html += `<tr data-h="${h}" class="${h === state.qi >> 2 ? 'on' : ''}"><td class="tnum">${esc(fmtHour(t - 3600))}</td><td class="tnum">${k(f)}</td><td class="tnum">${b(f)}</td><td class="tnum">${k(r)}</td><td class="tnum">${b(r)}</td></tr>`;
  });
  $('tbl').innerHTML = html + '</tbody>';
}

/* ---------- Controls ---------- */
// Day
const dateIn = $('date');
function syncDays(){
  const today = parisDate();
  dateIn.min = MIN_DATE; dateIn.max = today; dateIn.value = state.date;
  $('date-label').textContent = fmtDayShort(state.date);
  dateIn.parentElement.classList.toggle('custom', state.date !== today && state.date !== shiftDate(today, -1));
  $('d-today').setAttribute('aria-pressed', String(state.date === today));
  $('d-yest').setAttribute('aria-pressed', String(state.date === shiftDate(today, -1)));
}
function setDate(d){ state.date = d; state.qi = null; runEngine(); }
dateIn.addEventListener('change', () => { if (dateIn.value) setDate(dateIn.value); });
$('d-today').addEventListener('click', () => setDate(parisDate()));
$('d-yest').addEventListener('click', () => setDate(shiftDate(parisDate(), -1)));
syncDays();

// Radius (point zones): logarithmic, live ring, fetch on release (a smaller radius reuses the loaded set).
const rFromSlider = s => Math.round(R_MIN * (R_MAX / R_MIN) ** (s / 1000) / 50) * 50;
const sliderFromR = r => Math.round(1000 * Math.log(r / R_MIN) / Math.log(R_MAX / R_MIN));
$('radius').value = sliderFromR(state.r);
$('radius-val').textContent = fmtDist(state.r);
$('radius').addEventListener('input', e => {
  state.r = rFromSlider(+e.target.value); $('radius-val').textContent = fmtDist(state.r);
  if (state.zone?.type === 'circle'){ state.zone.r = state.r; drawZone(); renderZoneName(); }
});
$('radius').addEventListener('change', () => { if (state.zone?.type === 'circle'){ fitZone(zoneBounds()); loadZone(); } });

// Around a site: the year view, or one day on the same rooftops (and back).
$('to-day').addEventListener('click', () => { setMode('day'); state.view = null; state.qi = null; runEngine(); });
$('to-site').addEventListener('click', () => { setMode('site'); computeYear(); });

// Map tap: around this point, or the whole commune under it.
map.on('click', e => {
  const ll = [e.latlng.lat, e.latlng.lng];
  if (!inFrance(ll)){ showResults(); setStatus(T.outside, 'error'); return; }
  const box = document.createElement('div'); box.className = 'pick';
  const bPoint = document.createElement('button'); bPoint.type = 'button';
  bPoint.innerHTML = `<span>${esc(T.pickPoint())}<small>${esc(T.pickPointSub(fmtDist(state.r)))}</small></span>`;
  const bCom = document.createElement('button'); bCom.type = 'button'; bCom.disabled = true;
  bCom.innerHTML = `<span>${esc(T.pickLoading)}</span>`;
  box.append(bPoint, bCom);
  const pop = L.popup({closeButton: false, minWidth: 210}).setLatLng(e.latlng).setContent(box).openOn(map);
  bPoint.addEventListener('click', () => { $('q').value = ''; selectCircle(ll, T.zonePick); });
  communeAt(ll).then(f => {
    if (!f){ bCom.remove(); return; }
    bCom.disabled = false;
    bCom.innerHTML = `<span>${esc(T.pickCommune(f.properties.nom))}<small>${esc(T.pickCommuneSub)}</small></span>`;
    bCom.addEventListener('click', () => { $('q').value = f.properties.nom; selectCommune(f.properties.code, f); });
    pop.update();
  }).catch(() => bCom.remove());
});

$('locate').addEventListener('click', () => {
  const btn = $('locate');
  if (!navigator.geolocation){ showResults(); setStatus(T.denied, 'error'); return; }
  btn.setAttribute('aria-busy', 'true');
  navigator.geolocation.getCurrentPosition(
    p => { btn.removeAttribute('aria-busy'); $('q').value = T.myPos; previewZone({type: 'circle', center: [round(p.coords.latitude), round(p.coords.longitude)], label: T.myPos}); },
    () => { btn.removeAttribute('aria-busy'); showResults(); setStatus(T.denied, 'error'); },
    {enableHighAccuracy: false, timeout: 12000, maximumAge: 300000}
  );
});

// Unified search: communes (geo.api.gouv.fr) first, then addresses (IGN). Only the typed text is sent.
const q = $('q'), sugg = $('sugg');
let items = [], sel = -1, searchAbort = null, debounce = null;
function renderSugg(){
  sugg.innerHTML = items.map((it, i) => `<li role="option" id="opt-${i}" aria-selected="${i === sel}"><span>${esc(it.label)}</span><span class="tag">${esc(it.tag)}</span></li>`).join('');
  sugg.hidden = !items.length; q.setAttribute('aria-expanded', String(!!items.length));
  if (sel >= 0) q.setAttribute('aria-activedescendant', `opt-${sel}`); else q.removeAttribute('aria-activedescendant');
}
function choose(i){
  const it = items[i]; if (!it) return;
  q.value = it.site ? it.site.label : it.name || it.label; items = []; renderSugg(); q.blur();
  if (it.site) selectSite(it.site);
  else if (it.code) selectCommune(it.code, null, it.name);
  else previewZone({type: 'circle', center: [round(it.lat), round(it.lon)], label: it.label.split(',')[0]});
}
/* Sites: searched locally (no call), every typed word must appear in the name, address or commune; biggest first. */
function searchSites(text){
  if (!SITES) return [];
  const words = norm(text).split(/[^a-z0-9]+/).filter(w => w.length > 1);
  if (!words.length) return [];
  return SITES.filter(s => words.every(w => s.key.includes(w))).sort((a, b) => b.mwh - a.mwh).slice(0, 3)
    .map(s => ({label: `${s.label} · ${s.commune}`, site: s, tag: T.tagSite}));
}
async function search(text){
  searchAbort?.abort(); searchAbort = new AbortController(); const signal = searchAbort.signal;
  const [c, a] = await Promise.allSettled([searchCommunes(text, signal), /^\d{5}$/.test(text) ? Promise.resolve([]) : searchAddress(text, signal)]);
  if (signal.aborted) throw new DOMException('aborted', 'AbortError');
  return [...(c.value || []).slice(0, 3), ...searchSites(text), ...(a.value || []).slice(0, 4)];
}
q.addEventListener('input', () => {
  clearTimeout(debounce); setTag('');
  const text = q.value.trim();
  if (text.length < 2){ items = []; renderSugg(); return; }
  debounce = setTimeout(async () => {
    try { items = await search(text); sel = -1; renderSugg(); }
    catch (e){ if (e.name !== 'AbortError'){ items = []; renderSugg(); } }
  }, 220);
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); sel = (sel + 1) % items.length; renderSugg(); }
  else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); sel = (sel - 1 + items.length) % items.length; renderSugg(); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    if (items.length) choose(sel >= 0 ? sel : 0);
    else if (q.value.trim().length >= 2) search(q.value.trim()).then(r => { items = r; if (r.length) choose(0); else { showResults(); setStatus(T.noResult); } }).catch(() => {});
  } else if (e.key === 'Escape'){ items = []; renderSugg(); }
});
sugg.addEventListener('pointerdown', e => { const li = e.target.closest('li'); if (li){ e.preventDefault(); choose(+li.id.slice(4)); } });
q.addEventListener('blur', () => setTimeout(() => { items = []; renderSugg(); }, 150));
q.addEventListener('focus', () => loadSites().catch(e => console.error(e)));

// Sources & limits
$('more').addEventListener('click', () => { const d = $('d-about'); d.open = true; if (sheet.dataset.size === 'peek' || sheet.dataset.size === 'half') setSheet('full'); d.scrollIntoView({block: 'start', behavior: reduced() ? 'auto' : 'smooth'}); });

// Assumptions: recompute only, never refetch (the ratio changes kWp, not the cells' weather).
const H = state.hyp;
const outs = {
  tilt: v => `${v}°`, az: v => azLabel(v), pr: v => nf2.format(v), ratio: v => `${nf1.format(v)} m²/${T.kwp}`,
  dtilt: v => `±${v}°`, daz: v => `±${v}°`, dpr: v => `±${nf2.format(v)}`,
};
function syncHypUI(){
  for (const k of Object.keys(outs)){ $(k).value = H[k]; $(`${k}-v`).textContent = outs[k](H[k]); }
  document.querySelectorAll('input[name=orient]').forEach(r => r.checked = r.value === H.orient);
  $('tcorr').checked = H.tcorr;
  const fixed = H.orient === 'fix';
  $('tilt').disabled = $('az').disabled = !fixed;
  $('c-tilt').classList.toggle('off', !fixed); $('c-az').classList.toggle('off', !fixed);
}
const recompute = () => { if (state.mode === 'site'){ if (state.yview) computeYear(); } else if (state.view) compute(); };
for (const k of Object.keys(outs)) $(k).addEventListener('input', e => {
  H[k] = +e.target.value; $(`${k}-v`).textContent = outs[k](H[k]);
  if (k === 'ratio' && currentRows().length) renderInstallInfo(currentRows());
  recompute();
});
document.querySelectorAll('input[name=orient]').forEach(r => r.addEventListener('change', () => { H.orient = r.value; syncHypUI(); recompute(); }));
$('tcorr').addEventListener('change', e => { H.tcorr = e.target.checked; recompute(); });
$('reset').addEventListener('click', () => { Object.assign(H, DEF); syncHypUI(); if (currentRows().length) renderInstallInfo(currentRows()); recompute(); });
syncHypUI();

// Live: refresh today's output every 10 min while the tab is visible (satellite hours keep arriving).
setInterval(() => { if (state.mode === 'day' && state.view && state.date === parisDate() && document.visibilityState === 'visible') runEngine(); }, TODAY_TTL);

// Menu wiring: ACC sites (loop, search, filters, list, "Show") and output (search, locate, preview, compute).
$('sq').placeholder = T.sq; $('sq').setAttribute('aria-label', T.sq);
$('intro-open').addEventListener('click', () => openMenu());
/* New search: back to the welcome view (France, fresh suggestions, compact bar). */
function goHome(){
  zoneRun++; engRun++; state.zone = null; state.view = null; state.yview = null;
  zoneLayer.clearLayers(); dotLayer.clearLayers(); dots = []; miniPop.remove(); map.closePopup();
  q.value = ''; setTag(''); setUrl();
  $('res').hidden = true; $('menu').hidden = true; sheet.classList.remove('m'); clearPreview();
  $('intro').hidden = false; setSheet('intro'); setMapMode('all');
  renderSuggestions(true);
}
$('to-menu').addEventListener('click', goHome);
$('new-fab').addEventListener('click', goHome);
/* Phones: from the detailed sheet back to the map and its mini card (the card's "Details" goes the other way). */
$('to-map').addEventListener('click', () => { setSheet('hidden'); fitZone(zoneBounds()); });
$('tab-sites').addEventListener('click', () => setMenuTab('sites'));
$('tab-place').addEventListener('click', () => setMenuTab('place'));
$('loop-seg').addEventListener('click', e => {
  const b = e.target.closest('button[data-loop]'); if (!b) return;
  loop = +b.dataset.loop; saveSites(); applyLoop();
  if (SITES){ if (sitesOn) applyFilters(); renderSiteList(); }
});
applyLoop();
$('pane-sites').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-show'){ sitesOn = t.checked; if (sitesOn) mapQ = qWords(slist.q); saveSites(); if (SITES) applyFilters(); else syncSites(); return; }
  if (t.id === 'ssort'){ slist.sort = t.value; slist.n = SLIST_STEP; renderSiteList(); return; }
  if (t.dataset.f){ const k = t.dataset.f; filt[k] = t.checked ? [...new Set([...filt[k], t.value])] : filt[k].filter(x => x !== t.value); saveSites(); slist.n = SLIST_STEP; renderSiteList(); }
});
let sqDeb = null;
$('sq').addEventListener('input', e => { clearTimeout(sqDeb); sqDeb = setTimeout(() => { slist.q = e.target.value; slist.n = SLIST_STEP; renderSiteList(); }, 120); });
$('smore').addEventListener('click', () => { slist.n += SLIST_STEP; renderSiteList(); });
$('slist').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); const s = b && SITE_BY_ID.get(+b.dataset.id); if (!s) return;
  q.value = s.label; selectSite(s);
});
/* "Show": the list as it stands (filters + text) becomes the map layer, and the map takes the screen. */
$('s-apply').addEventListener('click', () => {
  if (!SITES) return;
  sitesOn = true; mapQ = qWords(slist.q); saveSites();
  closeMenu(); setMapMode('acc'); applyFilters();
  const list = slist.shown || [];
  if (list.length && list.length < SITES.length) fitZone(L.latLngBounds(list.map(s => [s.lat, s.lon])).pad(0.1));
  else map.fitBounds(FRANCE);
});
syncSites();

/* Output: a place is previewed (outline, dashed) before the computation. */
const pvLayer = L.layerGroup().addTo(map), pvRoofs = L.layerGroup().addTo(map);
let pending = null;
function clearPreview(keepPanel){
  pending = null; pvRun++; pvLayer.clearLayers(); pvRoofs.clearLayers();
  if (!keepPanel) $('pv').hidden = true;
  else if (!pending) $('pv').hidden = true;
}
async function previewZone(z){
  pending = z; $('pv').hidden = false; $('pv-name').textContent = z.label;
  $('pv-radius-row').hidden = z.type !== 'circle';
  pvRoofs.clearLayers();
  if (z.type === 'circle'){ $('pv-radius').value = sliderFromR(state.r); $('pv-radius-val').textContent = fmtDist(state.r); drawPreview(true); previewRoofs(); return; }
  pvLayer.clearLayers(); previewRoofs();
  try { const f = z.feature || await communeFeature(z.code); if (pending !== z) return; z.feature = f; drawPreview(true); }
  catch (e){ console.error(e); }
}
let pvRun = 0;
async function previewRoofs(){
  const z = pending, id = ++pvRun; if (!z) return;
  $('pv-name').textContent = `${z.label} · ${T.loadInst}`;
  try {
    let rows;
    if (z.type === 'circle'){
      const c = state.circle;
      if (!(c && c.center[0] === z.center[0] && c.center[1] === z.center[1] && c.r >= state.r)){
        const r = state.r, got = await loadInstallations(z.center, r);
        if (id !== pvRun) return;
        state.circle = {center: z.center.slice(), r, rows: got};
      }
      rows = state.circle.rows.filter(x => x.d <= state.r);
    } else {
      if (!state.communes.has(z.code)){
        const got = await loadCommuneInstallations(z.code);
        if (id !== pvRun) return;
        state.communes.set(z.code, got);
      }
      rows = state.communes.get(z.code);
    }
    if (id !== pvRun || pending !== z) return;
    pvRoofs.clearLayers();
    const dense = rows.length > 600 ? 0.7 : 1;
    let kwp = 0;
    for (const x of rows){
      const k = x.kwp ?? (x.surface || 0) / state.hyp.ratio; kwp += k;
      L.circleMarker([x.lat, x.lon], {renderer, interactive: false, radius: dense * Math.min(8, 2.4 + Math.sqrt(k) / 2.6), color: RAMP[1], weight: 0.6, fillColor: RAMP[2], fillOpacity: 1}).addTo(pvRoofs);
    }
    $('pv-name').textContent = `${z.label} · ${T.pvRoofs(nf0.format(rows.length), fmtKwp(kwp))}`;
  } catch (e){ if (id === pvRun){ console.error(e); $('pv-name').textContent = z.label; } }
}
function drawPreview(fit){
  const z = pending; pvLayer.clearLayers(); if (!z) return;
  const st = {color: ZONE_INK, weight: 2.5, dashArray: '6 6', fillColor: ZONE_INK, fillOpacity: .1, interactive: false};
  const l = z.type === 'circle' ? L.circle(z.center, {radius: state.r, ...st}) : L.geoJSON(z.feature, {style: () => st, interactive: false});
  l.addTo(pvLayer);
  if (z.type === 'circle') L.circleMarker(z.center, {radius: 5, color: '#fff', weight: 2, fillColor: ZONE_INK, fillOpacity: 1, interactive: false}).addTo(pvLayer);
  if (fit) fitZone(l.getBounds());
}
$('pv-radius').addEventListener('input', e => { state.r = rFromSlider(+e.target.value); $('pv-radius-val').textContent = fmtDist(state.r); drawPreview(false); });
$('pv-radius').addEventListener('change', () => { drawPreview(true); previewRoofs(); });
$('pv-go').addEventListener('click', () => {
  const z = pending; if (!z) return;
  $('radius').value = sliderFromR(state.r); $('radius-val').textContent = fmtDist(state.r);
  if (z.type === 'circle') selectCircle(z.center, z.label); else selectCommune(z.code, z.feature || null, z.label);
});

// Welcome suggestions: a few sites and cities, drawn at random, pinned on the map and listed in the welcome card.
map.createPane('sug').style.zIndex = 640;
const sugSites = L.layerGroup().addTo(map), sugCities = L.layerGroup().addTo(map);
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function pickSuggestions(){
  const pts = [], out = [], far = p => pts.every(x => haversine(p, x) > SUG_GAP), perUse = {};
  if (SITES) for (const pass of [['hi'], ['hi', 'mid']]){
    for (const s of shuffled(SITES.filter(s => s.named === 2 && pass.includes(s.pot) && s.roofs >= 10 && s.mwh >= 800 && (s.naf !== '84' || ['townhall', 'public', 'pool'].includes(s.catKey))))){
      if (out.length >= SUG_SITES) break;
      if (!far([s.lat, s.lon]) || (perUse[s.use] || 0) >= 2) continue;
      perUse[s.use] = (perUse[s.use] || 0) + 1; pts.push([s.lat, s.lon]); out.push({site: s});
    }
  }
  let n = 0;
  for (const [name, code, lat, lon] of shuffled(EXAMPLES)){
    if (n >= SUG_CITIES) break;
    if (!far([lat, lon])) continue;
    pts.push([lat, lon]); out.push({city: {name, code, lat, lon}}); n++;
  }
  return out;
}
function goSuggestion(x){
  if (x.site){ q.value = x.site.label; selectSite(x.site); }
  else { q.value = x.city.name; selectCommune(x.city.code, null, x.city.name); }
}
function renderSuggestions(fit){
  const list = pickSuggestions();
  sugSites.clearLayers(); sugCities.clearLayers();
  const dot = x => x.site ? `<i style="background:${POT_INK[x.site.pot]}" aria-hidden="true"></i>` : '<i class="city" aria-hidden="true"></i>';
  const name = x => x.site ? x.site.name : x.city.name, pct = x => x.site?.apL != null ? ` <b>${fmtPct(x.site.apL)} %</b>` : '';
  for (const x of list){
    const ll = x.site ? [x.site.lat, x.site.lon] : [x.city.lat, x.city.lon];
    L.marker(ll, {pane: 'sug', keyboard: false, icon: L.divIcon({className: 'sug-icon', iconSize: [0, 0],
      html: `<span class="pin">${dot(x)}<span>${esc(name(x))}</span>${pct(x)}</span>`})})
      .on('click', () => goSuggestion(x)).addTo(x.site ? sugSites : sugCities);
  }
  // Output tab: a few large cities (the pinned ones first), previewed on tap.
  const pinned = list.filter(x => x.city).map(x => x.city.code);
  const cities = [...EXAMPLES.filter(c => pinned.includes(c[1])), ...shuffled(EXAMPLES.filter(c => !pinned.includes(c[1])))].slice(0, 8);
  $('cities').innerHTML = '';
  for (const [nm, code] of cities){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ex';
    b.innerHTML = `<i class="city" aria-hidden="true"></i><span>${esc(nm)}</span>`;
    b.addEventListener('click', () => { q.value = nm; selectCommune(code, null, nm); });
    $('cities').append(b);
  }
  setMapMode(mapMode);
  if (fit && list.length > 1) fitZone(L.latLngBounds(list.map(x => x.site ? [x.site.lat, x.site.lon] : [x.city.lat, x.city.lon])).pad(0.15));
}
$('reshuffle').addEventListener('click', () => renderSuggestions(!state.zone));

// A shared link may carry a commune code (never a position).
const insee = params.get('insee');
if (insee && /^[0-9AB]{5}$/i.test(insee)) selectCommune(insee.toUpperCase());
// … or a site number.
const siteId = params.get('site');
loadSites().then(() => renderSuggestions(!insee && !siteId)).catch(e => { console.error(e); renderSuggestions(!insee && !siteId); });
if (!insee && /^\d+$/.test(siteId || '')) (sitesOn = true, loadSites()).then(list => { const s = list.find(x => x.id === +siteId); if (s){ $('q').value = s.label; selectSite(s); } }).catch(e => console.error(e));
})();
</script>
</body>
