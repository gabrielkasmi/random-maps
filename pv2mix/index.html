<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2f63">
<title>PV2Mix</title>
<meta name="description" content="Choisissez une commune ou un point : les toitures solaires détectées autour, et ce qu’elles produisent heure par heure, prévu la veille contre réalisé d’après le satellite. Projet indépendant, non affilié à RTE.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f2f63'/%3E%3Cpath d='M12 78C30 78 34 26 50 26S70 78 88 78Z' fill='%23f4f7fa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(fonts/archivo-400.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(fonts/archivo-600.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-weight:700;font-display:swap;src:url(fonts/archivo-700.woff2) format("woff2")}
@font-face{font-family:"Archivo Expanded";font-weight:800;font-display:swap;src:url(fonts/archivo-expanded-800.woff2) format("woff2")}
/* Cyanotype: Prussian-blue ground, one 7-step exposure ramp (x0 → x6) for every intensity. */
:root{
  --x0:#0b2550;--x1:#123a75;--x2:#1d4f96;--x3:#2f68b3;--x4:#7fb2e5;--x5:#b9d7f3;--x6:#f4f7fa;
  --ground:#0f2f63;--ground-2:#143a76;--line:#2a5594;
  --ink:#f4f7fa;--ink-2:#b9d7f3;--ink-3:#8fbbe8;
  --paper:#ffffff;--paper-ink:#0f2f63;--paper-ink-2:#4a6491;--paper-line:#d9e3f0;
  --warn:#ffcab8;
  --sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --display:"Archivo Expanded","Archivo",-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --sheet-top:39svh;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--x4);color:var(--x0)}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--x4);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums lining-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Map ---------- */
#map{position:fixed;inset:0;background:#efece6;z-index:0}
.leaflet-container{font-family:var(--sans);background:#efece6}
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.82)!important;color:var(--paper-ink-2)}
.leaflet-control-attribution a{color:var(--paper-ink)}
.leaflet-bar a{color:var(--paper-ink)!important}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);color:var(--paper-ink)}
.leaflet-popup-content{margin:12px 14px;font:14px/1.45 var(--sans)}
.leaflet-popup-tip{box-shadow:none}
.pick{display:grid;gap:6px;min-width:200px}
.pick button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--paper-line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:600;color:var(--paper-ink)}
.pick button:hover:not(:disabled){border-color:var(--paper-ink)}
.pick button:disabled{color:var(--paper-ink-2);font-weight:400;cursor:progress}
.pick small{display:block;font-weight:400;color:var(--paper-ink-2);font-size:12px}
.pop b{font-size:16px}
.pop span{color:var(--paper-ink-2)}

/* ---------- Top: back link, language, search ---------- */
.top{position:fixed;z-index:600;top:0;left:0;right:0;padding:max(12px,env(safe-area-inset-top)) 12px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip-link{display:inline-flex;align-items:center;gap:6px;height:30px;white-space:nowrap;flex:none;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.92);color:var(--paper-ink);font-size:13px;font-weight:600;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.chip-link svg.i{width:15px;height:15px}
.bar-r{display:flex;align-items:center;gap:8px}
/* ---------- Sheet menu: two tabs (ACC sites, output), on the Prussian ground ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--ground-2);border-radius:10px;padding:3px;margin:2px 0 14px}
.tabs button{height:34px;border:0;border-radius:8px;background:none;font:700 13px var(--sans);color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--x6);color:var(--ground)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}
.mhead .ttl{font:800 22px/1 var(--display);letter-spacing:-.02em}
.mhead .ttl em{font-style:normal;color:var(--x4)}
.sheet[data-size="half"] .close,.sheet[data-size="full"] .close{display:grid}
.loop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 4px}
.loop>span{font-size:12px;font-weight:700;color:var(--ink-2)}
.seg{display:inline-flex;background:var(--ground-2);border-radius:99px;padding:3px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:99px;background:none;color:var(--ink-2);font:700 12px var(--sans)}
.seg button[aria-pressed="true"]{background:var(--x6);color:var(--ground)}
.loop-help{margin:0 0 12px;font-size:12px;line-height:1.4;color:var(--ink-3)}
.sfind{display:block;height:44px;border:0;border-radius:12px;padding:0 14px;font:600 15px var(--sans);color:var(--paper-ink);background:var(--paper);outline:none;width:100%;caret-color:var(--x3)}
.sfind::placeholder{color:var(--paper-ink-2);font-weight:400}
.sbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:10px 0 8px}
.sbar label{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);cursor:pointer}
.sbar input{accent-color:var(--x4);width:16px;height:16px;margin:0}
.sbar select{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--ground-2);color:var(--ink);font:600 12px var(--sans);height:30px;padding:0 6px}
.sfilt{border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:0 0 8px}
.sfilt summary{cursor:pointer;font-size:13px;font-weight:700;padding:9px 0}
.sfilt fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:6px 0 4px;min-width:0}
.sfilt legend{float:left;width:100%;font-size:12px;font-weight:700;padding:0;margin:0 0 2px}
.sfilt .fsub{clear:both;margin:0 0 2px;font-size:11.5px;line-height:1.35;color:var(--ink-3)}
.sfilt label{clear:both;display:flex;align-items:center;gap:8px;min-height:30px;font-size:13px;cursor:pointer}
.sfilt label small{margin-left:auto;color:var(--ink-2);font-size:12px}
.sfilt input{accent-color:var(--x4);width:16px;height:16px;margin:0;flex:none}
.pd{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;flex:none}
.slist{list-style:none;margin:0 -6px;padding:0}
.slist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 6px;border-radius:8px;text-align:left;color:var(--ink);font:600 14px/1.25 var(--sans)}
.slist button:hover,.slist button:focus-visible{background:var(--ground-2)}
.slist .n{flex:1;min-width:0}
.slist .n span,.slist small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slist small{font-weight:400;font-size:12px;color:var(--ink-2);margin-top:1px}
.slist b{font:700 13px var(--sans);white-space:nowrap}
.slist .empty{padding:10px 6px;font-size:13px;color:var(--ink-2)}
.smore{display:block;width:100%;height:36px;margin:6px 0 0;border:1px solid var(--line);border-radius:8px;background:none;font:600 13px var(--sans);color:var(--ink)}
.smore:hover{border-color:var(--x4)}
.sact{position:sticky;bottom:0;z-index:1;margin:10px -20px 0;padding:10px 20px max(12px,env(safe-area-inset-bottom));background:var(--ground);border-top:1px solid var(--line)}
.btn.primary{background:var(--x6);color:var(--ground);border-color:var(--x6)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.big{width:100%;height:44px;font-size:14px;border-radius:12px}
.xhint{margin:8px 2px 12px;font-size:12px;color:var(--ink-3)}
.pv{margin:6px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.pv-name{margin:0 0 4px;font-weight:700}
.pv .radius{margin:4px 0 10px}
.sheet.m .foot{display:none}
/* Compact welcome bar: opens the menu */
#intro{padding-bottom:4px}
.iopen{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.iopen .itx{flex:1;min-width:0}
.iopen .ttl{display:block;font:800 24px/1 var(--display);letter-spacing:-.02em;margin:0 0 5px}
.iopen .ttl em{font-style:normal;color:var(--x4)}
.iopen .lead{display:block;margin:0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.igo{flex:none;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px;border-radius:99px;background:var(--x6);color:var(--ground);font:700 13px var(--sans)}
.igo svg.i{width:16px;height:16px}
.ishuf{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;border:0;background:none;padding:0;color:var(--ink-2);font:600 12px var(--sans)}
.ishuf svg.i{width:14px;height:14px}
.ishuf:hover{color:var(--ink)}
.sheet[data-size="intro"] #d-about,.sheet[data-size="intro"] .foot{display:none}
.to-menu{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;margin:0 0 6px -4px;color:var(--ink-2);font:600 13px var(--sans)}
.to-menu svg.i{width:16px;height:16px}
.to-menu:hover{color:var(--ink)}
.res-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px}
.res-nav .to-menu{margin:0 0 0 -4px}
.to-map{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:none;color:var(--ink);font:700 12px var(--sans);margin-right:44px}
.to-map svg.i{width:15px;height:15px}
@media (min-width:900px){.to-map{display:none}}
/* Phones, results with the sheet down: a way back to the welcome view */
.new-fab{position:fixed;z-index:550;left:50%;transform:translateX(-50%);bottom:max(20px,calc(env(safe-area-inset-bottom) + 12px));display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 18px;border:0;border-radius:99px;background:var(--ground);color:var(--ink);font:700 14px var(--sans);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.new-fab[hidden]{display:none}
.new-fab svg.i{width:18px;height:18px}
@media (min-width:900px){.new-fab{display:none}}
/* Existing ACC operations, reported by visitors */
.accp{background:var(--x6);color:var(--ground)}
.accb{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;border:1px dashed var(--x5);font:700 10px/1.4 var(--sans);letter-spacing:.03em;color:var(--x5);vertical-align:1px}
.accf{margin:18px 0 0;padding:14px;border:1px solid var(--line);border-radius:12px}
.accf-h{margin:0 0 4px;font-weight:700;font-size:14px}
.accf-sub{margin:0 0 10px;font-size:12px;line-height:1.4;color:var(--ink-2)}
.accf-note{display:block;width:100%;height:38px;margin:10px 0 0;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--ground-2);color:var(--ink);font:500 13px var(--sans)}
.accf-note::placeholder{color:var(--ink-3)}
.accf-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0 0}
.linkb{border:0;background:none;padding:0;color:var(--ink-2);font:600 12px var(--sans);text-decoration:underline;text-underline-offset:2px}
.accf .note{margin:8px 0 0}
/* All sites: clusters (count, coloured by the dominant potential), split as one zooms in */
.scl-icon{background:none;border:0}
.scl{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font:700 12px/1 var(--sans);color:#fff;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.scl.lo,.scl.na{color:var(--paper-ink)}
/* Welcome suggestions pinned on the map */
.sug-icon{background:none;border:0}
.pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:6px;max-width:170px;white-space:nowrap;border:0;background:var(--paper);color:var(--paper-ink);border-radius:99px;padding:5px 10px 5px 6px;font:600 12px var(--sans);box-shadow:0 3px 12px rgba(0,0,0,.28);cursor:pointer}
.pin:hover{outline:2px solid var(--ground)}
.pin span{overflow:hidden;text-overflow:ellipsis}
.pin b{font-weight:700;color:var(--paper-ink-2)}
.pin i,.ex i{width:11px;height:11px;border-radius:50%;flex:none;border:1.5px solid #fff}
.cities{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.pin i.city,.ex i.city{border-radius:2px;background:var(--x4)}
.ex{display:inline-flex;align-items:center;gap:7px;max-width:100%;min-width:0}
.ex span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug-h{margin:4px 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.lang{display:flex;background:rgba(255,255,255,.92);border-radius:99px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lang a{height:24px;min-width:34px;display:grid;place-items:center;border-radius:99px;font-size:12px;font-weight:700;color:var(--paper-ink-2);text-decoration:none}
.lang a[aria-current="true"]{background:var(--ground);color:var(--ink)}
.search{position:relative;display:flex;align-items:center;gap:4px;height:50px;background:var(--paper);border-radius:14px;padding:0 6px 0 14px;box-shadow:0 8px 22px rgba(0,0,0,.26);color:var(--paper-ink)}
.search>svg.i{color:var(--paper-ink-2)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;font:600 16px var(--sans);color:var(--paper-ink);padding:0 6px;outline:none;caret-color:var(--x3)}
.search input::placeholder{color:var(--paper-ink-2);font-weight:400}
.search input::-webkit-search-cancel-button{display:none}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--paper-ink);background:#e6eef8;border-radius:99px;padding:3px 9px;white-space:nowrap}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--paper-ink)}
.icon-btn:hover{background:#eef3fa}
.icon-btn[aria-busy="true"]{opacity:.5;cursor:progress}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--paper);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.28);max-height:60svh;overflow:auto}
.sugg li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--paper-ink)}
.sugg li span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugg li[aria-selected="true"],.sugg li:hover{background:#eef3fa}
.sugg .tag{background:none;border:1px solid var(--paper-line);color:var(--paper-ink-2)}

/* ---------- Sheet (results drawer) ---------- */
.sheet{position:fixed;z-index:500;left:0;right:0;bottom:0;top:var(--sheet-top);background:var(--ground);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;transition:top .45s var(--ease)}
.sheet[data-size="intro"]{top:auto}
.sheet[data-size="half"]{top:48svh}
.sheet[data-size="hidden"]{top:100%;box-shadow:none;visibility:hidden;transition:top .45s var(--ease),visibility 0s .45s}
.close{position:absolute;top:4px;right:12px;z-index:2;display:none;place-items:center;width:34px;height:34px;border:0;border-radius:50%;background:var(--ground-2);color:var(--ink)}
.close svg.i{width:18px;height:18px}
.sheet[data-size="full"] .close{display:grid}
.sheet[data-size="full"] .scroll{padding-top:18px}

/* ---------- Mini card (phones): floats above the chosen area, opens the details ---------- */
.leaflet-popup.mini-pop .leaflet-popup-content-wrapper{background:var(--ground);color:var(--ink);border-radius:16px;box-shadow:0 10px 26px rgba(0,0,0,.35);padding:0}
.leaflet-popup.mini-pop .leaflet-popup-tip{background:var(--ground)}
.leaflet-popup.mini-pop .leaflet-popup-content{margin:0;width:236px!important}
.mini{padding:10px 14px 8px;font-family:var(--sans)}
.mini-open{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink)}
.mini-num{font:800 38px/1 var(--display);letter-spacing:-.03em;display:flex;align-items:baseline;gap:5px}
.mini-num small{font:600 16px var(--sans);color:var(--ink-2);letter-spacing:0}
.mini-more{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.mini-more svg.i{width:16px;height:16px}
.mini-cap{margin:4px 0 0;font-size:12px;color:var(--ink-2)}
.mini input[type=range]{height:26px;margin-top:2px}
.mini .status{margin:0 0 4px;font-size:13px}
.mini.loading .mini-num,.mini.loading .mini-cap{opacity:.35}
.sheet[data-size="full"]{top:calc(max(12px,env(safe-area-inset-top)) + 54px)}
.grab{flex:none;display:block;width:100%;height:24px;border:0;background:none;position:relative}
.grab::before{content:"";position:absolute;left:50%;top:9px;width:42px;height:4px;margin-left:-21px;border-radius:2px;background:var(--line)}
.scroll{flex:1;overflow:auto;overscroll-behavior:contain;padding:0 20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

h1{font:800 30px/1 var(--display);letter-spacing:-.02em;margin:2px 0 8px}
h1 em{font-style:normal;color:var(--x4)}
.lead{color:var(--ink-2);margin:0 0 14px;max-width:46ch}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.ex{border:1px solid var(--line);background:var(--ground-2);border-radius:99px;padding:6px 13px;font-size:14px;font-weight:600}
.ex:hover{border-color:var(--x4)}
.hint{color:var(--ink-3);font-size:13px;margin:8px 0 0}

.zone{display:flex;align-items:center;gap:10px;margin:0 0 2px}
.zone h2{flex:1;min-width:0;margin:0;font:700 17px/1.25 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone h2 span{font-weight:400;color:var(--ink-2)}
.date{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--ground-2);font-size:13px;font-weight:600;white-space:nowrap}
.date input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.date svg.i{width:15px;height:15px;color:var(--ink-2)}
.days{display:flex;gap:6px}
.days button{height:30px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:none;font-size:13px;color:var(--ink-2)}
.days button[aria-pressed="true"]{background:var(--x6);color:var(--ground);border-color:var(--x6);font-weight:700}

.hero{margin:14px 0 0}
.hero-num{font:800 clamp(52px,15vw,64px)/.95 var(--display);letter-spacing:-.03em;margin:0;display:flex;align-items:baseline;gap:8px}
.hero-num small{font:600 22px var(--sans);color:var(--ink-2);letter-spacing:0}
.hero-cap{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.hero-cap b{color:var(--ink);font-weight:600}
.figs{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px 16px;align-items:baseline;margin:16px 0 0}
.figs .fh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.figs .rl{font-size:12px;color:var(--ink-2);white-space:nowrap}
.figs b{font:700 19px/1.15 var(--sans);white-space:nowrap}
.figs small{display:block;font:400 12px/1.3 var(--sans);color:var(--ink-2);margin-top:2px}
.key{display:inline-block;width:14px;height:0;border-top:2.5px solid var(--x6);flex:none}
.key.fc{border-top:2.5px dashed var(--x4)}
.key.need{border-top:2px solid var(--x4)}
.key.bar{width:10px;height:10px;border:0;border-radius:1px;background:var(--x3)}
.key.bar.use{background:var(--x6)}

/* Site view (around a large consumer): the year's rooftop output against the site's yearly consumption. */
#res.site .days,#res.site .date,#res.site #out,#res.site #d-table,#res.site #to-site{display:none!important}
#res:not(.site) #site-out{display:none!important}
.mini.site #hour-m{display:none}
.site-cat{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:13px;color:var(--ink-2);min-width:0}
.site-cat span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sfigs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px;margin:16px 0 0}
.sfigs .fh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-2)}
.sfigs b{display:block;font:700 19px/1.15 var(--sans);margin-top:5px;white-space:nowrap}
.sfigs small{display:block;font:400 12px/1.3 var(--sans);color:var(--ink-2);margin-top:2px}
.loading .sfigs,.loading #ychart{opacity:.35;transition:opacity .3s}
.btn.wide{width:100%;height:40px;margin-top:14px}
.site-use{display:flex;align-items:flex-start;gap:9px;margin:12px 0 0;font-size:13px;line-height:1.4;color:var(--ink-2)}
.pot{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:11px;font-weight:700;white-space:nowrap;border-radius:99px;padding:3px 9px 3px 6px;background:var(--ground-2);color:var(--ink)}
.pot i{width:10px;height:10px;border-radius:50%;border:1.5px solid #fff}

.chart{position:relative;margin:16px -4px 0}
canvas{display:block;width:100%;height:clamp(120px,17svh,178px);touch-action:pan-y}
@media (min-width:900px){canvas{height:178px}}
.date:not(.custom) #date-label{display:none}.date:not(.custom){padding:0 8px}
@media (max-width:399px){.zone{gap:6px}}
.tip{position:absolute;top:0;pointer-events:none;background:var(--x6);color:var(--paper-ink);border-radius:9px;padding:7px 9px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);min-width:9.5rem;z-index:2}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip div{display:flex;justify-content:space-between;gap:10px}
.tip span{color:var(--paper-ink-2)}

.scrub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:var(--track,var(--x2))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--track,var(--x2))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:var(--x6);border:5px solid var(--ground);outline:2px solid var(--x6);outline-offset:-1px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--x6);border:5px solid var(--ground);outline:2px solid var(--x6);outline-offset:-1px}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--x4);outline-offset:2px}

.radius{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.radius output{color:var(--ink);font-weight:700;min-width:4.4em;text-align:right}
.radius input[type=range]{--track:var(--line)}
.radius input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-5px;border-width:4px}

.note{font-size:12px;color:var(--ink-3);margin:12px 0 0}
.status{margin:12px 0 0;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
.status.error{color:var(--warn)}
.status:empty{display:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--x6);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(1turn)}}
.loading .hero-num,.loading .figs,.loading .chart,.loading .scrub{opacity:.35;transition:opacity .3s}

details{border-top:1px solid var(--line);margin-top:14px}
details:first-of-type{margin-top:18px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-weight:600;font-size:14px}
summary::-webkit-details-marker{display:none}
summary svg.i{width:16px;height:16px;color:var(--ink-2);transition:transform .25s var(--ease)}
details[open] summary svg.i{transform:rotate(180deg)}
.tbl{overflow-x:auto;padding-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--ground-2);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink-2);font-weight:600}
tr.on td{background:var(--ground-2)}
.hyp{display:grid;gap:14px;padding:2px 0 14px}
.hyp fieldset{border:0;margin:0;padding:0;min-width:0}
.hyp legend{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px;padding:0}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;align-items:center;font-size:13.5px}
.ctl output{font-weight:700}
.ctl input[type=range]{grid-column:1/-1;--track:var(--line)}
.ctl input[type=range]::-webkit-slider-thumb{width:18px;height:18px;margin-top:-5px;border-width:4px}
.ctl.off{opacity:.45}
.radio{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:0 0 7px}
.radio input{accent-color:var(--x4);margin-top:.25em}
.mini{font-size:12.5px;color:var(--ink-2);margin:2px 0 6px}
.hyp-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--x4)}
.about{font-size:13px;color:var(--ink-2);padding:0 0 12px}
.about ul{margin:0 0 10px;padding-left:1.1em}
.about li{margin:.3em 0;color:var(--ink)}
.about p{margin:0 0 .7em}
.foot{position:sticky;bottom:0;margin:12px -20px 0;padding:8px 20px max(12px,env(safe-area-inset-bottom));background:var(--ground);font-size:12px;color:var(--ink-3)}
.foot button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-3);text-underline-offset:3px;font-size:12px}

/* ---------- Desktop: search top-left, the sheet becomes a right-hand column ---------- */
@media (min-width:900px){
  :root{--sheet-top:0}
  .top{right:auto;width:400px;padding:16px 0 0 16px}
  .sheet,.sheet[data-size="intro"],.sheet[data-size="full"],.sheet[data-size="half"]{top:16px;bottom:16px;left:auto;right:16px;width:420px;border-radius:18px;box-shadow:0 12px 34px rgba(0,0,0,.32)}
  .sheet[data-size="intro"]{top:auto}
  .grab{display:none}
  .close{display:none!important}
  .sheet.m .scroll{padding-top:16px}
  .scroll{padding-top:20px}
  .leaflet-left .leaflet-control-zoom{margin-left:16px;margin-bottom:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="map" role="application"></div>

<div class="top">
  <div class="bar">
    <a class="chip-link" id="back" href="../"><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>Random Maps</span></a>
    <div class="bar-r">
      <nav class="lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav>
    </div>
  </div>
</div>

<section class="sheet" id="sheet" data-size="intro" aria-labelledby="sheet-title">
  <button class="grab" id="grab" type="button" aria-expanded="false"><span class="sr" data-t="grab"></span></button>
  <button class="close" id="close" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="sr" data-t="backMap"></span></button>
  <div class="scroll" id="scroll">

    <div id="intro">
      <button class="iopen" id="intro-open" type="button" aria-controls="menu">
        <span class="itx"><span class="ttl" id="sheet-title">PV<em>2</em>Mix</span><span class="lead" data-t="lead"></span></span>
        <span class="igo"><span data-t="explore"></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></span>
      </button>
      <button class="ishuf" id="reshuffle" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg><span data-t="reshuffle"></span></button>
    </div>

    <div id="menu" hidden>
      <div class="mhead"><span class="ttl">PV<em>2</em>Mix</span></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-sites" aria-selected="true" aria-controls="pane-sites" data-t="tabAcc"></button>
        <button type="button" role="tab" id="tab-place" aria-selected="false" aria-controls="pane-place" data-t="tabProd"></button>
      </div>
      <div id="pane-sites" role="tabpanel" aria-labelledby="tab-sites">
        <div class="loop"><span data-t="loopL"></span><div class="seg" id="loop-seg"><button type="button" data-loop="2">2 km</button><button type="button" data-loop="10">10 km</button><button type="button" data-loop="20">20 km</button></div></div>
        <p class="loop-help" data-t="loopHelp"></p>
        <input class="sfind" id="sq" type="search" autocomplete="off" spellcheck="false">
        <div class="sbar"><span class="tnum" id="scount"></span><label><input type="checkbox" id="f-show"><span data-t="sitesShow"></span></label>
          <select id="ssort"><option value="ap" data-t="sortAp"></option><option value="mwh" data-t="sortMwh"></option><option value="name" data-t="sortName"></option></select></div>
        <details class="sfilt"><summary data-t="sFilters"></summary><div id="sites-panel"></div></details>
        <ul class="slist" id="slist"></ul>
        <button class="smore" id="smore" type="button" hidden></button>
        <div class="sact"><button class="btn primary big" id="s-apply" type="button"></button></div>
      </div>
      <div id="pane-place" role="tabpanel" aria-labelledby="tab-place" hidden>
        <div class="search" role="search">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr" for="q" data-t="qLabel"></label>
          <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugg">
          <span class="tag" id="q-tag" hidden></span>
          <button class="icon-btn" id="locate" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7.5"/></svg><span class="sr" data-t="locate"></span></button>
          <ul class="sugg" id="sugg" role="listbox" hidden></ul>
        </div>
        <p class="xhint" data-t="xhint"></p>
        <div class="pv" id="pv" hidden>
          <p class="pv-name" id="pv-name"></p>
          <div class="radius" id="pv-radius-row" hidden>
            <label for="pv-radius" data-t="lRadius"></label>
            <input id="pv-radius" type="range" min="0" max="1000" step="1">
            <output id="pv-radius-val" class="tnum" for="pv-radius"></output>
          </div>
          <button class="btn primary big" id="pv-go" type="button" data-t="compute"></button>
        </div>
        <p class="sug-h" data-t="citiesH"></p>
        <div class="cities" id="cities"></div>
      </div>
    </div>

    <div id="res" hidden>
      <div class="res-nav">
        <button class="to-menu" id="to-menu" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span data-t="newSearch"></span></button>
        <button class="to-map" id="to-map" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg><span data-t="toMap"></span></button>
      </div>
      <div class="zone">
        <h2 id="zone-name"></h2>
        <div class="days"><button type="button" id="d-yest" data-t="yesterday"></button><button type="button" id="d-today" data-t="today"></button></div>
        <label class="date"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="date-label" class="tnum"></span><input id="date" type="date" aria-label=""></label>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div id="out">
        <div class="hero">
          <p class="hero-num tnum" id="hero"><span id="hero-v">–</span><small id="hero-u"></small></p>
          <p class="hero-cap" id="hero-cap"></p>
        </div>
        <div class="figs">
          <span></span><span class="fh"><i class="key fc" aria-hidden="true"></i><span data-t="fc"></span></span><span class="fh"><i class="key" aria-hidden="true"></i><span data-t="re"></span></span>
          <span class="rl tnum" id="f-at"></span><b class="tnum" id="f-fc-p">–</b><b class="tnum" id="f-re-p">–</b>
          <span class="rl" data-t="dayRow"></span><b class="tnum" id="f-fc">–</b><b class="tnum"><span id="f-re">–</span><small id="f-re-l"></small></b>
        </div>
        <div class="chart">
          <canvas id="chart" tabindex="0" role="img"></canvas>
          <div class="tip" id="tip" hidden></div>
        </div>
        <div class="scrub">
          <span class="tnum" id="s-a"></span>
          <input id="hour" type="range" min="0" max="23" step="1" value="12">
          <span class="tnum" id="s-b"></span>
        </div>
        <p class="note" id="src-note"></p>
        <p class="note" data-th="omCredit"></p>
      </div>
      <button class="btn wide" id="to-site" type="button" data-t="toSite" hidden></button>

      <div id="site-out">
        <p class="site-cat"><span class="tag" id="site-cat"></span><span id="site-where"></span></p>
        <div class="hero">
          <p class="hero-num tnum"><span id="cov-v">–</span><small>%</small></p>
          <p class="hero-cap" id="cov-cap"></p>
        </div>
        <p class="site-use"><span class="pot" id="site-pot"></span><span id="site-use"></span></p>
        <p class="site-use" id="site-acc-row" hidden><span class="pot accp" id="site-acc"></span><span id="site-acc-txt"></span></p>
        <div class="sfigs">
          <div><span class="fh"><i class="key bar use" aria-hidden="true"></i><span data-t="yUse"></span></span><b class="tnum" id="y-use">–</b><small class="tnum" id="y-ac"></small></div>
          <div><span class="fh"><i class="key need" aria-hidden="true"></i><span data-t="yNeed"></span></span><b class="tnum" id="y-need">–</b><small class="tnum" id="y-meters"></small></div>
          <div><span class="fh"><i class="key bar" aria-hidden="true"></i><span data-t="yProd"></span></span><b class="tnum" id="y-prod">–</b><small class="tnum" id="y-range"></small></div>
          <div><span class="fh"><span data-t="yCeil"></span></span><b class="tnum" id="y-ceil">–</b><small data-t="yCeilSub"></small></div>
        </div>
        <div class="chart"><canvas id="ychart" role="img"></canvas></div>
        <p class="note" id="y-note"></p>
        <p class="note" data-th="omCredit"></p>
        <div class="accf" id="accf" hidden>
          <p class="accf-h" data-t="accQ"></p>
          <p class="accf-sub" data-t="accSub"></p>
          <div class="seg" id="accf-seg"><button type="button" data-s="active" aria-pressed="false" data-t="accActive"></button><button type="button" data-s="project" aria-pressed="false" data-t="accProject"></button></div>
          <input class="accf-note" id="accf-note" type="text" maxlength="200" autocomplete="off">
          <div class="accf-row"><button class="btn primary" id="accf-send" type="button" disabled data-t="accSend"></button><button class="linkb" id="accf-undo" type="button" hidden data-t="accUndo"></button></div>
          <p class="note" id="accf-msg" role="status" aria-live="polite"></p>
        </div>
        <button class="btn wide" id="to-day" type="button" data-t="toDay"></button>
      </div>

      <div class="radius" id="radius-row" hidden>
        <label for="radius" data-t="lRadius"></label>
        <input id="radius" type="range" min="0" max="1000" step="1">
        <output id="radius-val" class="tnum" for="radius"></output>
      </div>

      <details id="d-table">
        <summary><span data-t="tableShow"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="tbl"><table id="tbl"></table></div>
      </details>
      <details id="d-hyp">
        <summary><span data-t="hyp"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="hyp">
          <p class="mini tnum" id="det-mean"></p>
          <fieldset>
            <legend data-t="hOrient"></legend>
            <label class="radio"><input type="radio" name="orient" value="det" checked><span data-t="hDet"></span></label>
            <label class="radio"><input type="radio" name="orient" value="fix"><span data-t="hFix"></span></label>
            <div class="ctl" id="c-tilt"><label for="tilt" data-t="hTilt"></label><output id="tilt-v" class="tnum"></output><input id="tilt" type="range" min="0" max="60" step="1" value="30"></div>
            <div class="ctl" id="c-az"><label for="az" data-t="hAz"></label><output id="az-v" class="tnum"></output><input id="az" type="range" min="90" max="270" step="5" value="180"></div>
          </fieldset>
          <fieldset>
            <legend data-t="hSys"></legend>
            <div class="ctl"><label for="pr" data-t="hPr"></label><output id="pr-v" class="tnum"></output><input id="pr" type="range" min="0.6" max="0.95" step="0.01" value="0.80"></div>
            <label class="radio"><input type="checkbox" id="tcorr" checked><span data-t="hTemp"></span></label>
            <div class="ctl"><label for="ratio" data-t="hRatio"></label><output id="ratio-v" class="tnum"></output><input id="ratio" type="range" min="3" max="10" step="0.5" value="6"></div>
            <p class="mini" id="ratio-hint"></p>
          </fieldset>
          <fieldset>
            <legend data-t="hEnv"></legend>
            <div class="ctl"><label for="dtilt" data-t="hDTilt"></label><output id="dtilt-v" class="tnum"></output><input id="dtilt" type="range" min="0" max="30" step="1" value="15"></div>
            <div class="ctl"><label for="daz" data-t="hDAz"></label><output id="daz-v" class="tnum"></output><input id="daz" type="range" min="0" max="90" step="5" value="45"></div>
            <div class="ctl"><label for="dpr" data-t="hDPr"></label><output id="dpr-v" class="tnum"></output><input id="dpr" type="range" min="0" max="0.10" step="0.01" value="0.05"></div>
          </fieldset>
          <p class="mini" data-th="hModelTxt"></p>
          <div class="hyp-foot"><span data-t="hNoCall"></span><button class="btn" id="reset" type="button" data-t="reset"></button></div>
        </div>
      </details>
    </div>

    <details id="d-about">
      <summary><span data-t="aboutTitle"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="about">
        <ul>
          <li data-t="lim1"></li>
          <li data-t="lim2"></li>
          <li data-t="lim3"></li>
          <li data-t="lim4"></li>
          <li data-t="lim5"></li>
          <li data-t="lim6"></li>
          <li data-t="indep"></li>
        </ul>
        <p data-th="credits"></p>
        <p data-t="privacy"></p>
      </div>
    </details>
    <p class="foot"><span data-t="footLine"></span> <button type="button" id="more" data-t="more"></button></p>
  </div>
</section>

<button class="new-fab" id="new-fab" type="button" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span data-t="newSearch"></span></button>

<div hidden><div class="mini" id="mini">
  <p class="status" id="mini-status" role="status" aria-live="polite"></p>
  <div id="mini-out">
    <button class="mini-open" id="mini-open" type="button" aria-haspopup="dialog">
      <span class="mini-num tnum"><span id="m-v">–</span><small id="m-u"></small></span>
      <span class="mini-more"><span data-t="details"></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>

function circlePolygon([lat, lon], r, n = 48){
  const dLat = r / 110574, dLon = r / (111320 * Math.cos(lat * D2R)), ring = [];
  for (let i = 0; i < n; i++){ const t = 2 * Math.PI * i / n; ring.push([round(lon + dLon * Math.cos(t), 5), round(lat + dLat * Math.sin(t), 5)]); }

async function loadInstallations(center, radiusMeters){

    method: 'POST', headers: {...SB_HEADERS, 'Content-Type': 'application/json'},

async function loadOrientations(ids, onProgress){

  let done = 0;
  await pool(chunks.map(chunk => async () => {
    const rows = await getJSON(`${SB}/detections?select=id,tilt,azimuth&id=in.(${chunk.join(',')})`, {headers: SB_HEADERS}, 'sb');
    for (const r of rows) state.orient.set(r.id, {tilt: r.tilt, az: r.azimuth == null ? null : azFromData(r.azimuth)});
    for (const id of chunk) if (!state.orient.has(id)) state.orient.set(id, {tilt: null, az: null});
    done += chunk.length; onProgress?.(done, todo.length);
  }));
}
/* A whole commune: every detection with that INSEE code, tilt and azimuth included, 1 000 rows per page. */
async function loadCommuneInstallations(code, onProgress){
  const base = `${SB}/detections?select=id,kwp,surface,tilt,azimuth,geom&insee=eq.${encodeURIComponent(code)}&order=id&limit=1000`;
  const parse = rows => rows.map(r => {
    state.orient.set(r.id, {tilt: r.tilt, az: r.azimuth == null ? null : azFromData(r.azimuth)});
    const [lat, lon] = centroid(r.geom);
    return {id: r.id, lat, lon, kwp: r.kwp ?? null, surface: r.surface ?? null};
  });
  const res = await getRes(`${base}&offset=0`, {headers: {...SB_HEADERS, Prefer: 'count=exact'}}, 'sb');
  const total = +((res.headers.get('content-range') || '').split('/')[1]) || 0;
  let rows = parse(await res.json());
  if (total > rows.length){
    const offs = []; for (let o = 1000; o < total; o += 1000) offs.push(o);
    let done = rows.length; onProgress?.(done, total);
    const pages = await pool(offs.map(o => async () => {
      const p = parse(await getJSON(`${base}&offset=${o}`, {headers: SB_HEADERS}, 'sb'));
      done += p.length; onProgress?.(done, total); return p;

function setPot(p){ $('site-pot').innerHTML = `<i style="background:${POT_INK[p]}" aria-hidden="true"></i>${esc(T.pot[p])}`; }
/* Two entries on the same rooftops: 'day' (forecast vs actual for one day) and, around a site, 'site' (the year). */

/* The commune outline (geo.api.gouv.fr, sometimes several seconds for a big city) is only needed for the

function selectCommune(code, feature, name){

async function loadZone(id = ++zoneRun){

function renderInstallInfo(rows){
  const kw = x => x.kwp != null ? x.kwp : (x.surface || 0) / state.hyp.ratio;
  const total = rows.reduce((s, x) => s + kw(x), 0), byRatio = rows.filter(x => x.kwp == null).length;
  let st = 0, wt = 0, ax = 0, ay = 0, north = 0;
  for (const x of rows){
    const o = state.orient.get(x.id) || {}, k = kw(x);
    if (o.tilt != null){ st += k * o.tilt; wt += k; }
    if (o.az != null){ ax += k * Math.cos(o.az * D2R); ay += k * Math.sin(o.az * D2R); if (o.az < 90 || o.az > 270) north += k; }
  }
  $('det-mean').textContent = wt ? T.detMean(nf0.format(st / wt), azLabel((Math.atan2(ay, ax) / D2R + 360) % 360), `${nf0.format(100 * north / total)} %`) : '';
  $('ratio-hint').textContent = T.ratioHint(byRatio);

/* ---------- Weather point and orientation classes ----------
   One weather point per zone, whatever its size: the centre of a circle, or the capacity-weighted centre
   of a commune's rooftops (rounded to COORD_DECIMALS). That is 2 Open-Meteo requests per view; irradiance
   barely varies across a commune compared with the other uncertainties (orientation, PR, detections).
   Rooftops are then grouped into orientation classes, 8 azimuth sectors (45°, centred on N, NE, E…) ×
   3 tilt classes (< 15°, 15–30°, ≥ 30°), plus one class for rooftops without an orientation (30°, south).
   Per class: summed kWp, capacity-weighted mean tilt, capacity-weighted circular mean azimuth.
   Unlike a single mean roof, east and west roofs stay east and west. Each row remembers its class (row.cell)
   so the map can expose it. All of this is local: classes cost no network call. */
const TILT_EDGES = [15, 30];
function weatherPoint(rows, ratio){
  const z = state.zone;
  if (z.type === 'circle') return {key: `${z.center[0]}:${z.center[1]}`, lat: z.center[0], lon: z.center[1]};
  let la = 0, lo = 0, w = 0;
  for (const x of rows){ const k = Math.max(1e-3, x.kwp != null ? x.kwp : (x.surface || 0) / ratio); la += k * x.lat; lo += k * x.lon; w += k; }
  const lat = round(la / w), lon = round(lo / w);
  return {key: `${lat}:${lon}`, lat, lon};
}
function buildCells(rows, ratio){
  const pt = weatherPoint(rows, ratio), m = new Map();
  for (const x of rows){
    const o = state.orient.get(x.id) || {}, known = o.tilt != null && o.az != null;
    const t = known ? o.tilt : DEF.tilt, az = known ? o.az : DEF.az;
    const key = known ? `${Math.round((((az % 360) + 360) % 360) / 45) % 8}:${TILT_EDGES.filter(e => t >= e).length}` : '?';
    x.cell = key;
    let c = m.get(key);
    if (!c){ c = {key, kwp: 0, n: 0, w: 0, st: 0, ax: 0, ay: 0}; m.set(key, c); }
    const kwp = x.kwp != null ? x.kwp : (x.surface || 0) / ratio, w = Math.max(kwp, 1e-6);
    c.kwp += kwp; c.n++; c.w += w; c.st += w * t; c.ax += w * Math.cos(az * D2R); c.ay += w * Math.sin(az * D2R);
  }
  return [...m.values()].map(c => ({
    key: c.key, pt, wkey: pt.key, kwp: c.kwp, n: c.n,
    tilt: c.st / c.w,
    az: ((Math.atan2(c.ay, c.ax) / D2R) + 360) % 360,
  }));
}

/* ---------- Open-Meteo ----------
   Two requests per (weather point, day).
   Forecast: Previous Runs API, `_previous_day1` = value forecast ≥ 24 h before the valid hour, so every
   hour of the day was forecast before the day began. Same call: `temperature_2m` / `wind_speed_10m`
   (day 0 = latest run, whose past hours are the model's analysis) for the "actual" cell temperature,
   and day-0 radiation as the fallback "actual" when satellite data is missing for a whole day.
   Actual: Satellite Radiation API, seamless (MTG/MSG, ~20 min – 2 h latency), SARAH-3 as fallback. */
const FC_VARS = ['shortwave_radiation_previous_day1', 'direct_radiation_previous_day1', 'temperature_2m_previous_day1', 'wind_speed_10m_previous_day1',
  'shortwave_radiation', 'direct_radiation', 'temperature_2m', 'wind_speed_10m'];
const SAT_VARS = ['shortwave_radiation', 'direct_radiation'];
const TODAY_TTL = 10 * 60 * 1000;
function wxFresh(w, date){ return w && (date !== parisDate() || Date.now() - w.fetchedAt < TODAY_TTL); }
async function loadWeather(cells, date){
  const pts = [...new Map(cells.map(c => [c.wkey, c.pt])).values()];
  const todo = pts.filter(c => !wxFresh(state.wx.get(`${c.key}|${date}`), date));
  if (!todo.length) return;
  const loc = `latitude=${todo.map(c => c.lat).join(',')}&longitude=${todo.map(c => c.lon).join(',')}`;
  // Hourly values are means over the hour ENDING at the timestamp, so the local day (00:00–24:00) is the
  // stamps in (midnight, next midnight]. Open-Meteo applies today's UTC offset to the whole requested range
  // (wrong across DST), so ask in UTC and cut the local day ourselves. Paris is UTC+1/+2, so the local day
  // always lies within UTC days date−1 … date. The satellite API rejects any end_date after the current
  // UTC day, and just after midnight in Paris the Paris date is one ahead of it: cap the satellite end there
  // (the hours not yet covered simply come back missing). The forecast API accepts future days.
  const start = shiftDate(date, -1), utcToday = new Date().toISOString().slice(0, 10);
  const range = end => `&start_date=${start}&end_date=${end}&timezone=GMT&timeformat=unixtime`;
  const t0 = parisMidnight(date), t1 = parisMidnight(shiftDate(date, 1));
  const [fc, sat] = await Promise.all([
    getJSON(`${OM_FORECAST}?${loc}&hourly=${FC_VARS.join(',')}&wind_speed_unit=ms${range(date)}`),
    getJSON(`${OM_SATELLITE}?${loc}&hourly=${SAT_VARS.join(',')}&models=${SAT_MODELS.join(',')}${range(date < utcToday ? date : utcToday)}`),
  ]);
  const fcs = Array.isArray(fc) ? fc : [fc], sats = Array.isArray(sat) ? sat : [sat];
  todo.forEach((c, k) => {
    const F0 = fcs[k].hourly, S = sats[k].hourly;
    const a = F0.time.findIndex(t => t > t0), bi = F0.time.findIndex(t => t > t1), b = bi < 0 ? F0.time.length : bi;
    const F = Object.fromEntries(Object.entries(F0).map(([v, arr]) => [v, arr.slice(a, b)]));
    const satMap = new Map(S.time.map((t, h) => [t, h]));
    const pickSat = (v, t) => { const h = satMap.get(t); if (h == null) return null; for (const m of SAT_MODELS){ const x = S[`${v}_${m}`]?.[h]; if (x != null) return x; } return null; };
    state.wx.set(`${c.key}|${date}`, {
      fetchedAt: Date.now(), t: F.time,
      fc: {ghi: F.shortwave_radiation_previous_day1, dir: F.direct_radiation_previous_day1, ta: F.temperature_2m_previous_day1, ws: F.wind_speed_10m_previous_day1},
      d0: {ghi: F.shortwave_radiation, dir: F.direct_radiation, ta: F.temperature_2m, ws: F.wind_speed_10m},
      sat: {ghi: F.time.map(t => pickSat('shortwave_radiation', t)), dir: F.time.map(t => pickSat('direct_radiation', t))},
    });
  });
}

/* ---------- Solar position (NOAA / Meeus, ±0.01°) ---------- */
function sunPos(sec, lat, lon){
  const T = (sec / 86400 + 2440587.5 - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + 0.0003032 * T)) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T), Mr = M * D2R;
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T) + Math.sin(3 * Mr) * 0.000289;
  const om = (125.04 - 1934.136 * T) * D2R;
  const lam = (L0 + C - 0.00569 - 0.00478 * Math.sin(om)) * D2R;
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = (eps0 + 0.00256 * Math.cos(om)) * D2R;
  const decl = Math.asin(Math.sin(eps) * Math.sin(lam));
  const y = Math.tan(eps / 2) ** 2, L0r = L0 * D2R;
  const eot = 4 / D2R * (y * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * y * Math.sin(Mr) * Math.cos(2 * L0r) - 0.5 * y * y * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
  const utcMin = ((sec % 86400) + 86400) % 86400 / 60;
  const ha = ((utcMin + eot + 4 * lon) / 4 - 180) * D2R;
  const la = lat * D2R;
  const cz = Math.sin(la) * Math.sin(decl) + Math.cos(la) * Math.cos(decl) * Math.cos(ha);
  const az = Math.atan2(Math.sin(ha), Math.cos(ha) * Math.sin(la) - Math.tan(decl) * Math.cos(la)) + Math.PI; // from north, clockwise
  return {cz, sz: Math.sqrt(Math.max(0, 1 - cz * cz)), az};
}
/* Sun positions at 5-min steps inside each hourly interval (Open-Meteo hourly radiation is the mean
   over the hour ending at the timestamp). Only steps with the sun above the horizon are kept. */
function sunGeometry(cell, date, times){
  const k = `${cell.key}|${date}`;
  if (state.geo.has(k)) return state.geo.get(k);
  const g = times.map(t => {
    const cz = [], sz = [], az = [];
    for (let s = 0; s < SUBSTEPS; s++){
      const p = sunPos(t - 3600 + (s + 0.5) * 3600 / SUBSTEPS, cell.lat, cell.lon);
      if (p.cz > 0){ cz.push(p.cz); sz.push(p.sz); az.push(p.az); }
    }
    return {cz, sz, az, scz: cz.reduce((a, b) => a + b, 0)};
  });
  state.geo.set(k, g);
  return g;
}

/* ---------- PV model ----------
   Per kWp, for one hour: G_poa = B·Rb + D·(1+cosβ)/2 + G·ρ·(1−cosβ)/2 with Rb = Σcosθ⁺ / Σcos z over the
   hour's sunlit sub-steps (isotropic sky), then the pvwatts DC power with Faiman cell temperature.
   PR is applied afterwards (linear), so the envelope only needs the orientation scenarios. */
function perKwp(g, beta, azP, ghi, dir, ta, ws, tcorr){
  const dif = Math.max(0, ghi - Math.max(0, dir));
  const cb = Math.cos(beta * D2R), sb = Math.sin(beta * D2R), ap = azP * D2R;
  let sct = 0;
  for (let s = 0; s < g.cz.length; s++) sct += Math.max(0, g.cz[s] * cb + g.sz[s] * sb * Math.cos(g.az[s] - ap));
  const rb = g.scz > 0 ? Math.min(RB_MAX, sct / g.scz) : 0;
  const poa = Math.max(0, dir) * rb + dif * (1 + cb) / 2 + ghi * ALBEDO * (1 - cb) / 2;
  let f = poa / 1000;
  if (tcorr && ta != null){
    const tc = ta + poa / (FAIMAN_U0 + FAIMAN_U1 * Math.max(0, ws ?? 1));
    f *= 1 + GAMMA * (tc - 25);
  }
  return f;
}
/* Per hour {mid, lo, hi} in kW (null where unavailable) for one weather source, plus each orientation class's
   central output per hour (kW per kWp) for the map. */
function simulate(cells, date, source, hyp, availableAt){
  const scen = [];
  for (const dt of [0, -hyp.dtilt, hyp.dtilt]) for (const da of [0, -hyp.daz, hyp.daz]) scen.push([dt, da]);
  const n = state.wx.get(`${cells[0].wkey}|${date}`).t.length, out = [], perCell = new Map(cells.map(c => [c.key, new Array(n).fill(null)]));
  for (let h = 0; h < n; h++){
    if (!availableAt(h)){ out.push(null); continue; }
    const tot = new Array(scen.length).fill(0);
    for (const c of cells){
      const w = state.wx.get(`${c.wkey}|${date}`), src = w[source], met = source === 'fc' ? w.fc : w.d0;
      const g = sunGeometry(c.pt, date, w.t)[h];
      const ghi = src.ghi[h], dir = src.dir[h];
      if (ghi == null || dir == null) continue;
      const beta0 = hyp.orient === 'fix' ? hyp.tilt : c.tilt, az0 = hyp.orient === 'fix' ? hyp.az : c.az;
      scen.forEach(([dt, da], s) => {
        const f = perKwp(g, Math.min(90, Math.max(0, beta0 + dt)), az0 + da, ghi, dir, met.ta[h], met.ws[h], hyp.tcorr);
        tot[s] += c.kwp * f;
        if (s === 0) perCell.get(c.key)[h] = f * hyp.pr;
      });
    }
    out.push({mid: tot[0] * hyp.pr, lo: Math.min(...tot) * Math.max(0, hyp.pr - hyp.dpr), hi: Math.max(...tot) * (hyp.pr + hyp.dpr)});
  }
  return {out, perCell};
}

/* ---------- Quarter-hour rendering ----------
   Drawing only: no call, and the figures, table and hero stay on the hourly values. Linear interpolation
   at 15 min, centred on each hourly mean (mid-hour), of the clear-sky index k = GHI / GHI_clear (Haurwitz),
   the direct fraction DNI·cos z / GHI, air temperature and wind; GHI is rebuilt from k and the quarter's
   own clear-sky value, and the output recomputed with the sun at that quarter. Interpolating k rather than
   GHI keeps the curve on the sun's shape at dawn and dusk. */
const haurwitz = cz => cz > 0 ? 1098 * cz * Math.exp(-0.057 / cz) : 0;
function quarterGeometry(pt, date, times){
  const k = `${pt.key}|${date}|q`;
  if (state.geo.has(k)) return state.geo.get(k);
  const out = [];
  for (const t of times) for (let q = 0; q < 4; q++){
    const cz = [], sz = [], az = []; let cs = 0;
    for (let s = 0; s < 3; s++){
      const p = sunPos(t - 3600 + q * 900 + (s + 0.5) * 300, pt.lat, pt.lon);
      if (p.cz > 0){ cz.push(p.cz); sz.push(p.sz); az.push(p.az); cs += haurwitz(p.cz); }
    }
    out.push({cz, sz, az, scz: cz.reduce((a, b) => a + b, 0), cs: cs / 3});
  }
  state.geo.set(k, out);
  return out;
}
function simulateQ(cells, date, source, hyp, availableAt){
  const pt = cells[0].pt, w = state.wx.get(`${pt.key}|${date}`), src = w[source], met = source === 'fc' ? w.fc : w.d0;
  const n = w.t.length, G = sunGeometry(pt, date, w.t), Q = quarterGeometry(pt, date, w.t);
  const scen = [];
  for (const dt of [0, -hyp.dtilt, hyp.dtilt]) for (const da of [0, -hyp.daz, hyp.daz]) scen.push([dt, da]);
  const ok = h => h >= 0 && h < n && availableAt(h) && src.ghi[h] != null && src.dir[h] != null;
  const K = [], B = [];
  for (let h = 0; h < n; h++){
    if (!ok(h)){ K.push(null); B.push(null); continue; }
    const cs = G[h].cz.reduce((a, c) => a + haurwitz(c), 0) / SUBSTEPS;
    K.push(cs > 10 ? Math.min(1.2, src.ghi[h] / cs) : null);
    B.push(src.ghi[h] > 1 ? Math.min(1, Math.max(0, src.dir[h] / src.ghi[h])) : null);
  }
  // Value at offset f (hours, −0.5…0.5) from the centre of hour h, linear towards the neighbouring centre.
  const lerp = (arr, h, f) => {
    const j = f < 0 ? h - 1 : h + 1, a = arr[h], b = ok(j) ? arr[j] : null;
    if (a == null) return b; if (b == null) return a;
    return a + (b - a) * Math.abs(f);
  };
  const out = [], perCell = new Map(cells.map(c => [c.key, new Array(4 * n).fill(null)]));
  for (let h = 0; h < n; h++) for (let q = 0; q < 4; q++){
    if (!ok(h)){ out.push(null); continue; }
    const f = (q + 0.5) / 4 - 0.5, g = Q[4 * h + q];
    const ghi = (lerp(K, h, f) ?? 0) * g.cs, dir = ghi * (lerp(B, h, f) ?? 0);
    const ta = lerp(met.ta, h, f), ws = lerp(met.ws, h, f);
    const tot = new Array(scen.length).fill(0);
    for (const c of cells){
      const beta0 = hyp.orient === 'fix' ? hyp.tilt : c.tilt, az0 = hyp.orient === 'fix' ? hyp.az : c.az;
      scen.forEach(([dt, da], s) => {
        const f = perKwp(g, Math.min(90, Math.max(0, beta0 + dt)), az0 + da, ghi, dir, ta, ws, hyp.tcorr);
        tot[s] += c.kwp * f;
        if (s === 0) perCell.get(c.key)[4 * h + q] = f * hyp.pr;
      });
    }
    out.push({mid: tot[0] * hyp.pr, lo: Math.min(...tot) * Math.max(0, hyp.pr - hyp.dpr), hi: Math.max(...tot) * (hyp.pr + hyp.dpr)});
  }
  return {out, perCell};
}

/* ---------- Year around a site ----------
   One Open-Meteo call per weather point for the whole of SITE_YEAR: ERA5 reanalysis, hourly, in UTC (radiation is the
   mean over the hour ending at the stamp, as in the day view). Same PV model and orientation classes as the day
   view, no quarter-hour step: yearly energy, monthly sums and the envelope (orientation × PR scenarios). */
/* The year's weather point: the centre of the 0.5° cell holding the circle's centre, shared by every site in that cell
   (fewer calls) and by the offline potential (acc.py), so the map and the panel agree. */
const YEAR_GRID = 0.5;
const yearPt = ([lat, lon]) => {
  const a = +(Math.floor(lat / YEAR_GRID + .5) * YEAR_GRID).toFixed(2), b = +(Math.floor(lon / YEAR_GRID + .5) * YEAR_GRID).toFixed(2);
  return {key: `${a}:${b}`, lat: a, lon: b};
};
/* Load shapes (data/profiles.json, from acc.py): a typical day per month × day type (weekday, Saturday, Sunday or
   public holiday) × half-hour; idx maps each half-hour of SITE_YEAR (Paris time, = the ERA5 hours) to its slot. */
function loadProfiles(){
  profP ??= getJSON('data/profiles.json', {}, 'sites').then(P => {
    const idx = new Uint16Array(17520), hol = new Set(P.hol), p2 = n => String(n).padStart(2, '0');
    for (let i = 0; i < 17520; i++){
      const u = P.t0 + i * 1800, d = new Date((u + (u >= P.dst[0] && u < P.dst[1] ? 7200 : 3600)) * 1000), wd = d.getUTCDay();
      const dt = hol.has(`${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`) || wd === 0 ? 2 : wd === 6 ? 1 : 0;
      idx[i] = d.getUTCMonth() * 144 + dt * 48 + d.getUTCHours() * 2 + (d.getUTCMinutes() >= 30 ? 1 : 0);
    }
    PROF = {...P, idx};
    return PROF;
  }).catch(e => { profP = null; throw e; });
  return profP;
}
async function loadYearWeather(pt){
  if (state.year.has(pt.key)) return state.year.get(pt.key);

    `&hourly=shortwave_radiation,direct_radiation,temperature_2m,wind_speed_10m&wind_speed_unit=ms&timezone=GMT&timeformat=unixtime`)).hourly;
