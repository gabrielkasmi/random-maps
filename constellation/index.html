<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constellation — Combien de panneaux autour de moi ?</title>
<meta name="description" content="Combien d'installations photovoltaïques détectées par OpenPVMapper autour de vous ? How many solar installations detected by OpenPVMapper are around you?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23181818'/%3E%3Cg fill='%23e8a33d'%3E%3Crect x='20' y='20' width='16' height='16' rx='2'/%3E%3Crect x='42' y='20' width='16' height='16' rx='2'/%3E%3Crect x='64' y='20' width='16' height='16' rx='2'/%3E%3Crect x='20' y='42' width='16' height='16' rx='2'/%3E%3Crect x='42' y='42' width='16' height='16' rx='2'/%3E%3Crect x='64' y='42' width='16' height='16' rx='2'/%3E%3Crect x='20' y='64' width='16' height='16' rx='2'/%3E%3Crect x='42' y='64' width='16' height='16' rx='2'/%3E%3Crect x='64' y='64' width='16' height='16' rx='2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;600;700;800&display=swap">
<style>
/* World: CYANOTYPE. The map is a sun print: IGN Plan v2 duotoned to Prussian blue, installations left in paper white.
   UI = flat sheets of cream paper pasted over the print. Depth by overlap only (no blur, no drop shadows).
   One ink (Prussian) at several densities; amber is reserved for "you" and for the one action. */
:root{
  --prussian:#0e3566;--prussian-2:#1d5b96;--prussian-3:#4f86bd;
  --paper:#f3efe4;--paper-2:#e7e1d1;--paper-edge:#d6cdb6;--bright:#fffdf6;
  --ink:#0e3566;--ink-soft:#3c5a80;--amber:#e9b44c;--amber-deep:#c8902a;--rust:#a3361f;
  --sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--prussian);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;caret-color:var(--prussian)}
::selection{background:var(--amber);color:var(--prussian)}
a{color:var(--prussian);text-decoration-thickness:1px;text-underline-offset:3px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px;border-radius:3px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.ico{display:block;flex:none}

#map{position:fixed;inset:0;background:var(--prussian)}
.leaflet-container{font:inherit;background:var(--prussian)}
.leaflet-tile-pane{filter:url(#cyanotype)}
.leaflet-tooltip{font:13px/1.3 var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--paper-edge);border-radius:3px;box-shadow:none;padding:4px 8px}
.leaflet-tooltip-top:before{border-top-color:var(--paper)}
.leaflet-bar{border:0!important;box-shadow:none!important}
.leaflet-bar a{background:var(--paper)!important;color:var(--prussian)!important;border-bottom:1px solid var(--paper-edge)!important;border-radius:0!important}
.leaflet-bar a:first-child{border-radius:3px 3px 0 0!important}.leaflet-bar a:last-child{border-radius:0 0 3px 3px!important;border-bottom:0!important}
.leaflet-bar a:hover{background:var(--bright)!important}

/* Paper sheet: the one surface. */
.paper{background:var(--paper);border-radius:3px}

/* Primary action: amber, flat, presses down. */
.cta{display:flex;align-items:center;justify-content:center;gap:.55em;width:100%;padding:14px 18px;border:0;border-radius:3px;
  background:var(--amber);color:var(--prussian);font-size:17px;font-weight:800;letter-spacing:-.01em;cursor:pointer;transition:background .15s,transform .1s var(--ease)}
.cta:hover{background:#efc061}
.cta:active{transform:translateY(1px) scale(.99)}
.cta[aria-busy="true"]{cursor:progress}
.cta[aria-busy="true"] .ico{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Search field */
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;padding:12px 12px 12px 38px;border:1.5px solid var(--prussian);border-radius:3px;background:var(--bright);font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink-soft);opacity:1}
.search input:focus{outline:none;border-color:var(--prussian);box-shadow:inset 0 0 0 1px var(--prussian)}
.search input::-webkit-search-cancel-button{filter:hue-rotate(180deg) saturate(.6)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--prussian);pointer-events:none}
.suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;margin:0;padding:4px;list-style:none;background:var(--bright);
  border:1.5px solid var(--prussian);border-radius:3px;max-height:50vh;overflow:auto}
.suggest:empty{display:none}
.suggest li{padding:9px 10px;border-radius:2px;cursor:pointer}
.suggest li:hover,.suggest li[aria-selected="true"]{background:var(--prussian);color:var(--paper)}

.lang{display:flex;gap:.9em;font-size:13px}
.lang a{color:var(--ink-soft);text-decoration:none;font-weight:600}
.lang a[aria-current="true"]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--amber-deep);text-decoration-thickness:2px;text-underline-offset:5px}
.back{color:var(--ink-soft);text-decoration:none;font-size:13px;font-weight:600}
.back:hover{color:var(--ink);text-decoration:underline}

/* ---------- Welcome: a paper label pasted at the foot of the print ---------- */
.welcome{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(10px + var(--safe-b));padding:20px 20px 18px;animation:paste .7s var(--ease) both}
@keyframes paste{from{transform:translateY(24px);opacity:0}}
.welcome h1{margin:0 0 20px;font-size:clamp(34px,10vw,46px);line-height:.98;letter-spacing:-.035em;font-weight:800;text-wrap:balance}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 12px;color:var(--ink-soft);font:italic 16px var(--serif)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--prussian);opacity:.35}
.msg{margin:10px 0 0;color:var(--ink-soft);font-size:14px}
.msg:empty{display:none}
.welcome .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:12px;border-top:1px solid var(--paper-edge);font-size:12px;color:var(--ink-soft)}

.pick-link{display:flex;align-items:center;gap:8px;margin:12px auto 0;padding:6px 4px;border:0;background:none;color:var(--prussian);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.pick-link:hover{text-decoration-thickness:2px}

/* ---------- Pick mode ---------- */
.pickbar{position:fixed;z-index:1001;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600;animation:paste .4s var(--ease) both}
.pickbar .ico{color:var(--amber-deep)}
.pickbar .link-btn{margin:0 0 0 auto}
.picking .leaflet-container{cursor:crosshair}
@media (min-width:860px){.pickbar{right:auto;width:420px;left:16px;top:16px}}

/* ---------- Installation popup: a small pasted label ---------- */
.pv-pop .leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border:1.5px solid var(--prussian);border-radius:3px;box-shadow:none;padding:0}
.pv-pop .leaflet-popup-tip{background:var(--paper);border:1.5px solid var(--prussian);box-shadow:none}
.pv-pop .leaflet-popup-tip-container{margin-top:-1.5px}
.pv-pop .leaflet-popup-content{margin:12px 34px 12px 14px;font:14px/1.35 var(--sans);min-width:170px}
.pv-pop a.leaflet-popup-close-button{color:var(--prussian);top:6px;right:6px;font:20px/20px var(--sans)}
.pv-pop .pop-k{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pv-pop .pop-sub{margin:4px 0 10px;font:italic 16px var(--serif);color:var(--ink-soft)}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;padding-top:8px;border-top:1px solid var(--paper-edge);font-size:13px}
.pop dt{color:var(--ink-soft)}
.pop dd{margin:0;font-weight:600}
.pv-pop .pop-flag{margin:8px 0 0;font-size:12.5px;font-weight:600}
.pop-flag[data-kind="ok"]{color:var(--prussian)}
.pop-flag[data-kind="warn"]{color:var(--rust)}
.pop-flag:empty{display:none}

/* ---------- Tour ---------- */
.tour-sum{margin:0;font-size:15px;color:var(--ink-soft)}
.tour-sum b{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-right:4px}
.tbar{height:3px;margin:8px 0 2px;background:var(--paper-2);overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--prussian);transition:width .35s var(--ease)}
.tour-note{margin:4px 0 6px;font-size:13.5px;color:var(--ink-soft)}
.tour-note:empty{display:none}
.tour-actions .link-btn{margin-top:4px}
.tour-priv{margin:10px 0 0;font:italic 15px/1.3 var(--serif);color:var(--ink-soft)}

/* ---------- Share overlay ---------- */
.share{position:fixed;inset:0;z-index:1100;display:grid;place-items:center;padding:10px;background:rgba(11,43,85,.72);animation:fade .25s ease both}
@keyframes fade{from{opacity:0}}
.share-card{width:min(400px,100%);max-height:calc(100dvh - 20px);overflow:auto;padding:14px 18px 16px;animation:paste .5s var(--ease) both}
.share-head{display:flex;justify-content:space-between;align-items:center;margin:0 -8px 10px 0}
.share-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.share-frame{display:grid;place-items:center;aspect-ratio:9/16;max-height:min(58dvh,560px);margin:0 auto;background:var(--prussian);border-radius:3px;overflow:hidden}
.share-frame img{display:block;width:100%;height:100%;object-fit:contain}
.share-frame img:not([src]){visibility:hidden}
.share-mode{justify-content:center;margin:12px 0 0}
.share-mode .chip:disabled{opacity:.4;cursor:default}
.share-note{margin:10px 0 12px;font:italic 16px/1.3 var(--serif);color:var(--ink-soft);text-align:center}
.share-note[data-kind="warn"]{color:var(--rust)}
.share-alt{display:flex;justify-content:center;gap:22px}
.share-alt .link-btn{margin-top:10px}
.share-card .msg{text-align:center}

/* ---------- Top bar (results) ---------- */
.topbar{position:fixed;z-index:1000;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:6px;align-items:center;padding:5px}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:3px;background:transparent;color:var(--prussian);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--paper-2)}
.icon-btn[aria-busy="true"] .ico{animation:spin 1.1s linear infinite}
.topbar .search input{border-color:transparent;background:transparent}
.topbar .search input{padding-left:32px}
.topbar .search .ico{left:6px}
.topbar .search input:focus{background:var(--bright);border-color:var(--prussian);box-shadow:none}

/* ---------- Result sheet ---------- */
.sheet{position:fixed;z-index:999;left:10px;right:10px;bottom:calc(10px + var(--safe-b));max-height:64dvh;overflow:auto;overscroll-behavior:contain;padding:18px 20px 14px;
  scrollbar-width:thin;scrollbar-color:var(--prussian-3) transparent;animation:paste .6s var(--ease) both}
.tools{display:flex;justify-content:space-between;margin:12px -8px 0;padding-top:8px;border-top:1px solid var(--paper-edge)}
.tool:disabled{opacity:.35;cursor:default;background:transparent}
.tool{position:relative;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:3px;background:transparent;color:var(--prussian);cursor:pointer}
.tool:hover{background:var(--paper-2)}
.tool[aria-expanded="true"]{background:var(--prussian);color:var(--paper)}
.tool .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px solid var(--paper)}
.n{display:block;margin:2px 0 4px;font-size:clamp(76px,26vw,96px);font-weight:800;line-height:.86;letter-spacing:-.04em;color:var(--prussian)}
.n{font-variant-numeric:proportional-nums}
.n[data-loading]{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.3}}
.what{margin:0;font-size:18px;font-weight:700;line-height:1.25}
.within{font-weight:400;color:var(--ink-soft)}
.what .r{font-weight:800;white-space:nowrap}
.status{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}
.status:empty{display:none}
.status[data-kind="error"]{color:var(--rust)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 0}
.quick div,.tiles div{border-top:1.5px solid var(--prussian);padding-top:8px;font-size:13px;color:var(--ink-soft)}
.quick b,.tiles b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}

.panel{margin:8px 0 0;padding:12px 0 0}
.label{margin:0 0 8px;font-size:13px;font-weight:700}
.group:first-child{margin-top:0}
/* Radius slider: a Prussian rule with an amber bead, right under the distance it sets. */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:2px 0 0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--prussian)}
input[type=range]::-moz-range-track{height:2px;background:var(--prussian)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-11px;border-radius:50%;background:var(--amber);border:2px solid var(--prussian)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--amber);border:2px solid var(--prussian)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--amber-deep);outline-offset:2px}
.group{margin:14px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border:1.5px solid var(--prussian);border-radius:999px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:var(--prussian)}
.chip:hover{background:var(--paper-2)}
.chip[aria-pressed="true"]{background:var(--prussian);color:var(--paper)}
.check{display:flex;gap:9px;align-items:flex-start;margin:7px 0;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--prussian);width:16px;height:16px}
.link-btn{margin-top:12px;padding:0;border:0;background:none;color:var(--prussian);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;font-weight:600}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{margin:20px 0 0}
.chart h2{margin:0 0 8px;font:italic 18px/1.2 var(--serif);color:var(--ink)}
.bars{display:grid;gap:5px}
.bars .row{display:grid;grid-template-columns:4.6em 1fr 3.2em;align-items:center;gap:8px;font-size:12.5px}
.bars .track{height:10px;background:var(--paper-2)}
.bars .fill{height:100%;min-width:2px;background:var(--prussian);transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}}
.bars .v{text-align:right;color:var(--ink-soft)}
.big{margin:0;font-size:14px}

.credits{color:var(--ink-soft);font-size:13px}
.credits p{margin:0 0 8px}
.credits .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.credits a{color:inherit}

.leaflet-control-zoom{display:none}
@media (min-width:860px){
  .welcome{left:24px;right:auto;bottom:24px;width:440px;padding:26px 26px 20px}
  .topbar{right:auto;width:420px;left:16px;top:16px}
  .sheet{left:16px;right:auto;top:82px;bottom:auto;width:420px;max-height:calc(100dvh - 98px)}
  .leaflet-control-zoom{display:block}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- The sun print: luminance of the IGN plan mapped onto a Prussian-blue ramp (light ground → deep blue, ink → paper). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="cyanotype" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
    <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues=".953 .90 .82 .70 .56 .43 .32 .23 .16 .10 .055"/>
      <feFuncG type="table" tableValues=".937 .91 .87 .80 .71 .61 .52 .43 .35 .27 .208"/>
      <feFuncB type="table" tableValues=".894 .90 .90 .88 .84 .79 .73 .66 .57 .48 .400"/>
    </feComponentTransfer>
  </filter>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></g></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20h16"/><path d="M7 16v-4M12 16V6M17 16v-7"/></g></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></g></symbol>
  <symbol id="i-repick" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.5a7.5 7.5 0 1 1-2.2-5.8"/><path d="M19.5 3.5v4h-4"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.2"/></g></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-tour" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18c4 0 3-5 6.5-5S16 7 18 7"/><circle cx="5" cy="18.5" r="2"/><circle cx="19" cy="6.5" r="2"/></g></symbol>
</svg>

<div id="map" role="region" aria-label="Carte"></div>

<!-- Welcome: one big action (locate me); search is the fallback. Settings come later. -->
<section class="paper welcome" id="welcome" aria-labelledby="w-title">
  <h1 id="w-title" data-t="title"></h1>
  <button class="cta" id="w-locate" type="button"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-locate"/></svg><span data-t="locate"></span></button>
  <p class="msg" id="w-msg" role="status"></p>
  <div class="or" data-t="or"></div>
  <div class="search" data-search>
    <svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="search" autocomplete="off" enterkeyhint="search" data-t-ph="placeholder" aria-autocomplete="list">
    <ul class="suggest" role="listbox"></ul>
  </div>
  <button class="pick-link" id="w-pick" type="button"><svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-pin"/></svg><span data-t="pickMap"></span></button>
  <div class="foot">
    <a class="back" data-back href="../">← Random Maps</a>
    <nav class="lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav>
  </div>
</section>

<!-- Results -->
<div class="paper topbar" id="topbar" hidden>
  <a class="icon-btn" data-back href="../" aria-label="Random Maps"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-back"/></svg></a>
  <div class="search" data-search id="bar-search">
    <svg class="ico" width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="search" autocomplete="off" enterkeyhint="search" data-t-ph="placeholder" aria-autocomplete="list">
    <ul class="suggest" role="listbox"></ul>
  </div>
  <button class="icon-btn" id="bar-locate" type="button" data-t-aria="locate"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-locate"/></svg></button>
  <button class="icon-btn" id="bar-pick" type="button" data-t-aria="pickMap" data-t-title="pickMap"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-repick"/></svg></button>
</div>

<!-- Pick mode: the next tap on the map sets the point. -->
<div class="paper pickbar" id="pickbar" hidden role="status">
  <svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-pin"/></svg>
  <span data-t="pickHint"></span>
  <button class="link-btn" id="pick-cancel" type="button" data-t="cancel"></button>
</div>

<section class="paper sheet" id="sheet" hidden aria-live="polite">
  <span class="n" id="n">0</span>
  <p class="what"><span id="what"></span> <span class="within" id="within-pre"></span><b class="r tnum" id="r-val"></b></p>
  <input type="range" id="r" min="0" max="1000" step="1" data-t-aria="radius" aria-describedby="r-val">
  <p class="status" id="status"></p>

  <div class="quick" id="quick">
    <div><b class="tnum" id="q-kwp">–</b><span data-t="s_kwp"></span></div>
    <div><b class="tnum" id="q-near">–</b><span data-t="s_near"></span></div>
  </div>
  <div class="tools" role="toolbar">
    <button class="tool" type="button" id="btn-stats" aria-expanded="false" aria-controls="stats" data-t-aria="stats" data-t-title="stats"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-stats"/></svg></button>
    <button class="tool" type="button" id="btn-filter" aria-expanded="false" aria-controls="filters" data-t-aria="advanced" data-t-title="advanced"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-filter"/></svg><span class="dot" id="filter-dot" hidden></span></button>
    <button class="tool" type="button" id="btn-info" aria-expanded="false" aria-controls="info" data-t-aria="info" data-t-title="info"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-info"/></svg></button>
    <button class="tool" type="button" id="btn-tour" aria-expanded="false" aria-controls="tour" data-t-aria="tour" data-t-title="tour"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-tour"/></svg></button>
    <button class="tool" type="button" id="btn-share" data-t-aria="share" data-t-title="share"><svg class="ico" width="20" height="20" aria-hidden="true"><use href="#i-share"/></svg></button>
  </div>

  <div class="panel" id="stats" hidden>
    <div class="tiles">
      <div><b class="tnum" id="s-area">–</b><span data-t="s_area"></span></div>
      <div><b class="tnum" id="s-dens">–</b><span data-t="s_dens"></span></div>
    </div>
    <div class="chart"><h2 data-t="c_size"></h2><div class="bars" id="c-size"></div></div>
    <div class="chart"><h2 data-t="c_year"></h2><div class="bars" id="c-year"></div></div>
    <div class="chart"><h2 data-t="c_big"></h2><p class="big" id="c-big"></p></div>
  </div>

  <div class="panel" id="filters" hidden>
    <div class="group"><p class="label" data-t="f_size"></p><div class="chips" id="f-size"></div></div>
    <div class="group"><p class="label" data-t="f_src"></p><div class="chips" id="f-src"></div></div>
    <div class="group">
      <p class="label" data-t="f_valid"></p>
      <label class="check"><input type="checkbox" id="f-nofp"><span data-t="f_nofp"></span></label>
      <label class="check"><input type="checkbox" id="f-frpv"><span data-t="f_frpv"></span></label>
    </div>
    <button class="link-btn" id="f-reset" type="button" data-t="reset"></button>
  </div>

  <div class="panel" id="tour" hidden>
    <p class="tour-sum"><b class="tnum" id="t-dist">–</b> <span id="t-time"></span></p>

    <div class="tour-actions"><button class="link-btn" type="button" id="t-gpx" data-t="tGpx"></button></div>
    <p class="tour-priv" data-t="tPrivate"></p>

  <div class="panel credits" id="info" hidden>
    <p data-t-html="foot"></p>
    <p data-t="disclaimer"></p>
    <div class="row"><a class="back" data-back href="../">← Random Maps</a><nav class="lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav></div>
  </div>
</section>

<script>
(function(){

/* ---------- i18n ---------- */

      disclaimer:'Les chiffres proviennent d’une base de détections automatiques : ce ne sont pas des données officielles. À utiliser à vos propres risques.'},
  en:{title:'How many solar panels are around me?',
      locate:'Locate me',or:'or',placeholder:'Search an address or a town…',

      what1:'solar installation',whatN:'solar installations',withinPre:'within ',

      tour:'Walking tour',tGpx:'Export as GPX (Strava, Komoot…)',tProgress:(i,n)=>`Computing the route… ${i}/${n}`,tCap:n=>`Only the ${n} nearest.`,tPartial:'Part of the route is a straight line (routing service unavailable).',
      tCrow:'Routing service unavailable: straight-line route.',tLoading:'Computing the route…',

      shareText:(n,r)=>`${n} solar ${n === 1 ? 'installation' : 'installations'} within ${r} around me ☀️ What about around you?`,pickHint:'Tap the map to drop the point',cancel:'Cancel',
      popArea:a=>`${a} of panels`,popDist:'Distance',popYear:'First seen',popSrc:'Sources',popFrpv:'Confirmed by the FRPV registry',popFP:'Reported as a false positive',popNoKwp:'Unknown capacity',
      loading:'Counting…',extra:'Loading details…',

      apiErr:'The service is not responding. Try again in a moment.',outside:'The map only covers metropolitan France.',
      s_kwp:'combined capacity',s_near:'the closest one',s_area:'of panels',s_dens:'installations / km²',
      stats:'More stats',radius:'Radius',advanced:'Filter',info:'Sources and credits',
      f_size:'Capacity (kWp)',f_src:'Sources',f_valid:'Validation',
      f_nofp:'Exclude reported false positives',f_frpv:'Only detections confirmed by the FRPV registry',
      src:{DPVM:'DeepPVMapper',FRPV:'FRPV',OSM:'OpenStreetMap',manual:'Corrections',recall:'Annotation'},
      reset:'Reset',
      c_size:'Installation size (kWp)',c_year:'First detected (imagery vintage)',c_big:'The largest',
      big:(k,d)=>`${k}, ${d} from the centre.`,
      foot:'Data: <a href="https://deeppvmapper.fr">OpenPVMapper — DeepPVMapper, Gabriel Kasmi</a> (CC BY 4.0). Geocoding: IGN (fallback: Photon, © OpenStreetMap contributors). Basemap: © IGN.',
      disclaimer:'Figures come from a database of automated detections, not official data. Use at your own risk.'}
}[lang];

document.documentElement.lang = lang;
document.title = `Constellation — ${T.title}`;
document.querySelectorAll('[data-t]').forEach(el => el.textContent = T[el.dataset.t]);
document.querySelectorAll('[data-t-html]').forEach(el => el.innerHTML = T[el.dataset.tHtml]);
document.querySelectorAll('[data-t-ph]').forEach(el => el.placeholder = T[el.dataset.tPh]);
document.querySelectorAll('[data-t-aria]').forEach(el => el.setAttribute('aria-label', T[el.dataset.tAria]));
document.querySelectorAll('[data-t-title]').forEach(el => el.title = T[el.dataset.tTitle]);
document.getElementById('within-pre').textContent = T.withinPre;
document.querySelectorAll('[data-back]').forEach(a => a.href = '../?lang=' + lang);
document.querySelectorAll('.lang a').forEach(a => {
  a.setAttribute('aria-current', a.dataset.l === lang);
  a.addEventListener('click', e => { e.preventDefault(); const u = new URL(location); u.searchParams.set('lang', a.dataset.l); location = u; });
});

/* ---------- Formatting ---------- */
const loc = EN ? 'en-GB' : 'fr-FR';
const nf = new Intl.NumberFormat(loc), nf1 = new Intl.NumberFormat(loc, {maximumFractionDigits: 1});
const fmtDist = m => m < 1000 ? `${nf.format(Math.round(m))} m` : `${nf1.format(m / 1000)} km`;
const fmtKwp = k => k >= 1000 ? `${nf1.format(k / 1000)} ${EN ? 'MWp' : 'MWc'}` : `${nf.format(Math.round(k))} ${EN ? 'kWp' : 'kWc'}`;
const fmtArea = a => a >= 10000 ? `${nf1.format(a / 10000)} ha` : `${nf.format(Math.round(a))} m²`;

/* Log slider: 0..1000 ↔ R_MIN..R_MAX, snapped to friendly values. */
const sliderToR = v => {
  const r = R_MIN * Math.pow(R_MAX / R_MIN, v / 1000);
  const step = r < 50 ? 5 : r < 200 ? 10 : r < 1000 ? 50 : 100;
  return Math.min(R_MAX, Math.max(R_MIN, Math.round(r / step) * step));
};
const rToSlider = r => Math.round(1000 * Math.log(r / R_MIN) / Math.log(R_MAX / R_MIN));

/* ---------- State ---------- */
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const urlR = +params.get('r');
const state = {
  center: params.has('lat') && params.has('lon') ? [+params.get('lat'), +params.get('lon')] : null,
  r: urlR >= R_MIN && urlR <= R_MAX ? urlR : DEFAULT_R,
  label: params.get('q') || '',              // exactly what the search bar shows, nothing else
  loaded: null,                               // {center, r, rows}: last fetched set, a superset for smaller radii
  extra: new Map(),                           // id → {sources, frpv_proba, false_positive}, fetched on demand
  filters: {sizes: new Set(SIZE_CLASSES.map((_, i) => i)), sources: new Set(SOURCES.map(s => s[0])), noFP: false, frpvOnly: false}
};
function syncUrl(){
  const u = new URL(location);
  // A GPS position never goes into the URL (it would leak with any copied link); searched places and picked points do.
  const geo = state.label === T.myPos;
  if (state.center && !geo){ u.searchParams.set('lat', state.center[0].toFixed(4)); u.searchParams.set('lon', state.center[1].toFixed(4)); }
  else { u.searchParams.delete('lat'); u.searchParams.delete('lon'); }
  u.searchParams.set('r', state.r);
  state.label && !geo ? u.searchParams.set('q', state.label) : u.searchParams.delete('q');
  history.replaceState(null, '', u);
}

/* ---------- Map ---------- */
const map = L.map('map', {preferCanvas: true, attributionControl: false, zoomControl: true}).setView(DEFAULT_CENTER, 6);
map.zoomControl.setPosition('topright');
L.tileLayer('https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png', {maxZoom: 19}).addTo(map);
const renderer = L.canvas({padding: .5});
const halo = L.circle([0, 0], {radius: 1, color: '#0e3566', weight: 5, opacity: .45, fill: false, interactive: false});
const ring = L.circle([0, 0], {radius: 1, color: '#fffdf6', weight: 1.5, fillColor: '#fffdf6', fillOpacity: .07, interactive: false});
const me = L.circleMarker([0, 0], {radius: 7, color: '#0e3566', weight: 2.5, fillColor: '#e9b44c', fillOpacity: 1, interactive: false});
const dotLayer = L.layerGroup().addTo(map);
let polyLayer = null;
// Installations are what the sun print leaves white; filtered-out ones sink back into the blue.
const PAPER = '#fffdf6';
const DOT_ON = {fillColor: PAPER, fillOpacity: 1, color: '#0e3566', weight: 1, opacity: 1};
const DOT_OFF = {fillColor: '#4f86bd', fillOpacity: .55, weight: 0, opacity: 0};
const DOT_HIDE = {fillOpacity: 0, opacity: 0};
const POLY_ON = {color: PAPER, weight: 1, opacity: 1, fillColor: PAPER, fillOpacity: .85};
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
map.on('zoomend', syncLayers);
map.on('click', e => { if (picking){ endPick(false); setPlace([e.latlng.lat, e.latlng.lng], T.mapPoint); } });

function syncLayers(){
  const z = map.getZoom() >= POLY_ZOOM && polyLayer;
  if (z){ map.removeLayer(dotLayer); polyLayer.addTo(map); }
  else { if (polyLayer) map.removeLayer(polyLayer); dotLayer.addTo(map); }
}
function fitPadding(){
  if (innerWidth >= 860) return {paddingTopLeft: [432, 24], paddingBottomRight: [24, 24]};
  return {paddingTopLeft: [16, 84], paddingBottomRight: [16, $('sheet').offsetHeight + 24]};
}
function fitRing(){ map.fitBounds(L.latLng(state.center).toBounds(state.r * 2.05), {...fitPadding(), maxZoom: 19}); }

/* ---------- Geometry ---------- */
function circlePolygon([lat, lon], r, n = 64){
  const dLat = r / 110574, dLon = r / (111320 * Math.cos(lat * Math.PI / 180)), ringC = [];
  for (let i = 0; i < n; i++){ const t = 2 * Math.PI * i / n; ringC.push([+(lon + dLon * Math.cos(t)).toFixed(6), +(lat + dLat * Math.sin(t)).toFixed(6)]); }
  ringC.push(ringC[0]);
  return {type: 'Polygon', coordinates: [ringC]};
}
function centroid(g){
  const rg = g.type === 'MultiPolygon' ? g.coordinates[0][0] : g.coordinates[0];
  let x = 0, y = 0; for (const [a, b] of rg){ x += a; y += b; }
  return [y / rg.length, x / rg.length];
}
function haversine([a1, o1], [a2, o2]){
  const k = Math.PI / 180, h = Math.sin((a2 - a1) * k / 2) ** 2 + Math.cos(a1 * k) * Math.cos(a2 * k) * Math.sin((o2 - o1) * k / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.sqrt(h));
}
const inFrance = ([la, lo]) => la > 41.2 && la < 51.2 && lo > -5.3 && lo < 9.7;
const sizeClass = k => k == null ? -1 : SIZE_CLASSES.findIndex(([lo, hi]) => k > lo && k <= hi);

/* ---------- API ---------- */
let inflight = null;
async function fetchZone(center, r){
  inflight?.abort(); inflight = new AbortController();
  const res = await fetch(`${SB}/rpc/get_detections_in_zone`, {
    method: 'POST', signal: inflight.signal, headers: {...HEADERS, 'Content-Type': 'application/json'},
    body: JSON.stringify({zone_geometry: circlePolygon(center, r)})
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
// sources / frpv_proba / false_positive are not in the zone response: fetch them by id, only when a filter needs them.
async function fetchExtra(ids){
  const todo = ids.filter(id => !state.extra.has(id));
  for (let i = 0; i < todo.length; i += 800){
    const chunk = todo.slice(i, i + 800);
    const res = await fetch(`${SB}/detections?select=id,sources,frpv_proba,false_positive&id=in.(${chunk.join(',')})`, {headers: HEADERS});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    for (const d of await res.json()) state.extra.set(d.id, d);
  }
}
const needsExtra = () => state.filters.noFP || state.filters.frpvOnly || state.filters.sources.size < SOURCES.length;
const filtersActive = () => needsExtra() || state.filters.sizes.size < SIZE_CLASSES.length;

/* ---------- Selection & stats ---------- */
function passes(row){
  const f = state.filters;
  if (row.d > state.r) return false;
  if (f.sizes.size < SIZE_CLASSES.length && !f.sizes.has(sizeClass(row.kwp))) return false;
  if (!needsExtra()) return true;
  const x = state.extra.get(row.id);
  if (!x) return false;
  if (f.noFP && x.false_positive === true) return false;
  if (f.frpvOnly && !(x.frpv_proba >= FRPV_MIN)) return false;
  if (f.sources.size < SOURCES.length && !String(x.sources || '').split(',').some(s => f.sources.has(s.trim()))) return false;
  return true;
}
function stats(rows){
  const kwp = rows.reduce((s, x) => s + (x.kwp || 0), 0);
  const area = rows.reduce((s, x) => s + (x.surface || 0), 0);
  const nearest = rows.reduce((m, x) => x.d < m.d ? x : m, {d: Infinity});
  const biggest = rows.reduce((m, x) => (x.kwp || 0) > (m.kwp || 0) ? x : m, {kwp: 0});
  const size = SIZE_CLASSES.map(([, , label], i) => ({label, n: rows.filter(x => sizeClass(x.kwp) === i).length}));
  const byYear = {};
  rows.forEach(x => { if (x.year) byYear[x.year] = (byYear[x.year] || 0) + 1; });
  const years = Object.keys(byYear).sort().map(y => ({label: y, n: byYear[y]}));
  return {n: rows.length, kwp, area, nearest, biggest, size, years, density: rows.length / (Math.PI * (state.r / 1000) ** 2)};
}

/* ---------- Render ---------- */
let shownN = 0, countAnim = 0, wave = 0;
function countTo(n){
  cancelAnimationFrame(countAnim);
  cancelAnimationFrame(wave);
  const from = shownN, dur = reducedMotion() ? 0 : 650;
  let t0 = null;

// Strict distance order zigzags across the circle; rings walked clockwise keep "nearest first" without the back-and-forth.
function tourOrder(rows){
  const pts = rows.slice().sort((a, b) => a.d - b.d).slice(0, TOUR_MAX);
  if (!pts.length) return pts;
  const nR = Math.max(1, Math.round(Math.sqrt(pts.length) / 1.6)), maxD = pts[pts.length - 1].d || 1;
  const rings = Array.from({length: nR}, () => []);
  pts.forEach(p => rings[Math.min(nR - 1, Math.floor(p.d / maxD * nR))].push({p, a: bearing(state.center, p.c)}));
  const out = []; let a0 = 0;
  for (const ring of rings){
    ring.sort((x, y) => ((x.a - a0 + 4 * Math.PI) % (2 * Math.PI)) - ((y.a - a0 + 4 * Math.PI) % (2 * Math.PI)));
    ring.forEach(x => out.push(x.p)); if (ring.length) a0 = ring[ring.length - 1].a;

// Every installation, first to last, no return. Long tours are routed in chunks of LEG points that share their end point.
function decodePolyline(str, f = 1e6){
  const out = []; let i = 0, la = 0, lo = 0;
  while (i < str.length){

async function tryOsrm(pts, signal){

  for (let attempt = 0; attempt < 2; attempt++){

async function tryValhalla(pts, signal){

async function routeChunk(pts, signal){

const tourPreview = L.polyline([], {color: '#fffdf6', weight: 1.5, opacity: .45, dashArray: '2 6', interactive: false});

      drawn = reducedMotion() ? target.length : drawn + Math.max(6, Math.ceil(left / 14));
      const seg = target.slice(0, drawn);
      tourLine.setLatLngs(seg); tourHalo.setLatLngs(seg); walker.setLatLng(seg[seg.length - 1]);

  $('t-note').textContent = done < n ? (n > 1 ? T.tProgress(done, n) : T.tLoading) : '';

  if (!state.last?.s.n) return;
  map.closePopup();
  $('share').hidden = false; $('share-msg').textContent = ''; $('share-img').removeAttribute('src');
  $('share-close').focus();
  if (shareMode === 'tour' && !state.tour) shareMode = 'dots';
  document.querySelectorAll('.share-mode .chip').forEach(c => {
    c.setAttribute('aria-pressed', c.dataset.mode === shareMode);
    if (c.dataset.mode === 'tour') c.disabled = !state.tour;
  });
  const warn = shareMode === 'tour';
  $('share-note').textContent = warn ? T.shareTourWarn : T.shareNote; $('share-note').dataset.kind = warn ? 'warn' : '';
  shareBlob = await renderShare();
  $('share-img').src = URL.createObjectURL(shareBlob);
}
document.querySelector('.share-mode').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c || c.disabled || c.dataset.mode === shareMode) return;
  shareMode = c.dataset.mode; openShare();
});
function closeShare(){ $('share').hidden = true; $('btn-share').focus(); }
function download(){
  const a = document.createElement('a'); a.href = URL.createObjectURL(shareBlob); a.download = 'constellation.png'; a.click();
}
async function copyText(){
  try { await navigator.clipboard.writeText(shareText()); $('share-msg').textContent = T.copied; } catch (e){ /* clipboard blocked: nothing to do */ }
}
$('btn-share').addEventListener('click', openShare);
$('share-close').addEventListener('click', closeShare);
$('share').addEventListener('click', e => { if (e.target === $('share')) closeShare(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('share').hidden) closeShare(); });
$('share-dl').addEventListener('click', () => shareBlob && download());
$('share-copy').addEventListener('click', copyText);
$('share-go').addEventListener('click', async () => {
  if (!shareBlob) return;
  const file = new File([shareBlob], 'constellation.png', {type: 'image/png'});
  try {
    if (navigator.canShare?.({files: [file]})) await navigator.share({files: [file], text: shareText()});
    else if (navigator.share) await navigator.share({text: shareText()});
    else { download(); await copyText(); }
  } catch (e){ if (e.name !== 'AbortError'){ download(); await copyText(); } }
});

/* ---------- Flow ---------- */
function showResults(){
  $('welcome').hidden = true;
  $('topbar').hidden = $('sheet').hidden = false;
  [halo, ring, me].forEach(l => l.addTo(map));
}

// (Re)load the detections when the centre moves or the radius grows past what we have.
async function load({fit = true} = {}){
  if (!state.center) return;
  syncUrl();
  showResults();
  $('r-val').textContent = fmtDist(state.r);
  $('bar-search').querySelector('input').value = state.label;
  halo.setLatLng(state.center).setRadius(state.r); ring.setLatLng(state.center).setRadius(state.r); me.setLatLng(state.center);
  if (!inFrance(state.center)){ setStatus(T.outside, 'error'); return; }
  const have = state.loaded;
  const covered = have && have.center[0] === state.center[0] && have.center[1] === state.center[1] && have.r >= state.r;
  if (fit) fitRing();
  if (covered){ update(); return; }
  setStatus(T.loading); setLoading(true);
  try {
    const feats = await fetchZone(state.center, state.r);
    const rows = feats.map(f => {
      const c = centroid(f.geometry);
      return {id: f.id, f, c, d: haversine(state.center, c), kwp: f.properties.kwp, surface: f.properties.surface, year: f.properties.year, on: true};
    });
    state.loaded = {center: state.center.slice(), r: state.r, rows};
    buildLayers(rows);
    if (needsExtra()) await fetchExtra(rows.map(r => r.id));
    setStatus(''); setLoading(false); update({fresh: true});
  } catch (e){
    if (e.name === 'AbortError') return;
    console.error(e); setLoading(false); setStatus(T.apiErr, 'error');
  }
}
function setPlace(center, label){ state.center = center; state.label = label; state.loaded = null; state.tour = null; setStatus(''); load(); }

/* Geolocation */
function locate(btn, onFail){
  if (!navigator.geolocation){ onFail(); return; }
  btn.setAttribute('aria-busy', 'true');
  navigator.geolocation.getCurrentPosition(
    p => { btn.removeAttribute('aria-busy'); setPlace([p.coords.latitude, p.coords.longitude], T.myPos); },
    () => { btn.removeAttribute('aria-busy'); onFail(); },
    {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000}
  );
}
$('w-locate').addEventListener('click', () => {
  $('w-msg').textContent = T.locating;
  locate($('w-locate'), () => { $('w-msg').textContent = T.denied; document.querySelector('#welcome input').focus(); });
});
$('bar-locate').addEventListener('click', () => locate($('bar-locate'), () => setStatus(T.denied, 'error')));

/* Geocoding: IGN Géoplateforme first; if it errors or takes > 2.5 s, fall back to Photon (OSM).
   Both are normalised to {label, lat, lon}. */
async function geocodeIGN(q, signal){
  const t = new AbortController(), kill = () => t.abort();
  signal.addEventListener('abort', kill); const to = setTimeout(kill, 2500);
  try {
    const res = await fetch(`${GEOCODER}?q=${encodeURIComponent(q)}&limit=5`, {signal: t.signal});
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return ((await res.json()).features || []).map(f => ({label: f.properties.label, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1]}));
  } finally { clearTimeout(to); signal.removeEventListener('abort', kill); }
}
async function geocodePhoton(q, signal){
  const res = await fetch(`${PHOTON}?q=${encodeURIComponent(q)}&limit=5&lang=${lang}&bbox=-5.3,41.2,9.7,51.2`, {signal});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return ((await res.json()).features || []).map(({properties: p, geometry: g}) => {
    const main = p.street ? [p.housenumber, p.street].filter(Boolean).join(' ') : p.name;
    const ctx = [p.postcode, p.city && p.city !== main ? p.city : (p.county || p.state)].filter(Boolean).join(' ');
    return {label: [main, ctx].filter(Boolean).join(', '), lon: g.coordinates[0], lat: g.coordinates[1]};
  }).filter(f => f.label);
}
async function geocode(q, signal){
  try { const r = await geocodeIGN(q, signal); if (r.length) return r; }
  catch (e){ if (signal.aborted) throw e; }
  return geocodePhoton(q, signal);
}

/* Address search, same behaviour for both fields */
document.querySelectorAll('[data-search]').forEach(box => {
  const input = box.querySelector('input'), list = box.querySelector('ul');
  let timer, ctrl, items = [], active = -1;
  const close = () => { list.innerHTML = ''; items = []; active = -1; };
  const pick = i => {
    const f = items[i]; if (!f) return;
    input.value = f.label; close(); input.blur();
    setPlace([f.lat, f.lon], f.label);
  };
  const paint = () => list.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === active));
  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3){ close(); return; }
    timer = setTimeout(async () => {
      ctrl?.abort(); ctrl = new AbortController();
      try {
        items = await geocode(q, ctrl.signal); active = -1;
        list.innerHTML = items.map((f, i) => `<li role="option" data-i="${i}">${f.label.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;')}</li>`).join('');
      } catch (e){ /* aborted or offline: keep quiet */ }
    }, 220);
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && items.length){ e.preventDefault(); active = (active + 1) % items.length; paint(); }
    else if (e.key === 'ArrowUp' && items.length){ e.preventDefault(); active = (active - 1 + items.length) % items.length; paint(); }
    else if (e.key === 'Enter' && items.length){ e.preventDefault(); pick(Math.max(0, active)); }
    else if (e.key === 'Escape') close();
  });
  list.addEventListener('pointerdown', e => { const li = e.target.closest('li'); if (li){ e.preventDefault(); pick(+li.dataset.i); } });
  input.addEventListener('blur', () => setTimeout(close, 150));
});

/* Sheet toggles */
// Stats, filters and credits share the space under the count: at most one is open, so the sheet stays short.
const PANELS = [['btn-stats', 'stats'], ['btn-filter', 'filters'], ['btn-tour', 'tour'], ['btn-info', 'info']];
function openPanel(id){
  PANELS.forEach(([b, p]) => { const on = p === id; $(b).setAttribute('aria-expanded', on); $(p).hidden = !on; });
  id === 'tour' ? showTour() : hideTour();
}
PANELS.forEach(([b, p]) => $(b).addEventListener('click', () => openPanel($(b).getAttribute('aria-expanded') === 'true' ? null : p)));

/* Radius: live while dragging inside what is loaded, fetch on release if it grows. */
const slider = $('r');
slider.value = rToSlider(state.r);
slider.addEventListener('input', () => {
  state.r = sliderToR(+slider.value);
  $('r-val').textContent = fmtDist(state.r);
  halo.setRadius(state.r); ring.setRadius(state.r);
  if (state.loaded && state.r <= state.loaded.r) update();
});
slider.addEventListener('change', () => load());

/* Advanced selection */
$('f-size').innerHTML = SIZE_CLASSES.map(([, , l], i) => `<button class="chip" type="button" data-i="${i}" aria-pressed="true">${l}</button>`).join('');
$('f-src').innerHTML = SOURCES.map(([k, n]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="true">${T.src[n]}</button>`).join('');
async function applyFilters(){
  if (needsExtra() && state.loaded){
    setStatus(T.extra);
    try { await fetchExtra(state.loaded.rows.map(r => r.id)); setStatus(''); }
    catch (e){ console.error(e); setStatus(T.apiErr, 'error'); return; }
  }
  update();
}
function chipGroup(el, set, key){
  el.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const v = key === 'i' ? +b.dataset.i : b.dataset.k;
    if (set.has(v)){ if (set.size === 1) return; set.delete(v); } else set.add(v);  // never empty the selection
    b.setAttribute('aria-pressed', set.has(v));
    applyFilters();
  });
}
chipGroup($('f-size'), state.filters.sizes, 'i');
chipGroup($('f-src'), state.filters.sources, 'k');
$('f-nofp').addEventListener('change', e => { state.filters.noFP = e.target.checked; applyFilters(); });
$('f-frpv').addEventListener('change', e => { state.filters.frpvOnly = e.target.checked; applyFilters(); });
$('f-reset').addEventListener('click', () => {
  SIZE_CLASSES.forEach((_, i) => state.filters.sizes.add(i));
  SOURCES.forEach(([k]) => state.filters.sources.add(k));
  state.filters.noFP = state.filters.frpvOnly = false;
  $('f-nofp').checked = $('f-frpv').checked = false;
  document.querySelectorAll('#filters .chip').forEach(c => c.setAttribute('aria-pressed', 'true'));
  update();
});

/* Boot: a shared link (lat/lon in the URL) goes straight to the result. */
if (state.center) load();
})();
</script>
