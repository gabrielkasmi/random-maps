<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le plus solarisé de France</title>
<meta name="description" content="Mairies, écoles, gares, piscines… quels équipements publics ont le plus de panneaux solaires autour d’eux ? Classement d’après les installations détectées par IA (OpenPVMapper). Town halls, schools, stations, pools… which public buildings have the most solar panels around them?">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c4452d'/%3E%3Crect x='14' y='54' width='22' height='30' fill='%23b9c0c9'/%3E%3Crect x='39' y='34' width='22' height='50' fill='%23e2b23a'/%3E%3Crect x='64' y='64' width='22' height='20' fill='%23a95d32'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* World: PISTE D’ATHLÉ. The ranking is a track meet: brick-red track as the accent (a solid band on the
   sheet's edge), navy ink, gold / silver / bronze reserved for the three first of whatever area is shown, and one sun
   yellow for every detected installation. Space Grotesk (SIL OFL), self-hosted. Ground: IGN Plan v2, greyed and warmed
   so that only medals and installations carry colour; IGN aerial photo on demand around a building.
   The map comes first: the sheet starts as a slim strip and opens in steps (search + categories, then a ranking). */
@font-face{font-family:"Space Grotesk";font-weight:300 700;font-display:swap;src:url(fonts/space-grotesk-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Space Grotesk";font-weight:300 700;font-display:swap;src:url(fonts/space-grotesk-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#ffffff;--ink:#1a2238;--soft:#5d6478;--faint:#8b91a3;--line:#ecdcd6;--mist:#f7efec;
  --track:#c4452d;--track-dk:#a3361f;--gold:#e2b23a;--gold-ink:#2b1f00;--silver:#b9c0c9;--silver-ink:#1a2238;--bronze:#a95d32;--bronze-ink:#ffffff;
  --sun:#f5b400;--sun-deep:#7a5600;--sun-soft:#fff3cc;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;--sheet-w:400px;--gap:16px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 6px 24px rgba(26,34,56,.2);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#e4e6ea;color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--sun);color:var(--ink)}
:focus-visible{outline:2px solid var(--track);outline-offset:2px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
sup{font-size:.55em;line-height:0;vertical-align:.75em;margin-left:.04em;font-weight:inherit}
svg.g{display:block;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- map ---------- */
#map{position:fixed;inset:0;background:#e4e6ea}
.leaflet-container{font:inherit;background:#e4e6ea}
.plan .leaflet-tile-pane{filter:grayscale(.85) sepia(.18) contrast(.92) brightness(1.04)}
.leaflet-control-attribution{font:11px/1.4 var(--font);background:rgba(255,255,255,.85)!important;color:var(--soft)}
.leaflet-control-attribution a{color:var(--ink)}
.leaflet-top.leaflet-right{top:calc(56px + var(--safe-t))}
.leaflet-top.leaflet-right .leaflet-control{margin:0 var(--gap) 0 0}
.leaflet-bar{border:0!important;box-shadow:var(--shadow)!important;border-radius:var(--r)!important;overflow:hidden}
.leaflet-bar a{background:var(--bg)!important;color:var(--ink)!important;font:600 20px/34px var(--font)!important;width:34px!important;height:34px!important;border-bottom-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--mist)!important}
.mk{display:flex;align-items:center;justify-content:center;border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 5px rgba(26,34,56,.35);font:700 12px/1 var(--font);font-variant-numeric:tabular-nums;transition:transform .2s var(--ease)}
.mk svg.g{width:58%;height:58%;stroke-width:2.2}
.mk:hover{transform:scale(1.15)}
.leaflet-tooltip.tip{width:max-content;min-width:170px;background:var(--bg);color:var(--ink);border:0;border-radius:var(--r);box-shadow:var(--shadow);font:600 14px/1.25 var(--font);padding:8px 11px 9px;max-width:270px;white-space:normal}
.leaflet-tooltip.tip::before{display:none}
.tip .tk{display:flex;align-items:center;gap:6px;font:700 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
.tip .tk i{width:10px;height:10px;border-radius:50%;flex:none}
.tip .tr{display:flex;align-items:baseline;gap:8px;margin-top:5px;font-weight:400;font-size:12.5px;color:var(--soft)}
.tip .tr b{font-size:17px;color:var(--ink);font-weight:700}
.tip .tr b.m1{color:#a57a0c}.tip .tr b.m2{color:#6f7985}.tip .tr b.m3{color:var(--bronze)}
.tip small{display:block;font-weight:400;font-size:12.5px;color:var(--soft);margin-top:2px}
.pvm{fill:var(--sun);stroke:var(--sun-deep)}

/* ---------- floating chrome ---------- */
.pill{position:fixed;z-index:1000;top:calc(var(--gap) + var(--safe-t));height:36px;display:flex;align-items:center;gap:2px;padding:0 4px;background:var(--bg);border-radius:18px;box-shadow:var(--shadow);font-size:13px;font-weight:600}
.pill a{color:var(--soft);text-decoration:none;padding:0 10px;height:28px;display:flex;align-items:center;border-radius:14px}
.pill a:hover{color:var(--ink);background:var(--mist)}
.home-pill{left:var(--gap)}
.lang{right:var(--gap)}
.lang a[aria-current="true"]{background:var(--ink);color:#fff}
.basemap{position:fixed;z-index:900;right:var(--gap);top:calc(140px + var(--safe-t));display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.basemap button{border:0;background:none;padding:0 10px;height:30px;font:700 11.5px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.basemap button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- sheet: strip → search + categories → ranking ---------- */
.sheet{position:fixed;z-index:1000;left:var(--gap);bottom:var(--gap);width:var(--sheet-w);max-height:calc(100% - 72px - var(--safe-t) - var(--gap));
  background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.lanes{flex:none;height:6px;background:var(--track)}
.head{flex:none;display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px 10px 16px;border:0;background:none;text-align:left}
.head .ht{flex:1;min-width:0}
.eyebrow{display:flex;align-items:center;gap:7px;font:700 10.5px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.eyebrow i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--mist)}
.head h1{margin:3px 0 0;font:700 19px/1.12 var(--font);letter-spacing:-.02em;text-wrap:balance}
.toggle{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border-radius:16px;background:var(--track);color:#fff;font:700 12.5px var(--font)}
.toggle svg.g{width:16px;height:16px;transition:transform .3s var(--ease)}
.sheet.open .toggle{background:var(--mist);color:var(--ink);padding:0 8px}
.sheet.open .toggle span{display:none}
.sheet.open .toggle svg.g{transform:rotate(180deg)}
.head:hover .toggle{filter:brightness(1.06)}
.body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px calc(16px + var(--safe-b));border-top:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.sheet:not(.open) .body{display:none}
.search{position:relative;margin-top:12px}
.search input{width:100%;height:42px;border:0;border-radius:var(--r);background:var(--mist);color:var(--ink);padding:0 12px 0 38px;font:500 16px var(--font);-webkit-appearance:none;appearance:none}
.search input:focus{outline:2px solid var(--ink);outline-offset:0;background:#fff}
.search input::placeholder{color:var(--soft);font-weight:400}
.search svg.g{position:absolute;left:12px;top:12px;width:18px;height:18px;pointer-events:none;color:var(--soft)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px 0;list-style:none;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);max-height:40vh;overflow:auto;z-index:5}
.results li{padding:9px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.results li[aria-selected="true"],.results li:hover{background:var(--mist)}
.results small{color:var(--soft)}
.results .empty{cursor:default;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 5px;border:0;border-radius:14px;background:var(--mist);color:var(--soft);font:700 12.5px var(--font)}
.chip .dot{width:18px;height:18px}
.chip.cup{background:#fbf1d2;color:#6b4e00;padding-left:6px}
.chip.cup svg.g{width:17px;height:17px}
.chip:hover{color:var(--ink)}
.chip[aria-selected="true"]{background:var(--track);color:#fff}
.chip.cup[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}
.dot{flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.dot svg.g{width:62%;height:62%;stroke-width:2.4}
.info{margin:12px 0 0;font-size:12.5px;color:var(--soft)}
.info summary{cursor:pointer;padding:4px 0;font-weight:600}

/* podium */
.pod{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:end;gap:6px;margin-top:16px}
.pod button{border:0;background:none;padding:0;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;min-width:0}
.pod .nm{font-size:12.5px;line-height:1.2;font-weight:600;padding:0 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pod .cm{font-size:11.5px;color:var(--soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .kw{font:700 13px var(--font);font-variant-numeric:tabular-nums;margin:3px 0 5px}
.pod .blk{border-radius:var(--r) var(--r) 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:7px;font:700 28px/1 var(--font)}
.pod .p1 .blk{height:80px;font-size:36px;background:var(--gold);color:var(--gold-ink)}
.pod .p2 .blk{height:58px;background:var(--silver);color:var(--silver-ink)}
.pod .p3 .blk{height:42px;background:var(--bronze);color:var(--bronze-ink)}
.pod button:hover .nm,.pod button:focus-visible .nm{text-decoration:underline;text-underline-offset:3px}
.pod-base{height:5px;background:var(--ink);border-radius:2px}

/* rows */
.sect{margin:16px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;font:700 11.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.sect small{font:400 12px var(--font);letter-spacing:0;text-transform:none;text-align:right}
.board{list-style:none;margin:0;padding:0}
.board li{border-top:1px solid var(--line)}
.board button{width:100%;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:9px;padding:8px 4px;border:0;background:none;text-align:left;border-radius:var(--r)}
.board button:hover{background:var(--mist)}
.board button:hover b.n,.board button:focus-visible b.n{text-decoration:underline;text-underline-offset:3px}
.board .me button{background:var(--mist);box-shadow:inset 3px 0 0 var(--track)}
.board .gap{border-top:0;text-align:center;color:var(--faint);font-size:13px;line-height:1;padding:4px 0}
.rk{font:700 19px/1 var(--font);text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.rk.m1{color:#a57a0c}.rk.m2{color:#6f7985}.rk.m3{color:var(--bronze)}
.rk .dot{width:30px;height:30px;margin-left:auto}
.nmc{min-width:0}
.nmc b.n{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.nmc small{display:block;color:var(--soft);font-size:12.5px;line-height:1.3;margin-top:1px}
.nmc .cat{font:700 10.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.val{text-align:right;white-space:nowrap}
.val b{display:block;font:700 15px/1.15 var(--font);font-variant-numeric:tabular-nums}
.val small{display:block;font-size:12px;color:var(--soft)}
.more-btn{margin-top:6px;border:0;background:none;padding:6px 0;font-weight:600;color:var(--track);text-decoration:underline;text-underline-offset:3px}

.notes{margin:20px 0 0;padding:12px 14px;background:var(--mist);border-radius:var(--r);font-size:12.5px;line-height:1.45;color:var(--soft)}
.notes p{margin:0}
.notes p+p{margin-top:6px}
.notes b{color:var(--ink);font-weight:600}
details.about{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--soft)}
details.about summary{cursor:pointer;font:700 11.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);padding:6px 0}
details.about p{margin:6px 0}
details.about a{color:var(--ink)}
details.about table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px}
details.about td,details.about th{text-align:left;padding:3px 6px 3px 0;border-top:1px solid var(--line);font-weight:400}
details.about th{font-weight:600;color:var(--ink)}
details.about td.n{text-align:right;font-variant-numeric:tabular-nums}

/* building view */
.back{display:inline-flex;align-items:center;gap:4px;margin:8px 0 0 -4px;border:0;background:none;padding:6px 4px;font-weight:600;color:var(--ink);border-radius:var(--r)}
.back:hover{background:var(--mist)}
.back svg.g{width:18px;height:18px}
.d-com{margin:2px 0 0;color:var(--soft);font-size:14px}
.d-also{margin:3px 0 0;font-size:12.5px;color:var(--soft)}
.seg{display:flex;gap:3px;padding:3px;margin-top:12px;background:var(--mist);border-radius:var(--r)}
.seg button{flex:1;min-width:0;height:34px;border:0;border-radius:calc(var(--r) - 2px);background:none;color:var(--soft);font:700 12.5px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-checked="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(26,34,56,.18)}
.seg button:disabled{color:var(--faint);cursor:not-allowed}
.big{display:flex;align-items:center;gap:14px;margin-top:14px}
.medal{flex:none;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 34px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.medal.m1{background:var(--gold);color:var(--gold-ink)}.medal.m2{background:var(--silver);color:var(--silver-ink)}.medal.m3{background:var(--bronze);color:var(--bronze-ink)}
.medal.m0{background:#fff;color:var(--track);box-shadow:inset 0 0 0 3px var(--track)}
.medal.long{font-size:23px}.medal.xlong{font-size:18px}
.big p{margin:0;font-size:14px;line-height:1.35;color:var(--soft)}
.big p b{color:var(--ink);font-weight:600}
.big p .area{display:block;color:var(--ink);font-weight:600;font-size:15px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.figs div{background:var(--mist);border-radius:var(--r);padding:10px 12px}
.figs b{display:block;font:700 25px/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.figs span{display:block;margin-top:4px;font-size:12px;line-height:1.3;color:var(--soft)}
.figs .sun b::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--sun);border:1.5px solid var(--sun-deep);margin-right:7px;vertical-align:.15em}
.rnote{margin:6px 0 0;font-size:12.5px;color:var(--track-dk);font-weight:600;min-height:1.45em}
.inst{list-style:none;margin:4px 0 0;padding:0}
.inst li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 4px;border-top:1px solid var(--line);font-size:13px;border-radius:var(--r)}
.inst li.hl{background:var(--sun-soft)}
.inst b{font-variant-numeric:tabular-nums;font-weight:600}
.inst small{color:var(--soft);font-variant-numeric:tabular-nums}
.warn{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:var(--sun-soft);font-size:12.5px;line-height:1.45}
.loading{color:var(--soft);font-size:14px;margin-top:16px}
.c-group{margin-top:14px}
.c-group h3{margin:0 0 2px;display:flex;align-items:center;gap:7px;font:700 11.5px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.c-group h3 .dot{width:20px;height:20px}
.c-group .board button{grid-template-columns:1fr auto}

@media (max-width:720px){
  :root{--gap:10px;--sheet-w:auto}
  .sheet{left:0;right:0;bottom:0;border-radius:14px 14px 0 0;max-height:calc(100% - 64px - var(--safe-t))}
  .sheet.list{height:58svh}
  .sheet.list.tall{height:calc(100% - 64px - var(--safe-t))}
  .head{padding:9px 10px 10px 14px}
  .head h1{font-size:17px}
  .sheet:not(.open) .head{padding-bottom:calc(10px + var(--safe-b))}
  .body{padding:0 14px calc(16px + var(--safe-b))}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:10px -14px 0;padding:0 14px 2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .leaflet-bottom.leaflet-right .leaflet-control-attribution{display:none}
  .basemap{top:calc(130px + var(--safe-t))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div id="map" class="plan" role="region" aria-label="Carte"></div>
<nav class="pill home-pill"><a data-back href="../">← Random Maps</a></nav>
<nav class="pill lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav>
<div class="basemap" id="basemap" hidden></div>
<aside class="sheet" id="sheet">
  <div class="lanes" aria-hidden="true"></div>
  <button type="button" class="head" id="head" aria-expanded="false" aria-controls="body">
    <span class="ht" id="headtext"></span>
    <span class="toggle" aria-hidden="true"><span id="toggleLbl"></span><svg class="g" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></span>
  </button>
  <div class="body" id="body"><div id="view"></div></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const lang = params.get('lang') === 'en' ? 'en' : 'fr';
const EN = lang === 'en';
document.documentElement.lang = lang;
const NF = new Intl.NumberFormat(EN ? 'en-GB' : 'fr-FR');
const NF1 = new Intl.NumberFormat(EN ? 'en-GB' : 'fr-FR', {maximumFractionDigits: 1});
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHONE = matchMedia('(max-width: 720px)');
document.querySelectorAll('.lang a').forEach(a => a.setAttribute('aria-current', a.dataset.l === lang));
document.querySelectorAll('[data-back]').forEach(a => a.href = '../?lang=' + lang);

const T = {
  fr: {
    eyebrow: 'Palmarès solaire', allTitle: 'Les équipements publics les plus solarisés de France', explore: 'Explorer',
    search: 'Chercher une commune', cup: 'Champions de France', champions: 'Les champions de France', championsHint: 'le n° 1 de chaque catégorie',
    top: (k, n, pl) => `Top ${k} sur ${NF.format(n)} ${pl}`,
    inst: n => n > 1 ? `${NF.format(n)} installations` : `${n} installation`,
    within: r => `à moins de ${r} m`,
    back: 'Classement', backCommune: 'Retour à la commune',
    of: (n, pl) => `sur <b>${NF.format(n)}</b> ${pl}`, tie: 'ex æquo', ofFrance: 'de France',
    france: 'France', scopeLbl: 'Classement',
    rankedAt: r => `Le rang reste calculé à ${r} m.`, around: 'Autour du bâtiment',

function ord(n, g) {
  if (!EN) return `${NF.format(n)}<sup>${n === 1 ? (g === 'f' ? 're' : 'er') : 'e'}</sup>`;
  const s = (n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1: 'st', 2: 'nd', 3: 'rd'}[n % 10] || 'th');
  return `${NF.format(n)}<sup>${s}</sup>`;
}
const plain = h => h.replace(/<[^>]+>/g, '');
const unit = EN ? 'kWp' : 'kWc';
const kw = v => v >= 1000 ? `${NF1.format(v / 1000)} ${EN ? 'MWp' : 'MWc'}` : `${NF.format(Math.round(v))} ${unit}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const MEDAL = ['', ['#e2b23a', '#2b1f00'], ['#b9c0c9', '#1a2238'], ['#a95d32', '#ffffff']];

const svg = k => `<svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path d="${G[k]}"/></svg>`;
const dot = (c, s) => `<span class="dot" style="background:${c.color};color:${c.ink};width:${s}px;height:${s}px">${svg(c.icon)}</span>`;

let CFG, CATS, CAT = {}, TOP = {}, COMMUNES = null;
const DEP = {}, LBF = {}, HINT = {};

// ---------------------------------------------------------------- map
const mapEl = document.getElementById('map');
const sheet = document.getElementById('sheet'), head = document.getElementById('head');
const map = L.map(mapEl, {zoomControl: false, minZoom: 4.5, maxZoom: 19, zoomSnap: .5, zoomDelta: 1});
L.control.zoom({position: 'topright'}).addTo(map);
map.attributionControl.setPrefix(false);
const W = 'https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}';
const ATTR = '© <a href="https://www.ign.fr/">IGN</a> · <a href="https://deeppvmapper.fr">OpenPVMapper / DeepPVMapper</a> · <a href="https://www.insee.fr/fr/statistiques/8217525">Insee BPE</a> · © <a href="https://www.openstreetmap.org/copyright">OSM</a>';
const TB = [[34, -14], [58, 22]];  // area checked tile by tile at z4–7 (IGN answers 200 everywhere here); no requests beyond
const planL = L.tileLayer(W + '&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png', {maxZoom: 19, bounds: TB, attribution: ATTR}).addTo(map);
const photoL = L.tileLayer(W + '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg', {maxZoom: 19, bounds: TB, attribution: ATTR});
const FR = L.latLngBounds([42.3, -4.9], [51.1, 8.3]);

const bm = document.getElementById('basemap');

function setBase(photo) {
  if (photo) { map.removeLayer(planL); photoL.addTo(map); } else { map.removeLayer(photoL); planL.addTo(map); }
  mapEl.classList.toggle('plan', !photo);
  bm.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', (x.dataset.b === 'photo') === photo));
}
bm.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setBase(b.dataset.b === 'photo'); });

// keep what we fit to the map clear of the pills and the sheet
function pad() {
  const h = sheet.offsetHeight;
  if (PHONE.matches) return {paddingTopLeft: [24, 70], paddingBottomRight: [24, h + 20]};
  const covers = h > innerHeight * .45;
  return covers ? {paddingTopLeft: [sheet.offsetWidth + 48, 64], paddingBottomRight: [70, 24]} : {paddingTopLeft: [40, 56], paddingBottomRight: [70, 24]};
}
// whole: snap down to an integer zoom (aerial tiles show seams at fractional zooms)
const fit = (b, maxZoom, whole) => requestAnimationFrame(() => {
  const o = pad();
  if (whole) maxZoom = Math.min(maxZoom, Math.floor(map.getBoundsZoom(b, false, L.point(o.paddingTopLeft).add(o.paddingBottomRight))));
  map.fitBounds(b, {...o, maxZoom, animate: !REDUCED, duration: .7});
});

function mk(c, {rank, size, mode}) {
  let bg = c.color, fg = c.ink, inner = svg(c.icon);
  if (mode === 'rank') { const m = MEDAL[rank]; bg = m ? m[0] : '#c4452d'; fg = m ? m[1] : '#fff'; inner = rank; }
  return L.divIcon({className: '', iconSize: [size, size], iconAnchor: [size / 2, size / 2],
    html: `<div class="mk" style="width:${size}px;height:${size}px;background:${bg};color:${fg};font-size:${Math.round(size * .45)}px">${inner}</div>`});
}
const sz = s => PHONE.matches ? Math.round(s * .85) : s;
// hover card: type, name, rank in France, figure at 100 m
function tip(c, name, com, rank, kwv, extra) {
  return `<div class="tk"><i style="background:${c.color}"></i>${esc(c[lang])}</div>${esc(name)}<small>${esc(com)}</small>
    <div class="tr"><b class="m${rank <= 3 ? rank : 0}">${ord(rank, c.g)}</b>${T.ofFrance} · ${kw(kwv)}${extra || ''}</div>`;
}

function drawTop() {
  topLayer.clearLayers();
  const one = CAT[S.tab] ? S.tab : null, list = [];
  for (const c of CATS) if (!one || c.id === one) TOP[c.id].items.forEach((it, i) => list.push([c, it, i]));
  list.sort((a, b) => b[2] - a[2]);
  for (const [c, it, i] of list) {
    const champ = S.tab === 'cup';
    if (champ && i > 0) continue;
    const size = sz(one ? (i === 0 ? 34 : i < 3 ? 30 : 24) : (i === 0 ? 30 : 20));
    const m = L.marker([it.lat, it.lon], {icon: mk(c, {rank: it.rank, size, mode: one ? 'rank' : 'icon'}), zIndexOffset: (CFG.k - i) * 10, riseOnHover: true,
      title: '', keyboard: true, alt: plain(`${it.name} — ${c[lang]}`)});
    m.bindTooltip(tip(c, it.name, `${it.com} (${it.dep})`, it.rank, it.v[CFG.r_rank][0]), {className: 'tip', direction: 'top', offset: [0, -size / 2 - 2], opacity: 1});
    m.on('click', () => go({view: 'detail', cat: c.id, id: it.id, dep: it.dep, scope: 'fr', from: 'list'}));
    m.addTo(topLayer);
  }
}

// ---------------------------------------------------------------- data
async function getJSON(p) { const r = await fetch(p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); }
const loadCommunes = () => COMMUNES ??= getJSON('data/communes.json').then(a => a.map(([c, n]) => ({c, n, k: norm(n)})));
const loadDep = d => DEP[d] ??= getJSON(`data/dep/${d}.json`);
const loadLB = a => LBF[a] ??= getJSON(`data/lb/${a}.json`);
const depOf = code => code.slice(0, 2);
const regName = r => CFG.regions[r] ? CFG.regions[r][0] : r;
const depName = d => CFG.deps[d] ? CFG.deps[d][0] : d;

// ---------------------------------------------------------------- sheet
const V = document.getElementById('view'), body = document.getElementById('body');

document.getElementById('toggleLbl').textContent = T.explore;
function setOpen(on) {
  sheet.classList.toggle('open', on);
  head.setAttribute('aria-expanded', on);
}
head.addEventListener('click', () => { setOpen(!sheet.classList.contains('open')); sheet.classList.remove('tall'); });
let ty = null;
head.addEventListener('touchstart', e => ty = e.touches[0].clientY, {passive: true});
head.addEventListener('touchend', e => {
  if (ty == null) return; const dy = e.changedTouches[0].clientY - ty; ty = null;
  if (dy < -40 && sheet.classList.contains('open') && sheet.classList.contains('list')) { sheet.classList.add('tall'); e.preventDefault(); }
  else if (dy > 40 && sheet.classList.contains('tall')) { sheet.classList.remove('tall'); e.preventDefault(); }
});
function setHead(eyebrow, title) {
  headText.innerHTML = `<span class="eyebrow"><i></i>${eyebrow}</span><h1>${title}</h1>`;
}

function controls() {
  const b = (id, label, c) => `<button type="button" role="tab" class="chip${id === 'cup' ? ' cup' : ''}" data-tab="${id}" aria-selected="${S.tab === id}">${c ? dot(c, 18) : svg('cup')}${esc(label)}</button>`;
  return `<div class="search">
    ${svg('search')}
    <input id="q" type="search" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="results" autocomplete="off" spellcheck="false" placeholder="${T.search}" aria-label="${T.search}">
    <ul class="results" id="results" role="listbox" hidden></ul>
  </div>
  <div class="chips" role="tablist" aria-label="Catégories">${b('cup', T.cup)}${CATS.map(c => b(c.id, c[lang], c)).join('')}</div>`;
}

function notes() {
  const rows = CATS.map(c => { const e = c.excluded;
    return `<tr><th>${esc(c[lang])}</th><td class="n">${NF.format(c.raw)}</td><td class="n">${NF.format(c.n)}</td><td class="n">${NF.format(e.imprecise_location + (e.no_name || 0))}</td><td class="n">${NF.format(e.duplicates_merged)}</td></tr>`; }).join('');
  const s = CFG.sources;
  const about = EN ? `<details class="about"><summary>Method and sources</summary>
    <p>For each public building, the capacity (kWp) and number of the installations detected by OpenPVMapper whose centre lies within ${CFG.r_rank} m are summed (distances in metres, Lambert-93). Buildings are ranked by capacity, then by number of installations, in France, in their region and in their département. When a detection has no capacity, it is estimated from its surface (${CFG.m2_per_kwp} m² per kWp). Large buildings and ground-mounted plants next door weigh heavily: the ranking measures what was detected <i>around</i> the building, not on its roof.</p>
    <p>Buildings whose location is imprecise (Insee quality other than “good”, i.e. possibly more than 100 m off) are left out, as are overseas departments, which OpenPVMapper does not cover. Records closer than ${CFG.dedup_m} m in the same category, or with the same name in the same commune, are merged.</p>
    <table><tr><th></th><th>source</th><th>ranked</th><th>imprecise</th><th>merged</th></tr>${rows}</table>
    <p>Sources: ${esc(s.bpe)} (Licence Ouverte); ${esc(s.pv)} — Gabriel Kasmi, CC BY 4.0; fire stations: ${esc(s.osm)}, ODbL. Base map and aerial photo © IGN. Data built on ${esc(CFG.built)}.</p>
    <p>No tracking, no cookies, nothing about visitors is recorded.</p></details>`
  : `<details class="about"><summary>Méthode et sources</summary>
    <p>Pour chaque équipement, on additionne la puissance (kWc) et on compte les installations détectées par OpenPVMapper dont le centre est à moins de ${CFG.r_rank} m (distances en mètres, Lambert-93). Le classement se fait sur la puissance, puis sur le nombre d’installations, en France, dans la région et dans le département. Quand une détection n’a pas de puissance, elle est estimée à partir de sa surface (${CFG.m2_per_kwp} m² par kWc). Les grands bâtiments et les centrales au sol voisines pèsent lourd : le classement mesure ce qui a été détecté <i>autour</i> de l’équipement, pas sur son toit.</p>
    <p>Les équipements dont la localisation est imprécise (qualité Insee autre que « bonne », soit une erreur possible de plus de 100 m) sont écartés, ainsi que l’outre-mer, que OpenPVMapper ne couvre pas. Les fiches d’une même catégorie à moins de ${CFG.dedup_m} m l’une de l’autre, ou de même nom dans la même commune, sont fusionnées.</p>
    <table><tr><th></th><th>source</th><th>classés</th><th>imprécis</th><th>fusionnés</th></tr>${rows}</table>
    <p>Sources : ${esc(s.bpe)} (Licence Ouverte) ; ${esc(s.pv)} — Gabriel Kasmi, CC BY 4.0 ; casernes de pompiers : ${esc(s.osm)}, ODbL. Fond de carte et photo aérienne © IGN. Données produites le ${esc(CFG.built)}.</p>
    <p>Aucun suivi, aucun cookie, aucune donnée de visiteur enregistrée.</p></details>`;
  return `<div class="notes">${T.mentions.map(f => `<p>${f(CFG.r_rank)}</p>`).join('')}</div>${about}`;
}

// a ranking row; o: {c, id, dep, com, name, sub, rank, kw, n, me, showCat}
function row(o) {
  const lead = o.showCat ? `<span class="rk">${dot(o.c, 30)}</span>` : `<span class="rk m${o.rank <= 3 ? o.rank : 0}">${ord(o.rank, o.c.g)}</span>`;

    <span class="val"><b>${kw(o.kw)}</b><small>${T.inst(o.n)}</small></span></button></li>`;
}
const topRow = (c, it, extra) => ({c, id: it.id, dep: it.dep, com: it.com, name: it.name, sub: `${it.com} (${it.dep})`, rank: it.rank, kw: it.v[CFG.r_rank][0], n: it.v[CFG.r_rank][1], ...extra});

function podium(c, items) {
  const col = (it, p) => it ? `<button type="button" class="p${p}" data-cat="${c.id}" data-id="${it.id}" data-dep="${it.dep}" data-com="${esc(it.com)}" aria-label="${plain(ord(p, c.g))} : ${esc(it.name)}">
      <span class="nm">${esc(it.name)}</span><span class="cm">${esc(it.com)}</span><span class="kw">${kw(it.v[CFG.r_rank][0])}</span><span class="blk">${p}</span></button>` : '<span></span>';
  return `<div class="pod">${col(items[1], 2)}${col(items[0], 1)}${col(items[2], 3)}</div><div class="pod-base"></div>`;
}

function viewList() {

  } else if (c) {

  }

async function viewCommune() {

  setHead(T.commune, `${esc(name)} <small style="font-weight:400;color:var(--soft);font-size:.8em">(${esc(depOf(S.insee))})</small>`);
  sheet.classList.add('list');
  V.innerHTML = `<button type="button" class="back" data-act="home">${svg('back')}${T.back}</button>
    <div id="cbody"><p class="loading">${T.loading}</p></div>` + notes();
  let rows;
  try { rows = (await loadDep(depOf(S.insee))).filter(r => r[2] === S.insee); } catch (e) { document.getElementById('cbody').innerHTML = `<p class="loading">${T.error}</p>`; return; }
  const box = document.getElementById('cbody'); if (!box) return;
  if (!rows.length) { box.innerHTML = `<p class="loading">${T.noEquip}</p>`; return; }
  const li = (c, r) => `<li><button type="button" data-cat="${c.id}" data-id="${r[9]}" data-dep="${depOf(r[12])}" data-com="${esc(name)}">
      <span class="nmc"><b class="n">${esc(r[1])}</b><small>${T.rankOf(r[3], c.n, c.g)}${r[4] & 1 ? ' ' + T.tie : ''}</small></span>
      <span class="val"><b>${kw(r[5])}</b><small>${T.inst(r[6])}</small></span></button></li>`;
  const groups = CATS.map((c, i) => [c, rows.filter(r => r[0] === i).sort((a, b) => a[3] - b[3])]).filter(g => g[1].length);
  box.innerHTML = `<p class="d-com" style="margin-top:6px">${T.communeHead(rows.length)} · ${T.within(CFG.r_rank)}</p>` + groups.map(([c, rs]) => `<section class="c-group"><h3>${dot(c, 20)}${esc(c[lang])}</h3>
    <ul class="board">${rs.slice(0, 10).map(r => li(c, r)).join('')}</ul>
    ${rs.length > 10 ? `<button type="button" class="more-btn" data-more="${c.id}">+ ${rs.length - 10}</button>` : ''}</section>`).join('');
  box.querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
    const c = CAT[b.dataset.more], i = CATS.indexOf(c);
    b.previousElementSibling.innerHTML = rows.filter(r => r[0] === i).sort((a, b) => a[3] - b[3]).map(r => li(c, r)).join('');
    b.remove();
  });
  comLayer.clearLayers(); topLayer.clearLayers();
  const pts = [];
  for (const r of rows) {
    const c = CATS[r[0]], size = sz(22);
    const m = L.marker([r[7], r[8]], {icon: mk(c, {size, mode: 'icon'}), alt: plain(`${r[1]} — ${c[lang]}`)});
    m.bindTooltip(tip(c, r[1], name, r[3], r[5]), {className: 'tip', direction: 'top', offset: [0, -13], opacity: 1});
    m.on('click', () => { HINT[r[9]] = name; go({view: 'detail', cat: c.id, id: r[9], dep: depOf(r[12]), scope: 'fr', from: 'commune'}); });
    m.addTo(comLayer); pts.push([r[7], r[8]]);
  }
  if (pts.length) fit(L.latLngBounds(pts).pad(.1), 16);
}

async function findItem(cat, id, dep) {
  const c = CAT[cat]; if (!c) return null;
  const t = TOP[cat].items.find(x => x.id === id);
  if (t) return {c, it: t, full: true};
  if (!dep || !CFG.deps[dep]) return null;
  const ci = CATS.indexOf(c);
  const r = (await loadDep(dep)).find(r => r[9] === id && r[0] === ci);
  if (!r) return null;
  let com = HINT[id];
  if (!com) { const x = (await loadCommunes()).find(x => x.c === r[2]); com = x ? x.n : r[2]; }
  return {c, full: false, it: {id, name: r[1], rank: r[3], tb: r[4], tie: !!(r[4] & 1), rank_reg: r[10], rank_dep: r[11], lat: r[7], lon: r[8],
    com, dep, reg: CFG.deps[dep][1], insee: r[12], v: {[CFG.r_rank]: [r[5], r[6]]}, also: [], sub: ''}};
}

let CUR = null;
async function viewDetail() {
  V.innerHTML = `<p class="loading">${T.loading}</p>`;
  let f;
  try { f = await findItem(S.cat, S.id, S.dep); } catch (e) { console.error(e); f = null; }
  if (!f) { go({view: 'list', id: null, cat: null}, true); return; }
  CUR = f;
  const {c, it, full} = f;
  const r = full ? (S.r || CFG.r_rank) : CFG.r_rank;
  document.title = `${it.name} — ${plain(c['title_' + lang])}`;
  setHead(`${dot(c, 14)}${esc(c[lang])}`, esc(it.name));
  headText.querySelector('.eyebrow i').remove();
  sheet.classList.add('list');
  const backLbl = S.from === 'commune' && S.insee ? T.backCommune : T.back;
  const scopes = [['fr', T.france], ['reg', regName(it.reg)], ['dep', depName(it.dep)]];
  V.innerHTML = `<button type="button" class="back" data-act="up">${svg('back')}${backLbl}</button>
    <p class="d-com">${esc(it.com)} (${esc(it.dep)})${it.sub ? ' · ' + esc(it.sub) : ''}</p>
    ${it.also && it.also.length ? `<p class="d-also">${T.sameSite} ${it.also.map(esc).join(' · ')}</p>` : ''}
    <div class="seg" role="radiogroup" aria-label="${T.scopeLbl}">${scopes.map(([k, l]) => `<button type="button" role="radio" data-s="${k}" aria-checked="${S.scope === k}" title="${esc(l)}">${esc(l)}</button>`).join('')}</div>
    <div id="scoped"></div>
    <div class="sect" style="margin-top:20px">${T.around}</div>
    <div class="seg" style="margin-top:0" role="radiogroup" aria-label="${T.around}">${CFG.radii.map(x => `<button type="button" role="radio" data-r="${x}" aria-checked="${x === r}" ${!full && x !== CFG.r_rank ? 'disabled' : ''}>${x} m</button>`).join('')}</div>
    <div class="figs"><div class="sun"><b id="fkw"></b><span id="fkwl"></span></div><div><b id="fn"></b><span id="fnl"></span></div></div>
    <p class="rnote" id="rnote"></p>
    ${full ? `<div class="sect">${T.biggest}<small id="icount"></small></div><ul class="inst" id="inst"></ul>` : `<p class="warn">${T.topOnly(CFG.k)}</p>`}
    <p class="warn">${T.mentions[0](CFG.r_rank)}</p>` + notes();
  V.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { if (b.disabled) return; S.r = +b.dataset.r; setUrl(true); paintRadius(+b.dataset.r); });
  V.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { S.scope = b.dataset.s; setUrl(true); V.querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-checked', x === b)); paintScope(); });
  drawDetail();
  paintScope();
  paintRadius(r);
}

async function paintScope() {
  const {c, it} = CUR, box = document.getElementById('scoped'); if (!box) return;
  const ci = CATS.indexOf(c), sc = S.scope;
  const rank = sc === 'fr' ? it.rank : sc === 'reg' ? it.rank_reg : it.rank_dep;
  const tie = it.tb & (sc === 'fr' ? 1 : sc === 'reg' ? 2 : 4);
  const total = sc === 'fr' ? c.n : sc === 'reg' ? CFG.regions[it.reg][1][ci] : CFG.deps[it.dep][2][ci];
  const area = sc === 'fr' ? T.france : sc === 'reg' ? regName(it.reg) : `${depName(it.dep)} (${it.dep})`;
  const digits = String(rank).length;
  box.innerHTML = `<div class="big"><div class="medal m${rank <= 3 ? rank : 0}${digits >= 5 ? ' xlong' : digits >= 3 ? ' long' : ''}">${ord(rank, c.g)}</div>
    <p><span class="area">${esc(area)}</span>${T.of(total, c[lang + '_pl'])}${tie ? ` · ${T.tie}` : ''}<br>${T.within(CFG.r_rank)}</p></div><ul class="board" id="lb" style="margin-top:12px"><li class="gap">${T.loading}</li></ul>`;
  let rows;
  if (sc === 'fr') rows = TOP[c.id].items.slice(0, 10).map(x => topRow(c, x));
  else {
    const lb = await loadLB((sc === 'reg' ? 'r' + it.reg : 'd' + it.dep));
    if (S.scope !== sc || CUR.it !== it) return;
    rows = lb[ci].map(x => ({c, name: x[0], com: x[1], dep: x[2], sub: `${x[1]} (${x[2]})`, rank: x[3], kw: x[5], n: x[6], id: x[7]}));
  }
  rows.forEach(x => x.me = x.id === it.id);
  let html = rows.map(row).join('');
  if (!rows.some(x => x.me)) html += `<li class="gap">⋯</li>` + row({c, id: it.id, dep: it.dep, com: it.com, name: it.name, sub: `${it.com} (${it.dep})`, rank, kw: it.v[CFG.r_rank][0], n: it.v[CFG.r_rank][1], me: true});
  const ul = document.getElementById('lb'); if (ul) ul.innerHTML = html;
}

let detCircle = null, detDots = [];
function drawDetail() {
  const {c, it, full} = CUR;
  detLayer.clearLayers(); comLayer.clearLayers(); topLayer.clearLayers(); detDots = [];
  bm.hidden = false;
  detCircle = L.circle([it.lat, it.lon], {radius: CFG.r_rank, color: '#c4452d', weight: 2.5, dashArray: '7 6', fill: true, fillColor: '#c4452d', fillOpacity: .05, interactive: false}).addTo(detLayer);
  if (full) {
    for (const p of [...it.pv].sort((a, b) => b[2] - a[2])) {
      const m = L.circleMarker([p[0], p[1]], {radius: Math.min(22, 3.5 + 1.5 * Math.sqrt(p[2])), className: 'pvm', weight: 1.5, fillOpacity: .88});
      m.bindTooltip(`${kw(p[2])}<small>${NF.format(p[3])} m² · ${T.at(p[4])}</small>`, {className: 'tip', direction: 'top', opacity: 1});
      m._p = p; detDots.push(m);
    }
  }
  L.marker([it.lat, it.lon], {icon: mk(c, {size: 34, mode: 'icon'}), interactive: false, zIndexOffset: 1000}).addTo(detLayer);
}

function paintRadius(r) {
  const {it, full} = CUR;
  const v = full ? it.v[r] : it.v[CFG.r_rank];
  V.querySelectorAll('[data-r]').forEach(b => b.setAttribute('aria-checked', +b.dataset.r === r));
  document.getElementById('fkw').textContent = kw(v[0]);
  document.getElementById('fkwl').textContent = T.kwpLbl(r);
  document.getElementById('fn').textContent = NF.format(v[1]);
  document.getElementById('fnl').textContent = T.nLbl(r);
  document.getElementById('rnote').textContent = r !== CFG.r_rank ? T.rankedAt(CFG.r_rank) : '';
  detCircle.setRadius(r);
  detDots.forEach(m => { if (m._p[4] <= r) m.addTo(detLayer); else detLayer.removeLayer(m); });
  if (full) {
    const ul = document.getElementById('inst');
    const list = it.pv.filter(p => p[4] <= r).sort((a, b) => b[2] - a[2]);
    document.getElementById('icount').textContent = list.length > 8 ? (EN ? `8 of ${NF.format(list.length)}` : `8 sur ${NF.format(list.length)}`) : '';
    ul.innerHTML = list.length ? list.slice(0, 8).map(p => `<li data-i="${it.pv.indexOf(p)}"><span><b>${kw(p[2])}</b> <small>· ${NF.format(p[3])} m²</small></span><small>${T.at(p[4])}</small></li>`).join('')
      : `<li><small>${T.none(r)}</small></li>`;
    ul.querySelectorAll('li[data-i]').forEach(li => {
      const m = detDots.find(d => d._p === it.pv[+li.dataset.i]);
      li.onmouseenter = () => { li.classList.add('hl'); m && m.setStyle({weight: 4, color: '#1a2238'}); };
      li.onmouseleave = () => { li.classList.remove('hl'); m && m.setStyle({weight: 1.5, color: null}); };
    });
  }
  fit(detCircle.getBounds(), 19, true);
}

// ---------------------------------------------------------------- search
function bindSearch() {
  const q = document.getElementById('q'), ul = document.getElementById('results');
  let items = [], sel = -1;
  const close = () => { ul.hidden = true; q.setAttribute('aria-expanded', 'false'); q.removeAttribute('aria-activedescendant'); sel = -1; };
  const pick = c => { close(); q.value = ''; go({view: 'commune', insee: c.c, id: null, cat: null}); };
  q.addEventListener('focus', () => loadCommunes(), {once: true});
  q.addEventListener('input', async () => {
    const k = norm(q.value);
    if (k.length < 2) { close(); return; }
    const all = await loadCommunes();
    if (norm(q.value) !== k) return;
    const pre = [], inn = [];
    for (const c of all) { if (c.k.startsWith(k)) pre.push(c); else if (inn.length < 8 && c.k.includes(k)) inn.push(c); }
    pre.sort((a, b) => a.k.length - b.k.length);
    items = pre.concat(inn).slice(0, 8); sel = items.length ? 0 : -1;
    ul.innerHTML = items.length ? items.map((c, i) => `<li role="option" id="o${i}" aria-selected="${i === sel}" data-i="${i}">${esc(c.n)}<small>${esc(depOf(c.c))}</small></li>`).join('')
      : `<li class="empty">${T.noResult}</li>`;
    ul.hidden = false; q.setAttribute('aria-expanded', 'true');
  });
  q.addEventListener('keydown', e => {
    if (ul.hidden || !items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      ul.querySelectorAll('li').forEach((li, i) => li.setAttribute('aria-selected', i === sel)); q.setAttribute('aria-activedescendant', 'o' + sel);
    } else if (e.key === 'Enter') { e.preventDefault(); if (sel >= 0) pick(items[sel]); }
    else if (e.key === 'Escape') close();
  });
  ul.addEventListener('mousedown', e => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(items[+li.dataset.i]); } });
  q.addEventListener('blur', () => setTimeout(close, 150));
}

// ---------------------------------------------------------------- routing
function setUrl(replace) {
  const p = new URLSearchParams();
  if (EN) p.set('lang', 'en');
  if (S.view === 'list' && S.tab) p.set('cat', S.tab);
  if (S.view === 'commune') p.set('c', S.insee);
  if (S.view === 'detail') {
    p.set('cat', S.cat); p.set('id', S.id); if (S.dep) p.set('d', S.dep);
    if (S.scope !== 'fr') p.set('s', S.scope); if (S.r && S.r !== CFG.r_rank) p.set('r', S.r);
    if (S.from === 'commune' && S.insee) p.set('c', S.insee);
  }
  history[replace ? 'replaceState' : 'pushState'](null, '', location.pathname + (p.toString() ? '?' + p : ''));
}
function readUrl() {
  const p = new URLSearchParams(location.search);
  const cat = p.get('cat'), id = p.get('id'), c = p.get('c'), d = p.get('d');
  S.r = CFG.radii.includes(+p.get('r')) ? +p.get('r') : null;
  S.scope = ['reg', 'dep'].includes(p.get('s')) ? p.get('s') : 'fr';
  if (id && CAT[cat]) Object.assign(S, {view: 'detail', cat, id, dep: d, insee: c, from: c ? 'commune' : 'list', tab: S.tab || cat});
  else if (c && /^[0-9AB]{5}$/.test(c)) Object.assign(S, {view: 'commune', insee: c, id: null});
  else Object.assign(S, {view: 'list', tab: CAT[cat] || cat === 'cup' ? cat : '', id: null, insee: null});
}
function go(o, replace) {
  Object.assign(S, o);
  if (S.view !== 'detail') S.r = null;
  if (S.view === 'detail' && S.from !== 'commune') S.insee = null;
  setUrl(replace);
  render();
}
function render() {
  if (S.view !== 'detail') { detLayer.clearLayers(); bm.hidden = true; setBase(false); }
  if (S.view !== 'commune') comLayer.clearLayers();
  sheet.classList.remove('tall');
  if (S.view !== 'list' || S.tab) setOpen(true);
  if (S.view === 'list') { drawTop(); viewList(); fit(FR); }
  else if (S.view === 'commune') viewCommune();
  else viewDetail();
  body.scrollTop = 0;
}
window.addEventListener('popstate', () => { readUrl(); render(); });

V.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]');
  if (t) { const id = t.dataset.tab; go({view: 'list', tab: S.tab === id ? '' : id, id: null, cat: null, insee: null}); return; }
  const a = e.target.closest('[data-act]');
  if (a) {
    if (a.dataset.act === 'up' && S.from === 'commune' && S.insee) go({view: 'commune', id: null, cat: null, from: null});
    else go({view: 'list', id: null, cat: null, insee: null, from: null, tab: S.view === 'detail' ? (S.tab || S.cat) : S.tab});
    return;
  }
  const b = e.target.closest('button[data-id]');
  if (b) {
    if (b.dataset.com) HINT[b.dataset.id] = b.dataset.com;
    const keepScope = S.view === 'detail' ? S.scope : 'fr';
    go({view: 'detail', cat: b.dataset.cat, id: b.dataset.id, dep: b.dataset.dep, scope: keepScope, from: S.view === 'commune' ? 'commune' : (S.view === 'detail' ? S.from : 'list')});
  }
});
V.addEventListener('keydown', e => {
  const t = e.target.closest('[role="tab"]'); if (!t || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
  const tabs = [...V.querySelectorAll('[role="tab"]')], i = tabs.indexOf(t);
  const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
  n.click(); requestAnimationFrame(() => { const x = V.querySelector(`[data-tab="${n.dataset.tab}"]`); x && x.focus(); });
});

// ---------------------------------------------------------------- boot
(async () => {
  map.fitBounds(FR, {paddingTopLeft: [24, 70], paddingBottomRight: [24, 110], animate: false});
  try {
    CFG = await getJSON('data/config.json');
    CATS = CFG.categories; CATS.forEach(c => CAT[c.id] = c);
    await Promise.all(CATS.map(async c => TOP[c.id] = await getJSON(`data/top_${c.id}.json`)));
  } catch (e) { setHead(T.eyebrow, T.error); console.error(e); return; }
  readUrl();
  setUrl(true);
  render();
})();
</script>
