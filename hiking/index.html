<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plein soleil sur mon chemin</title>
<meta name="description" content="Itinéraires de randonnée OpenStreetMap × installations photovoltaïques d'OpenPVMapper, dans un couloir de 50 m.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--ink:#1d2733;--ink2:#4a5866;--muted:#738190;--line:#d9dfe5;--bg:#eef1f4;--acc:#e8590c;--acc-bg:#fff2e8;--sel:#0b3d63;--route:#2a5d8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
#map{position:absolute;inset:0;background:#dfe6dc}
.glass{background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.65);border-radius:16px;box-shadow:0 6px 28px rgba(15,30,50,.24)}
#side{position:absolute;z-index:1000;left:16px;top:16px;bottom:16px;width:404px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#side>*{pointer-events:auto}
#hero{position:relative;z-index:5;flex:none}
.brand h1{font-size:19px;line-height:1.2;margin:0 0 10px;letter-spacing:-.015em;text-shadow:0 0 14px #fff,0 0 4px #fff}
.brand h1 i{font-style:normal;color:var(--acc)}
.brand p{margin:0 0 10px;color:var(--ink2);font-size:13px}
#hero.compact .brand{display:none}
.rmback{display:none;position:absolute;z-index:1100;left:16px;top:16px;height:40px;align-items:center;padding:0 12px;border-radius:12px!important;box-shadow:0 4px 16px rgba(15,30,50,.2);font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.rmback:hover{color:var(--acc)}
body.home .rmback{display:flex}
@media (max-width:820px){body.home .rmback{left:8px;top:calc(8px + env(safe-area-inset-top))}}
.srow{display:flex;gap:6px;align-items:center;position:relative}
.sbox{flex:1;min-width:0}
.ibox{position:relative}
input[type=search]::-webkit-search-cancel-button{display:none}
.sbox input{box-shadow:0 6px 22px rgba(15,30,50,.25);width:100%;padding:10px 30px 10px 32px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px;outline:0}
.sbox input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(232,89,12,.18)}
.sbox .mag{position:absolute;left:10px;top:50%;transform:translateY(-52%);color:var(--muted);line-height:0;pointer-events:none}
#qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 7px}
.tb svg{display:block;margin:auto}
.tb{display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 6px 22px rgba(15,30,50,.25);flex:none;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:17px;line-height:1;padding:0}
.tb:hover,.tb[aria-expanded=true]{border-color:var(--acc);background:var(--acc-bg)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-height:min(60vh,420px);overflow:auto;z-index:1600;padding:4px}
.sug[hidden],.pop[hidden],#panel[hidden],[hidden]{display:none!important}
.sug .lbl{margin:6px 8px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sug button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.sug button:hover,.sug button.act{background:var(--acc-bg)}
.sug .s1{font-weight:600;flex:1;min-width:0}.sug small{color:var(--muted);flex:none;max-width:45%;text-align:right;line-height:1.25}
.sug .none{padding:8px;color:var(--muted)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.9);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--acc);background:var(--acc-bg)}
.chip.fun{border-style:dashed}
.pop{position:absolute;right:10px;top:100%;margin-top:6px;width:min(330px,calc(100% - 20px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.24);padding:12px;z-index:1700;max-height:70vh;overflow:auto}
.pop .lbl{margin:10px 0 5px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.pop .lbl:first-child{margin-top:0}
.pop label{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink2);cursor:pointer;padding:4px 10px;font-size:12.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.legend{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);flex-wrap:wrap;margin-top:6px}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.recs button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 9px;cursor:pointer}
.recs button:hover{border-color:var(--acc);background:var(--acc-bg)}
.recs b{display:block;font-size:11.5px;color:var(--ink2)}
.recs span{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.recs small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.foot{font-size:11.5px;color:var(--muted);line-height:1.5}.foot a{color:inherit}
.lang{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px;border-radius:12px!important;box-shadow:0 4px 16px rgba(15,30,50,.2)}
.lang a{color:var(--ink2);text-decoration:none;padding:6px 8px;border-radius:8px;font-size:13px;font-weight:600}
.lang a[aria-current=true]{background:var(--ink);color:#fff}
/* panel */
#panel{flex:0 1 auto;min-height:0;display:flex;flex-direction:column;background:rgba(255,255,255,.94)}
.phead{display:flex;align-items:center;gap:8px;padding:8px 10px 0;flex:none}
.phead .grab{display:none}
.pback{border:0;background:none;color:var(--sel);font-weight:600;cursor:pointer;padding:4px 6px;border-radius:8px}
.pback:hover{background:var(--acc-bg)}
.phead span{flex:1}
.pclose{margin-left:auto;display:flex;align-items:center;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.pclose:hover{background:#eef1f4}
.pbody{overflow:auto;min-height:0;padding:4px 14px 14px;overscroll-behavior:contain}
.pbody h2{margin:2px 0 0;font-size:18px;line-height:1.25;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.note{font-size:11.5px;color:var(--muted);margin:5px 0}
.hint{color:var(--muted);margin:6px 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.kpi{background:var(--bg);border-radius:10px;padding:6px 7px;min-width:0}
.kpi b{display:block;font-size:16px;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--ink2)}
.pvban{border:1px solid #f6c9a8;background:linear-gradient(180deg,#fff7ef,#fff);border-radius:14px;padding:10px 12px;margin:8px 0}
.counter{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
.counter b{color:var(--acc);font-size:24px;letter-spacing:-.02em}
.play{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{font-weight:700;padding:9px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 2px 0 #b8430a}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn2{padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.btn2:hover{border-color:var(--acc);background:var(--acc-bg)}
.opt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
#prof{width:100%;height:64px;display:block;margin-top:8px}
#elev{width:100%;height:66px;display:block;margin:4px 0 0}
table.mem{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
table.mem th{font-weight:600;color:var(--ink2);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}
table.mem th:first-child,table.mem td:first-child{text-align:left}
table.mem td{padding:6px 4px;border-bottom:1px solid #eef1f4;text-align:right;font-variant-numeric:tabular-nums}
table.mem tr.m{cursor:pointer}table.mem tr.m:hover{background:var(--acc-bg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* lists */
.dual{position:relative;height:24px;margin-top:2px}
.dual .tr{position:absolute;left:0;right:0;top:10px;height:4px;border-radius:2px;background:var(--line)}
.dual .tr i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:2px}
.dual input{position:absolute;left:0;top:0;width:100%;height:24px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none;height:24px}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;margin-top:3px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dual input::-moz-range-thumb{pointer-events:auto;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--acc);cursor:pointer}
details.refine{border:1px solid var(--line);border-radius:12px;margin:10px 0 6px;background:#fff}
details.refine summary{cursor:pointer;padding:8px 11px;font-weight:600;font-size:13px;list-style:none}
details.refine summary::-webkit-details-marker{display:none}
details.refine summary::after{content:"▾";float:right;color:var(--muted)}
details.refine[open] summary::after{content:"▴"}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:2px 11px 11px}
.rgrid label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--ink2)}
.rgrid .wide{grid-column:1/-1}
.rgrid select{padding:5px 6px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;width:100%}
.rgrid .two{display:flex;gap:4px;align-items:center}
.rgrid input[type=range]{width:100%;accent-color:var(--acc)}
.lcount{font-size:12px;color:var(--ink2);margin:6px 0 6px}
.cards{display:flex;flex-direction:column;gap:6px}
.card{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--acc);background:var(--acc-bg);outline:0}
.card .cl{flex:1;min-width:0}
.card b{display:block;font-size:13.5px;line-height:1.3}
.card .cm{font-size:12px;color:var(--ink2)}
.card .cn{text-align:right;flex:none;line-height:1.1}
.card .cn em{display:block;font-style:normal;font-weight:800;font-size:19px;color:var(--acc);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .cn small{font-size:10.5px;color:var(--muted)}
.dot{background:var(--acc);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(11,61,99,.5)}
.leaflet-tooltip{font:12.5px/1.4 system-ui,sans-serif}
.leaflet-control-attribution{font-size:10px}

#veil{display:none;position:absolute;inset:0;z-index:900;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(244,246,249,.5)}
body.home #veil{display:block}
body.home #side{left:50%;right:auto;top:30%;bottom:auto;width:min(580px,calc(100% - 24px));transform:translateX(-50%)}
body.home .brand{text-align:center}
body.home .brand h1{font-size:26px;margin-bottom:12px}
#tools{align-items:flex-start;position:absolute;z-index:1100;right:16px;top:16px;display:flex;gap:8px}
#tools .tb{box-shadow:0 4px 16px rgba(15,30,50,.2)}
#tools .pop{right:0;left:auto;width:330px;max-width:calc(100vw - 32px)}
.pop.wide{left:10px;right:10px;width:auto}
#map.calm .leaflet-tile-pane{filter:saturate(.92) contrast(.9) brightness(1.04)}
@media (max-width:820px){
  .lang{height:auto;flex-direction:column;width:40px;padding:3px}
  .lang a{display:block;width:100%;padding:6px 0;text-align:center;border-radius:8px}
  #tools{right:8px;top:calc(76px + env(safe-area-inset-top));flex-direction:column}
  #tools .pop{right:44px;top:0;margin:0;width:min(330px,calc(100vw - 64px));max-height:calc(100vh - 140px)}
  body.home #tools{top:calc(8px + env(safe-area-inset-top))}
  body.home .brand h1{font-size:19px}
  #side{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));bottom:calc(8px + env(safe-area-inset-bottom));width:auto}
  #hero{padding:10px}
  .brand h1{font-size:16px}.brand p{font-size:12.5px;margin-bottom:8px}
  #panel{margin-top:auto;max-height:50vh}
  .phead .grab{display:block;flex:1;height:22px;border:0;background:none;cursor:pointer;position:relative}
  .phead .grab::after{content:"";position:absolute;left:50%;top:9px;width:42px;height:4px;margin-left:-21px;border-radius:2px;background:#c3ccd5}
  #panel.collapsed .pbody>*:not(.pvban){display:none}
  .phead span{display:none}
  .leaflet-control-zoom{display:none}
}
</style>
</head>

</div>
<div id="side">

        <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="sug" aria-label="Recherche">

      </div>
      <button class="tb" id="bIdea" aria-expanded="false" aria-controls="popIdea" title="Suggestions"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg></button>
      <button class="tb" id="bFun" aria-expanded="false" aria-controls="popFun" title="Curiosités"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3 21l3-10h12l3 10z"/><path d="M4.7 16h14.6M9.3 11L8 21M14.7 11L16 21M12 11v10"/><circle cx="12" cy="4.2" r="1.8"/><path d="M12 .6v.8M7.6 2.2l.6.6M16.4 2.2l-.6.6" /></svg></button>
      <div id="sug" class="sug" role="listbox" hidden></div>

  <section id="panel" class="glass" hidden></section>
</div>

  var h='<h2>'+esc(title(r))+'</h2><div class="sub">'+esc([r.ref&&r.name?r.ref:'',r.op,r.net?r.net.toUpperCase():'',r.merged>1?r.merged+' '+I.chained:''].filter(Boolean).join(' · '))+'</div>'+
   '<div class="kpis"><div class="kpi"><b>'+fmt(r.km,1)+'</b><span>'+I.km+'</span></div><div class="kpi"><b>'+(E?fmt(E.dp)+' m':(r.km>=8?'…':'—'))+'</b><span>'+I.dplus+'</span></div><div class="kpi"><b>'+fmt(ppk,1)+'</b><span>'+I.perkm+'</span></div><div class="kpi"><b>'+fmt(kwp,0)+'</b><span>'+I.kwp+'</span></div></div>';
  var rn=recCtx&&!recCtx.r.within_50m&&recCtx.r.nearest_route.id===r.id?recCtx:null;

  if(rn){var dm=rn.r.nearest_route.dist_m;h+='<div class="pvban"><div class="counter" style="font-size:14px">☀ '+esc(I.recPass.replace('{d}',dm>=1000?fmt(dm/1000,1)+' km':fmt(dm)+' m').replace('{ph}',I.recPh[rn.lab]))+'</div></div>'}
  else if(r.n===0){h+='<div class="pvban"><div class="counter"><b>0</b> '+I.pv+'</div><p class="hint" style="margin:4px 0 0">'+I.none+'</p></div>'}
  else{
    h+='<div class="pvban"><div class="counter" id="cnt"></div>'+
      '<svg id="prof" viewBox="0 0 300 64" preserveAspectRatio="none" role="img" aria-label="'+I.along+'"></svg>'+
      '<div class="play"><button class="btn" id="go">'+I.collect+'</button>'+spdSeg()+''+
      '<label class="opt"><input type="checkbox" id="follow" checked> '+I.follow+'</label></div></div>';
  }
  if(!E&&r.km>=8)h+='<div class="note" id="elevst">'+I.elevLoading+'</div>';
  if(E)h+='<svg id="elev" viewBox="0 0 300 70" preserveAspectRatio="none" role="img" aria-label="'+I.altRange+'"></svg><div class="note">'+I.altRange+' '+fmt(E.zmin)+'–'+fmt(E.zmax)+' m · '+I.dminus+' '+fmt(E.dm)+' m. '+I.elevNote+(E.live?' '+I.elevCoarse.replace('{n}',E.live):'')+'</div>';
  if(r.plink&&r.plink.indexOf(1)>=0)h+='<p class="note">'+I.linkNote+'</p>';
  h+='<div class="play"><button class="btn2" id="gpx">'+I.gpx+'</button><label class="opt"><input type="checkbox" id="gpxw" checked> '+I.gpxWpt+'</label><button class="btn2" id="lnk" style="margin-left:auto">'+I.link+'</button></div>'+
     '<div class="note" style="color:var(--ink2)">'+I.discShort+'</div>'+
     '<div class="note"><a href="https://www.openstreetmap.org/relation/'+r.id+'" target="_blank" rel="noopener">'+I.osmRel+'</a> · <a href="https://hiking.waymarkedtrails.org/#route?id='+r.id+'" target="_blank" rel="noopener">'+I.wmtLink+'</a></div>';
  setPanel(h,backTarget());
  $('gpx').addEventListener('click',exportGPX);$('lnk').addEventListener('click',copyLink);
  drawElev(r,-1);
  if(r.n>0&&!rn){
    drawProfile(r,-1);setCounter(r.n,kwp,true);
    bindSpd();
    $('go').addEventListener('click',function(){anim?stopAnim():startAnim(r)});
  }
}
function copyLink(){
  var b=$('lnk'),done=function(){b.textContent=I.linked;setTimeout(function(){b.textContent=I.link},1800)};
  try{navigator.clipboard.writeText(location.href).then(done,function(){prompt('',location.href)})}catch(e){prompt('',location.href)}
}
function drawProfile(r,at){
  var s=$('prof');if(!s)return;var N=60,b=new Array(N).fill(0);
  r.panels.forEach(function(p){b[Math.min(N-1,Math.floor(p[2]/r._tot*N))]+=1});
  var mx=Math.max.apply(null,b)||1,w=300/N,h='';
  b.forEach(function(v,i){var bh=v/mx*56;h+='<rect x="'+(i*w+.5)+'" y="'+(60-bh)+'" width="'+(w-1)+'" height="'+bh+'" fill="'+(at>=0&&(i+.5)/N*r._tot>at?'#e3d6cb':'#e8590c')+'"/>'});
  h+='<line x1="0" x2="300" y1="60.5" y2="60.5" stroke="#9aa5b1"/>';
  if(at>=0)h+='<line x1="'+(at/r._tot*300)+'" x2="'+(at/r._tot*300)+'" y1="2" y2="62" stroke="#0b3d63" stroke-width="2"/>';
  s.innerHTML=h;
}
function setCounter(n,k,done){var c=$('cnt');if(c)c.innerHTML='<b>'+fmt(n)+'</b> '+I.pv+(done?'':' '+I.collected)+' · <b style="font-size:15px">'+fmt(k,1)+'</b> '+I.kwp}

/* ---------- collection animation */
var mover=null;
var SPD=1,BASE=800;   /* m/s at x1: constant rate, so long trails take longer */
function spdSeg(){return '<span class="seg" id="dur" role="group" aria-label="'+I.speed+'">'+[1,2,4,8].map(function(v){return '<button data-s="'+v+'" aria-pressed="'+(v===SPD)+'">×'+v+'</button>'}).join('')+'</span>'}
function bindSpd(){$('dur').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){SPD=+b.dataset.s;$('dur').querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})})})}
function startAnim(r){
  var follow=$('follow').checked,n=0,k=0,idx=0,last=performance.now(),acc=0;
  if(MOBILE())$('panel').classList.add('collapsed');
  r._m.forEach(function(m){m.setStyle({fillColor:'#fff',fillOpacity:.6,color:'#9aa5b1'})});
  if(!mover)mover=L.marker([0,0],{icon:L.divIcon({className:'',html:'<div class="dot" style="width:16px;height:16px"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false,zIndexOffset:1000});
  mover.addTo(selLayer);$('go').textContent=I.stop;
  if(map.getZoom()<12&&follow){var p0=posAt(r,0);map.setView(p0,13,{animate:false})}
  function frame(now){
    var dt=Math.min(.1,(now-last)/1000);last=now;acc+=BASE*SPD*dt;var f=Math.min(1,acc/r._tot),ch=f*r._tot,pos=posAt(r,ch);
    mover.setLatLng(pos);
    while(idx<r.panels.length&&r.panels[idx][2]<=ch){var p=r.panels[idx];r._m[idx].setStyle({fillColor:'#e8590c',fillOpacity:.95,color:'#fff'});r._m[idx].bringToFront();n++;k+=p[3]||0;idx++}
    setCounter(n,k,false);drawProfile(r,ch);drawElev(r,ch);
    if(follow)map.setView(pos,map.getZoom(),{animate:false});
    if(f<1)anim=requestAnimationFrame(frame);else{finishAnim(r)}
  }
  anim=requestAnimationFrame(frame);
}
function finishAnim(r){
  anim=null;if(mover)selLayer.removeLayer(mover);
  r._m.forEach(function(m){m.setStyle({fillColor:'#e8590c',fillOpacity:.95,color:'#fff'})});
  var g=$('go');if(g)g.textContent=I.collect;
  $('panel').classList.remove('collapsed');
  drawProfile(r,-1);drawElev(r,-1);setCounter(r.n,r.kwp,true);
}
function stopAnim(){if(anim){cancelAnimationFrame(anim);if(cur)finishAnim(cur)}anim=null}

/* ---------- GPX */
function xml(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function exportGPX(){
  var r=cur;if(!r)return;var w=$('gpxw')&&$('gpxw').checked;
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="OpenPVMapper hiking" xmlns="http://www.topografix.com/GPX/1/1"><metadata><name>'+xml(title(r))+'</name><desc>'+xml(I.gpxNote+' '+I.disc)+'</desc></metadata>\n';
  if(w)r.panels.forEach(function(p){x+='<wpt lat="'+p[1]+'" lon="'+p[0]+'">'+(p[6]!=null?'<ele>'+p[6]+'</ele>':'')+'<name>PV'+(p[3]!=null?' '+p[3]+' kWp':'')+'</name><desc>'+xml((p[4]!=null?p[4]+' m² · ':'')+p[5]+' m '+I.tip.d+' · km '+(p[2]/1000).toFixed(1))+'</desc></wpt>\n'});
  x+='<trk><name>'+xml(title(r))+'</name>';
  var E=ELEV[r.id];
  r.parts.forEach(function(pt,pi){x+='<trkseg>'+pt.map(function(c,k){var ele=E&&r._cum?'<ele>'+Math.round(zAt(E,r._off[pi]+r._cum[pi][k],r._tot))+'</ele>':'';return '<trkpt lat="'+c[1]+'" lon="'+c[0]+'">'+ele+'</trkpt>'}).join('')+'</trkseg>'});
  x+='</trk></gpx>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'}));
  a.download=(title(r).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'route')+'.gpx';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}

var COLS=[],COLBY={},PAL=['#e8590c','#1c7ed6','#2f9e44','#ae3ec9','#f08c00','#0c8599','#c92a2a','#5f3dc4','#868e96'];

  var c=COLBY[id];if(!c)return;
  stopAnim();setView('col');curCol=id;cur=null;selLayer.clearLayers();recLayer.clearLayers();map.closePopup();setHash('#c-'+id);var all=[];
  c.members.forEach(function(m,i){m.geom.forEach(function(f){var l=[];for(var k=0;k<f.length;k+=2)l.push([f[k+1],f[k]]);all=all.concat(l);
    L.polyline(l,{color:'#fff',weight:7,opacity:.9,interactive:false}).addTo(selLayer);
    L.polyline(l,{color:PAL[i%PAL.length],weight:3.5,opacity:.95,interactive:false}).addTo(selLayer)})});
  var hasEl=c.members.some(function(m){return ELEV[m.id]}),dsum=collDp(c);

  setPanel('<h2>'+esc(c.name[LANG])+'</h2><div class="sub">'+c.members.length+' '+I.members+'</div><div class="kpis"><div class="kpi"><b>'+fmt(c.km)+'</b><span>'+I.km+'</span></div><div class="kpi"><b>'+(dsum!=null?fmt(dsum)+' m':'—')+'</b><span>'+I.dplus+'</span></div><div class="kpi"><b>'+fmt(c.km>0?c.n_union/c.km:0,1)+'</b><span>'+I.perkm+'</span></div><div class="kpi"><b>'+fmt(c.n_union)+'</b><span>'+I.pv+'</span></div></div>'+
    '<table class="mem"><tr><th>'+I.variant+'</th><th>'+I.km+'</th>'+(hasEl?'<th>D+</th>':'')+'<th>'+I.pv+'</th><th>'+I.excl+'</th></tr>'+rows+'</table><p class="note">'+I.exclHint+' '+I.unionN+'.</p>'+
    '<div class="play"><button class="btn2" id="lnk" style="margin-left:auto">'+I.link+'</button></div>',Lspec?{label:I.toList,fn:function(){selLayer.clearLayers();showList(Lspec,true)}}:{label:I.home,fn:goHome});
  $('lnk').addEventListener('click',copyLink);
  $('pbody').querySelectorAll('tr.m').forEach(function(tr){tr.addEventListener('click',function(){selectRoute(+tr.dataset.id,{col:id})})});

function renderRecords(recs){
  var box=$('recs'),first={};recs.forEach(function(r){if(r.rank===1)first[r.label]=r});
  ['north','south_mainland','east_mainland','west','south','east','highest','lowest'].forEach(function(lab){
    var r=first[lab];if(!r)return;
    var b=document.createElement('button');
    var sub=r.within_50m?I.onroute:(I.away+' ')+fmt(r.nearest_route.dist_m>=1000?r.nearest_route.dist_m/1000:r.nearest_route.dist_m,r.nearest_route.dist_m>=1000?1:0)+(r.nearest_route.dist_m>=1000?' km':' m')+' '+(I.of?I.of+' ':'')+I.nearest;
    var main=lab==='highest'||lab==='lowest'?fmt(r.z,lab==='lowest'?1:0)+' m':fmt(Math.abs(lab.indexOf('east')===0||lab==='west'?r.lon:r.lat),2)+'°';
    b.innerHTML='<b>'+esc(I.records[lab])+'</b><span>'+esc(main)+'</span><small>'+esc(I.dept+' '+r.dpt+' · '+sub)+'</small>';

function openRecord(lab,recs){
  var rs=recs.filter(function(r){return r.label===lab}).sort(function(a,b){return a.rank-b.rank}),r=rs[0];if(!r)return;
  selectRoute(r.nearest_route.id,{rec:{lab:lab,r:r}}).then(function(){
    recLayer.clearLayers();
    L.circleMarker([r.lat,r.lon],{radius:11,color:'#fff',weight:2.5,fillColor:'#c92a2a',fillOpacity:1}).bindTooltip(I.records[lab]+(r.kWp!=null?' · '+fmt(r.kWp,1)+' '+I.kwp:'')+' · '+I.dept+' '+r.dpt).addTo(recLayer);

/* ---------- elevation */
var ELEV={},ECH={};
function zAt(e,ch,tot){var z=e.z,x=Math.max(0,Math.min(1,ch/tot))*(z.length-1),i=Math.floor(x);return i>=z.length-1?z[z.length-1]:z[i]+(z[i+1]-z[i])*(x-i)}
function loadElev(r){
  if(ELEV[r.id])return Promise.resolve(false);
  var c=('00'+(r.id%128)).slice(-3);
  if(!ECH[c])ECH[c]=getJSON(DATA+'elevation/'+c+'.json').catch(function(){return {}});
  return ECH[c].then(function(d){var e=d[String(r.id)];if(e){ELEV[r.id]=e;return true}return false});
}
function liveElev(r){
  if(r.km<8||ELEV[r.id]||!r._tot)return;
  var key='pvhike-elev1-'+r.id;
  try{var c=localStorage.getItem(key);if(c){ELEV[r.id]=JSON.parse(c);if(cur===r&&!anim)renderPanel(r);return}}catch(e){}
  var tot=r._tot,S=Math.max(100,tot/900),n=Math.max(2,Math.round(tot/S)+1),pts=[],B=150,batches=[],out=new Array(n),next=0;
  for(var k=0;k<n;k++){var ch=k*tot/(n-1),p=posAt(r,ch);pts.push([p[1],p[0]])}
  for(var i=0;i<n;i+=B)batches.push(pts.slice(i,i+B));
  function one(bi){
    var b=batches[bi],u='https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json?lon='+b.map(function(p){return p[0].toFixed(5)}).join('|')+'&lat='+b.map(function(p){return p[1].toFixed(5)}).join('|')+'&resource=ign_rge_alti_wld&zonly=true&delimiter=|';
    return getJSON(u).catch(function(){return getJSON(u)}).then(function(d){d.elevations.forEach(function(v,j){out[bi*B+j]=(v<-10||v>5000)?NaN:v})});
  }
  function worker(){if(next>=batches.length)return Promise.resolve();var bi=next++;return one(bi).then(worker)}
  Promise.all([worker(),worker(),worker()]).then(function(){
    var z=out.slice(),good=[];z.forEach(function(v,i){if(!isNaN(v))good.push(i)});if(good.length<n*0.7)throw new Error('no data');
    for(var i2=0;i2<n;i2++)if(isNaN(z[i2])){var a=good.filter(function(g){return g<i2}).pop(),b=good.filter(function(g){return g>i2})[0];z[i2]=a==null?z[b]:b==null?z[a]:z[a]+(z[b]-z[a])*(i2-a)/(b-a)}
    var m=z.map(function(v,i){var a=z[Math.max(0,i-1)],c=z[Math.min(n-1,i+1)];return [a,v,c].sort(function(x,y){return x-y})[1]});
    if(S<=150)m=m.map(function(v,i){return (m[Math.max(0,i-1)]+v+m[Math.min(n-1,i+1)])/3});
    var ref=m[0],dp=0,dm=0;m.forEach(function(v){if(v-ref>=3){dp+=v-ref;ref=v}else if(ref-v>=3){dm+=ref-v;ref=v}});
    var N=Math.min(240,n),pr=[];for(var q=0;q<N;q++){var x=q/(N-1)*(n-1),f=Math.floor(x),g=Math.min(n-1,f+1);pr.push(Math.round(m[f]+(m[g]-m[f])*(x-f)))}
    var e={dp:Math.round(dp),dm:Math.round(dm),zmin:Math.round(Math.min.apply(null,m)),zmax:Math.round(Math.max.apply(null,m)),tot:Math.round(tot),z:pr,live:S>150?Math.round(S):0};
    ELEV[r.id]=e;try{localStorage.setItem(key,JSON.stringify(e))}catch(x){}
    if(cur===r&&!anim)renderPanel(r);
  }).catch(function(){var el=$('elevst');if(el)el.remove()});
}
function collDp(c){var s=0;for(var i=0;i<c.members.length;i++){var e=ELEV[c.members[i].id];if(!e)return null;s+=e.dp}return s}
function drawElev(r,at){
  var s=$('elev'),e=ELEV[r.id];if(!s||!e)return;
  var z=e.z,lo=e.zmin,rg=Math.max(1,e.zmax-lo),W=300,H=70,pd=5,N=z.length,pth='';
  function Y(v){return H-pd-(v-lo)/rg*(H-2*pd)}
  for(var i=0;i<N;i++)pth+=(i?'L':'M')+(i/(N-1)*W).toFixed(1)+' '+Y(z[i]).toFixed(1);
  var h='<path d="'+pth+'L'+W+' '+H+'L0 '+H+'Z" fill="#dbe7f1"/><path d="'+pth+'" fill="none" stroke="#4b6a88" stroke-width="1.4" vector-effect="non-scaling-stroke"/>';
  r.panels.forEach(function(p){var x=Math.min(W,p[2]/r._tot*W);h+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+(Y(zAt(e,p[2],r._tot))-5).toFixed(1)+'" y2="'+(Y(zAt(e,p[2],r._tot))).toFixed(1)+'" stroke="#e8590c" stroke-width="1.6" vector-effect="non-scaling-stroke"/>'});
  if(at>=0){var xa=at/r._tot*W;h+='<line x1="'+xa+'" x2="'+xa+'" y1="0" y2="'+H+'" stroke="#0b3d63" stroke-width="2" vector-effect="non-scaling-stroke"/>'}
  s.innerHTML=h;
}

function ensure(){if(!ready()){setPanel('<p class="hint">'+I.loading+'</p>',{label:I.home,fn:goHome});return false}return true}
function frOf(k){var v=(EX.f||{})[k];return v==null?1:v}
function items(){
  if(ITEMS)return ITEMS;ITEMS=[];var mem={};
  COLS.forEach(function(c){c.members.forEach(function(m){mem[m.id]=1});
    ITEMS.push({t:'c',id:c.id,label:c.name[LANG],km:c.km,n:c.n_union,parts:[].concat.apply([],c.members.map(function(m){return m.geom})),deps:(EX.c[c.id]||'').split(',').filter(Boolean),fr:frOf('c:'+c.id)})});
  OV.forEach(function(r){if(mem[r[0]])return;if(frOf(String(r[0]))<0.3)return;var nm=INAME[r[0]]||[];if(!nm[0]&&!nm[1])return;var lab=(nm[1]&&nm[0]&&nm[1]!==nm[0]?nm[1]+' · ':'')+(nm[0]||nm[1]);
    ITEMS.push({t:'r',id:r[0],label:lab,km:r[1],n:r[2],parts:r[4],deps:(EX.r[String(r[0])]||'').split(',').filter(Boolean),fr:frOf(String(r[0]))})});

function bb(it){if(it._b)return it._b;var a=1e9,b=1e9,c=-1e9,d=-1e9;it.parts.forEach(function(f){for(var i=0;i<f.length;i+=2){var x=f[i],y=f[i+1];if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>d)d=y}});return(it._b=[a,b,c,d])}
function distTo(parts,lon0,lat0){
  var kx=Math.cos(lat0*Math.PI/180)*111320,ky=110540,best=1e18;
  for(var p=0;p<parts.length;p++){var f=parts[p];
    if(f.length===2){var qx=(f[0]-lon0)*kx,qy=(f[1]-lat0)*ky,q=qx*qx+qy*qy;if(q<best)best=q;continue}
    for(var i=0;i<f.length-2;i+=2){
      var ax=(f[i]-lon0)*kx,ay=(f[i+1]-lat0)*ky,bx=(f[i+2]-lon0)*kx,by=(f[i+3]-lat0)*ky,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy,t=L2?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L2)):0,px=ax+t*dx,py=ay+t*dy,d=px*px+py*py;
      if(d<best)best=d}}

  if(q.length<2){defaultSug();return}
  var seq=++gSeq,trails=localTrails(q),areas=localAreas(q,raw);
  function paint(coms){renderSug([{h:I.gPlaces,items:coms.concat(areas)},{h:I.gTrails,items:trails}])}
  paint([]);
  gTimer=setTimeout(function(){geocode(raw).then(function(rs){
    if(seq!==gSeq)return;
    paint(rs.slice(0,4).map(function(g){return{label:g.label,sub:I.kCommune+(g.ctx?' · '+g.ctx:''),fn:function(){pickCity(g)}}}));
  }).catch(function(){})},220);
}
$('q').addEventListener('input',onQ);
$('q').addEventListener('focus',function(){closePops();if(!this.value.trim())defaultSug();else onQ()});
$('q').addEventListener('keydown',function(e){
  var bs=$('sug').querySelectorAll('button');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!bs.length)return;e.preventDefault();sugAct=(sugAct+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach(function(b,i){b.classList.toggle('act',i===sugAct)});bs[sugAct].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();choose(sugList[sugAct>=0?sugAct:0])}
});
$('qclear').addEventListener('click',function(){$('q').value='';$('qclear').hidden=true;$('q').focus()});

/* ---------- home, suggestions, curiosities */
var FAMOUS=['saint-jacques','gr70','tmb','gr20','gr10','gr34','francigena','gtj','gtv','gr5','gr223'];
function shortName(n){return n.replace(/\s*\(.*$/,'')}
function renderFamous(){
  var box=$('famous');box.innerHTML='';
  FAMOUS.filter(function(id){return COLBY[id]}).slice(0,9).forEach(function(id){
    var b=document.createElement('button');b.className='chip';b.textContent=shortName(COLBY[id].name[LANG]);b.title=COLBY[id].name[LANG];
    b.addEventListener('click',function(){closePops();selectCollection(id)});box.appendChild(b);
  });
}
var CUR=[['most','cMost'],['dense','cDense'],['ratio','cRatio'],['zero','cZero'],['rand','cRand']];
(function(){var box=$('curio');CUR.forEach(function(c){var b=document.createElement('button');b.className='chip fun';b.textContent=I[c[1]];b.addEventListener('click',function(){closePops();curio(c[0])});box.appendChild(b)})})();
function curio(k){
  if(!ensure())return;items();var all=ITEMS.filter(function(it){return it.deps.length>0&&it.fr>=0.85}),spec;
  if(k==='rand'){var pool=all.filter(function(it){return it.km>=10&&it.km<=150&&it.n>=1});openItem(pool[Math.floor(Math.random()*pool.length)]);return}
  exLayer.clearLayers();
  if(k==='most')spec={head:I.hMost,sub:I.sMost,base:all.slice(),sort:'n'};
  if(k==='dense')spec={head:I.hDense,sub:I.sDense,base:all.filter(function(it){return it.km>=15}),sort:'d'};
  if(k==='ratio')spec={head:I.hRatio,sub:I.sRatio,base:all.filter(function(it){return ratio(it)>=0}),sort:'r'};
  if(k==='zero')spec={head:I.hZero,sub:I.sZero,base:all.filter(function(it){return it.n===0&&it.km>=25}),sort:'l'};
  F={kmMin:0,kmMax:1e9,nMin:0,dpMax:1e9,sort:spec.sort};
  showList(spec);
  var top=sortList(filt(spec.base)).slice(0,15);fitItems(top,6);
}
function renderHome(){
  stopAnim();cur=null;curCol=null;Lspec=null;setView('home');setHash('');
  selLayer.clearLayers();recLayer.clearLayers();exLayer.clearLayers();map.closePopup();hidePanel();
  fit(FR,6);
}

/* ---------- boot */
getJSON(DATA+'overview.json').then(function(d){OV=d.routes;drawOverview(d.routes);restyle()}).catch(console.error);
getJSON(DATA+'index.json').then(function(d){index=d;d.forEach(function(it){if(typeof it[0]==='number')INAME[it[0]]=[it[1],it[2]]})}).catch(console.error);
getJSON(DATA+'elevation.json').then(function(d){ELEV=d}).catch(function(){});
getJSON(DATA+'explore.json').then(function(d){EX=d}).catch(function(){});
getJSON(DATA+'records.json').then(renderRecords).catch(console.error);
getJSON(DATA+'collections.json').then(function(d){
  COLS=d;d.forEach(function(c){COLBY[c.id]=c});renderFamous();
  var m=/^#c-(.+)$/.exec(location.hash);
  if(m&&COLBY[m[1]])selectCollection(m[1]);else if(view==='home')renderHome();
}).catch(function(){});
(function(){var m=/^#r(\d+)$/.exec(location.hash);if(m)selectRoute(+m[1])})();
window._app={get hkBase(){return Lspec&&Lspec.base},get curS(){return curS},exploreHikes:exploreHikes,selectStretch:selectStretch,setMode:function(m){cityMode=m},HK:HK,liveElev:liveElev,setElev:function(d){ELEV=d},exploreCity:exploreCity,pickCity:pickCity,exploreDept:exploreDept,exploreArea:exploreArea,curio:curio,renderHome:renderHome,selectCollection:selectCollection,selectRoute:selectRoute,map:map,get cur(){return cur},get view(){return view}};
})();
</script>
